name: Build archive and release MediaFlow v555
# v555: much faster large accounts (background cloud save, single stylesheet, cached lookups),
# external ratings by saved IDs first + ID discovery + recheck, working External ID finder,
# icon-only Sync + Full Backup shortcut, Logging popup, movable Background Processes,
# On This Day recovery, and a full data/sync/PWA audit.
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'version.json'
      - 'index.html'
      - 'src/js/runtime-order.json'
      - 'src/css-order.json'
      - 'src/js/components/394-v555-performance-core.js'
      - 'src/js/components/395-v555-background-save.js'
      - 'src/js/components/396-v555-ratings-engine.js'
      - 'src/js/components/397-v555-id-finder.js'
      - 'src/js/components/398-v555-interface.js'
      - 'assets/css/293-v555-performance.css'
      - 'tests/test-v555-release.cjs'
      - '.github/workflows/publish-v555.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v555-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build, smoke test and verify
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 555
          python3 scripts/build.py
          python3 scripts/pwa.py
          node --check assets/js/mediaflow-v555.bundle.js
          node --check sw.js
          test -s assets/css/mediaflow-v555.bundle.css
          node scripts/check-pwa-release.js
          node tests/test-v555-release.cjs
          node tests/test-v555-gateway.cjs
          node tests/test-v554-universal-id-discovery.cjs
          node tests/test-v547-external-ratings-intelligence.cjs
          node tests/test-v552-collection-delete-confirmation.cjs
          node tests/test-v551-app-wide-performance.cjs
          node tests/test-v548-logging-large-library-sort.cjs
          node tests/test-v544-xp-reward-contract.cjs
          node tests/test-v543-xp-preview-recovery.cjs
          node tests/test-v542-xp-award-parity.cjs
          node tests/test-v537-unified-xp-preview.cjs
          node tests/test-v535-cloud-reliability.cjs
          grep -q 'mediaflow-v555.bundle.js' index.html
          grep -q 'mediaflow-v555.bundle.css' index.html
          grep -q 'mediaflow-pwa-v555-shell' sw.js
          test "$(python3 -c "import json;print(json.load(open('version.json'))['build'])")" = 555
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/555
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/555/; fi
          done
          test -f legacy/v/555/assets/js/mediaflow-v555.bundle.js
          test -f legacy/v/555/assets/css/mediaflow-v555.bundle.css
          test -f legacy/v/555/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json version.json assets/js/mediaflow-v555.bundle.js assets/css/mediaflow-v555.bundle.css legacy/v/555
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v555' || true
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep 2
          done
          test "$pushed" = 1
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v555_Stable.zip HEAD:legacy/v/555
          sha256sum MediaFlow_v555_Stable.zip > MediaFlow_v555_Stable.sha256
          if ! gh release view 555 >/dev/null 2>&1; then
            gh release create 555 MediaFlow_v555_Stable.zip MediaFlow_v555_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v555 Stable' --notes-file docs/release-v555.md
          else
            git tag -f 555 "$(git rev-parse HEAD)"
            git push origin refs/tags/555 --force
            gh release upload 555 MediaFlow_v555_Stable.zip MediaFlow_v555_Stable.sha256 --clobber
          fi
