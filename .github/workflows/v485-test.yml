name: MediaFlow v485 Visual Engine Architecture & Hardening Quality Gate
on:
  push:
    branches: [feature/v485-visual-evolution-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v485-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "485"
          python scripts/build.py
          node --check src/js/components/372-v485-visual-engine-ownership.js
          node --check assets/js/mediaflow-v485.bundle.js
          node --check src/js/core/rendering/035-render-loop-init.js
          node scripts/test-v485-visual-ownership.cjs
          node scripts/test-v485-visual-compat.cjs
          node scripts/test-v485-recovery-compat.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==485
          assert 'mediaflow-v485.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=485' in sw
          assert 'mediaflow-pwa-v485-shell' in sw
          assert 'mediaflow-v485.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v485 release/PWA coherence PASS')
          PY
      - name: Behavioral theme ownership, Legacy preservation and recovery compatibility
        run: |
          node scripts/test-v485-visual-contract.cjs
          node scripts/test-v485-recovery-compat.cjs
      - name: Archive verified complete v485 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/485
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/485/
          test "$(cat legacy/v/485/VERSION)" = "485"
          test -s legacy/v/485/assets/js/mediaflow-v485.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v485.bundle.js
          git add --sparse -f legacy/v/485
          if ! git diff --cached --quiet; then
            git commit -m 'build(v485): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:feature/v485-visual-evolution-foundation
          fi
