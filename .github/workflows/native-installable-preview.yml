name: MediaFlow Native Android + Windows Preview
on:
  workflow_dispatch:
  push:
    branches:
      - native/flutter-installable-preview
      - native/v2-parity-development
      - native/v3-full-parity
      - native/v3-1-library-parity
      - native/v3-2-cinematic-ui
      - app/clean-branding-dashboard-tools
    paths:
      - 'native-preview-build/**'
      - '.github/workflows/native-installable-preview.yml'

permissions:
  contents: read

jobs:
  build:
    name: "${{ matrix.platform }} installable"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            native-preview-build
            assets/category-icons
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore MediaFlow Flutter source and original app logo
        shell: bash
        run: |
          python - <<'PY'
          import base64,io,tarfile,pathlib,shutil
          root=pathlib.Path('native-preview-build/app')
          root.mkdir(parents=True,exist_ok=True)
          compressed=base64.b64decode(''.join(pathlib.Path('native-preview-build/source-gzip.b64').read_text().split()))
          with tarfile.open(fileobj=io.BytesIO(compressed),mode='r:gz') as source:
              source.extractall(root,filter='data')
          assets=root/'assets'
          assets.mkdir(parents=True,exist_ok=True)
          (assets/'mediaflow.png').write_bytes(base64.b64decode(''.join(pathlib.Path('native-preview-build/logo.b64').read_text().split())))
          icons=assets/'category-icons'
          icons.mkdir(exist_ok=True)
          for img in pathlib.Path('assets/category-icons').glob('*.png'):
              shutil.copy2(img,icons/img.name)
          print('Native source:',len(list(root.rglob('*.dart'))),'Dart files')
          print('Category icons:',len(list(icons.glob('*.png'))))
          PY
      - name: Generate ${{ matrix.platform }} host project
        shell: bash
        working-directory: native-preview-build/app
        run: flutter create --platforms=${{ matrix.platform }} --org com.alexgodly --project-name mediaflow_native .
      - name: Install dependencies
        shell: bash
        working-directory: native-preview-build/app
        run: flutter pub get
      - name: Configure native identity and Android Internet access
        shell: bash
        working-directory: native-preview-build/app
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              content=manifest.read_text()
              if 'android.permission.INTERNET' not in content:
                  content=content.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
              content=content.replace('android:label="mediaflow_native"','android:label="MediaFlow"')
              manifest.write_text(content)
              print('Android release network permission and MediaFlow application name ready')
          PY
      - name: Apply native package and product branding
        shell: bash
        working-directory: native-preview-build/app
        run: python scripts/brand_platforms.py
      - name: Generate branded launcher icon
        shell: bash
        working-directory: native-preview-build/app
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$BUILD_PLATFORM" = "android" ]; then
            cat > flutter_launcher_icons.yaml <<'YAML'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/mediaflow.png
            adaptive_icon_background: "#0C0F17"
            adaptive_icon_foreground: assets/mediaflow.png
          YAML
          else
            cat > flutter_launcher_icons.yaml <<'YAML'
          flutter_launcher_icons:
            android: false
            ios: false
            image_path: assets/mediaflow.png
            windows:
              generate: true
              image_path: assets/mediaflow.png
              icon_size: 256
          YAML
          fi
          dart run flutter_launcher_icons
      - name: Analyze project
        shell: bash
        working-directory: native-preview-build/app
        run: flutter analyze --no-fatal-infos
      - name: Run native tests
        shell: bash
        working-directory: native-preview-build/app
        run: flutter test
      - name: Build Android APK
        if: matrix.platform == 'android'
        shell: bash
        working-directory: native-preview-build/app
        run: flutter build apk --release
      - name: Verify Android application ID in compiled APK
        if: matrix.platform == 'android'
        shell: bash
        working-directory: native-preview-build/app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep "package: name='com.alexgodly.mediaflow'"
      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-Native-Android-APK
          path: native-preview-build/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Build Windows application
        if: matrix.platform == 'windows'
        shell: bash
        working-directory: native-preview-build/app
        run: flutter build windows --release
      - name: Verify and name Windows release executable
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: native-preview-build/app
        run: |
          $dir = 'build/windows/x64/runner/Release'
          $original = Join-Path $dir 'MediaFlow.exe'
          if (!(Test-Path $original)) { throw "Windows MediaFlow.exe not generated" }
          Rename-Item $original 'MediaFlow by Alex Godly.exe'
          $renamed = Join-Path $dir 'MediaFlow by Alex Godly.exe'
          $product = (Get-Item $renamed).VersionInfo.ProductName
          $description = (Get-Item $renamed).VersionInfo.FileDescription
          Write-Host "Windows name: $renamed"
          Write-Host "Product: $product; Description: $description"
          if ($product -ne 'MediaFlow by Alex Godly' -or $description -ne 'MediaFlow by Alex Godly') {
            throw "Windows product branding metadata incorrect"
          }
      - name: Upload Windows app folder
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-Native-Windows-App
          path: native-preview-build/app/build/windows/x64/runner/Release/**
          if-no-files-found: error
