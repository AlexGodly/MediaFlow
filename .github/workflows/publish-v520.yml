name: Build archive and release MediaFlow v520
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v520.yml'
  workflow_dispatch:
  # v520 title actions; build archive, smoke tests, and stable release
  # Release workflow registration trigger: tests and full archive required
permissions:
  contents: write
concurrency:
  group: mediaflow-v520-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build and check
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 520
          python3 scripts/build.py
          node --check assets/js/mediaflow-v520.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v520-title-actions.cjs
          grep -q "registerPageRenderer('settings'" src/js/components/375-v514-canonical-category-settings.js
          grep -q 'mediaflow-v520.bundle.js' index.html
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/520
          for entry in VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/520/; fi
          done
          test -f legacy/v/520/assets/js/mediaflow-v520.bundle.js
          git add --sparse -f VERSION index.html sw.js manifest.json assets/js/mediaflow-v520.bundle.js legacy/v/520
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v520' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v520_Stable.zip HEAD:legacy/v/520
          sha256sum MediaFlow_v520_Stable.zip > MediaFlow_v520_Stable.sha256
          if ! gh release view 520 >/dev/null 2>&1; then
            gh release create 520 MediaFlow_v520_Stable.zip MediaFlow_v520_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v520 Stable' --notes 'New Add to Personal Order toggle and Add to Collection (N) multi-select picker in Add/Edit Title and Title Details. Membership changes reuse the existing Personal Order and Collection IDs, preserve all existing ordering and Library records, support draft selections for newly created titles, save through canonical cloud persistence, retain focus/scroll position, and adapt to MediaFlow themes and mobile screens. Full v520 archive, regression tests, PWA upgrade checks, and complete stable release.'
          fi
