name: Build archive and release MediaFlow v552
# v552 replaces the native collection-delete confirmation with a responsive, theme-aware dialog.
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'version.json'
      - 'index.html'
      - 'src/js/runtime-order.json'
      - 'src/js/components/392-v552-collection-delete-confirmation.js'
      - 'assets/css/292-v552-collection-delete-confirmation.css'
      - 'tests/test-v552-collection-delete-confirmation.cjs'
      - '.github/workflows/publish-v552.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v552-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build, smoke test and verify
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 552
          python3 scripts/build.py
          python3 scripts/pwa.py
          node --check assets/js/mediaflow-v552.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v552-collection-delete-confirmation.cjs
          node tests/test-v534-category-class-delete-dialog.cjs
          grep -q 'mediaflow-v552.bundle.js' index.html
          grep -q 'assets/css/292-v552-collection-delete-confirmation.css' index.html
          grep -q 'components/392-v552-collection-delete-confirmation.js' src/js/runtime-order.json
          grep -q 'mediaflow-pwa-v552-shell' sw.js
          test "$(python3 -c "import json;print(json.load(open('version.json'))['build'])")" = 552
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/552
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/552/; fi
          done
          test -f legacy/v/552/assets/js/mediaflow-v552.bundle.js
          test -f legacy/v/552/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json version.json assets/js/mediaflow-v552.bundle.js legacy/v/552
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v552' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v552_Stable.zip HEAD:legacy/v/552
          sha256sum MediaFlow_v552_Stable.zip > MediaFlow_v552_Stable.sha256
          if ! gh release view 552 >/dev/null 2>&1; then
            gh release create 552 MediaFlow_v552_Stable.zip MediaFlow_v552_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v552 Stable' --notes 'v552 Stable: Replaces the native JavaScript Delete Collection confirmation with a responsive, accessible MediaFlow dialog that follows the active theme. Cancel, Escape, close, and backdrop clicks leave the collection unchanged. Deletion still uses the existing collection removal, tombstone, cloud persistence, and refresh behavior. The Library and title progress are preserved. No Supabase schema changes.'
          fi
