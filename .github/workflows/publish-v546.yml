name: Build archive and release MediaFlow v546
# v546 adds safe recovery handoff, forced takeover and isolated queue checkpoints.
# Regression suite verifies the latest saved cursor wins over stale tab memory.
# No Library, History, XP or Supabase schema changes are part of this release.
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'tests/test-v545-startup-and-xp-preview.cjs'
      - 'tests/test-v546-recovery-lock-takeover.cjs'
      - 'version.json'
      - 'index.html'
      - 'src/js/runtime-order.json'
      - 'src/js/components/309-v424-advanced-cover-recovery.js'
      - 'src/js/components/319-v439-metadata-recovery.js'
      - 'src/js/components/386-v546-recovery-lock-takeover.js'
      - 'assets/css/290-v546-recovery-lock-takeover.css'
      - 'src/js/components/375-v514-canonical-category-settings.js'
      - 'src/js/components/381-v537-unified-xp-reward-preview.js'
      - 'src/js/components/201-v267-sync-order-balance-dynamic-cover-reliability.js'
      - 'src/js/components/383-v542-award-parity.js'
      - 'src/js/components/267-v369-itemized-logging.js'
      - 'src/js/features/rewatch/038-v121-rewatch-reread-xp.js'
      - '.github/workflows/publish-v546.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v546-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build, smoke test and check cloud safety
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 546
          python3 scripts/build.py
          node --check assets/js/mediaflow-v546.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          node tests/test-v526-universal-sort-labels.cjs
          node tests/test-v527-universal-media.cjs
          node tests/test-v528-xp-observer.cjs
          node tests/test-v529-category-icons.cjs
          node tests/test-v530-category-types.cjs
          node tests/test-v531-status-labels.cjs
          node tests/test-v532-media-type-history-stats.cjs
          node tests/test-v533-history-stats-pages.cjs
          node tests/test-v534-category-class-delete-dialog.cjs
          node tests/test-v535-cloud-reliability.cjs
          node tests/test-v536-rotation-xp.cjs
          node tests/test-v537-unified-xp-preview.cjs
          node tests/test-v538-xp-renderer-integrity.cjs
          node tests/test-v539-advanced-logging-themed-confirm.cjs
          node tests/test-v540-season-dialog-icons-and-linebreaks.cjs
          node tests/test-v541-logging-xp-recovery.cjs
          node tests/test-v542-xp-award-parity.cjs
          node tests/test-v543-xp-preview-recovery.cjs
          node tests/test-v544-xp-reward-contract.cjs
          node tests/test-v545-startup-and-xp-preview.cjs
          node tests/test-v546-recovery-lock-takeover.cjs
          grep -q 'mediaflow-v546.bundle.js' index.html
          grep -q 'assets/css/290-v546-recovery-lock-takeover.css' index.html
          grep -q 'components/386-v546-recovery-lock-takeover.js' src/js/runtime-order.json
          grep -q 'mediaflow-pwa-v546-shell' sw.js
          test "$(python3 -c "import json;print(json.load(open('version.json'))['build'])")" = 546
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/546
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/546/; fi
          done
          test -f legacy/v/546/assets/js/mediaflow-v546.bundle.js
          test -f legacy/v/546/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json version.json assets/js/mediaflow-v546.bundle.js legacy/v/546
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v546' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v546_Stable.zip HEAD:legacy/v/546
          sha256sum MediaFlow_v546_Stable.zip > MediaFlow_v546_Stable.sha256
          if ! gh release view 546 >/dev/null 2>&1; then
            gh release create 546 MediaFlow_v546_Stable.zip MediaFlow_v546_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v546 Stable' --notes 'v546 Stable: Add designed recovery lock-conflict controls for Cover Recovery and Metadata Recovery. Resume Safely requests a cooperative pause and fences the previous worker before waiting for its active legacy lease to release. Force Start fences the previous process immediately, waits for in-flight provider requests and Library saves to settle, and presents an explicit final confirmation if an unresponsive worker will not release its lease. Takeover copies the latest durable cursor into a separate per-account queue key so older tabs cannot overwrite the new checkpoint. Expired locks no longer block recovery; cancellation preserves the existing queue; cross-tab handoff asks v546 workers to pause and abort provider requests. Regression tests cover both recovery types, latest-checkpoint selection, lock fencing, queue isolation, stale lease expiry, and waiting for active leases. No Library fields, ratings, progress, History, XP or Supabase schema are changed by this feature.'
          fi
