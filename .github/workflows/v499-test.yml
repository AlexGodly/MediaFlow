name: MediaFlow v499 Added Logging Cover Layout & Interaction Quality Gate
on:
  push:
    branches: [feature/v499-logging-cover-aspect-interaction-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v499-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "499"
          python scripts/build.py
          node --check src/js/components/387-v499-logging-interaction-audit.js
          node --check assets/js/mediaflow-v499.bundle.js
          node --check src/js/core/rendering/035-render-loop-init.js
          node scripts/test-v499-logging-interactions.cjs
          node scripts/test-v499-cover-browser.cjs
          node scripts/test-v499-logging-visual-parity.cjs
          node scripts/test-v499-recovery-parity.cjs
          node scripts/test-v499-visual-direction.cjs
          node scripts/test-v499-unified-renderer.cjs
          node scripts/test-v499-artwork-reliability.cjs
          node scripts/test-v499-preview-laboratory.cjs
          node scripts/test-v499-cover-compat.cjs
          node scripts/test-v499-expressiveness-compat.cjs
          node scripts/test-v499-readability-compat.cjs
          node scripts/test-v499-mood-compat.cjs
          node scripts/test-v499-harmony-compat.cjs
          node scripts/test-v499-composition-compat.cjs
          node scripts/test-v499-artwork-compat.cjs
          node scripts/test-v499-source-compat.cjs
          node scripts/test-v499-ownership-compat.cjs
          node scripts/test-v499-visual-compat.cjs
          node scripts/test-v499-recovery-compat.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==499
          assert 'mediaflow-v499.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=499' in sw
          assert 'mediaflow-pwa-v499-shell' in sw
          assert 'mediaflow-v499.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v499 release/PWA coherence PASS')
          PY
      - name: Artwork pixel provenance, stale results, preview isolation and Legacy compatibility
        run: |
          node scripts/test-v499-ownership-compat.cjs
          node scripts/test-v499-visual-compat.cjs
          node scripts/test-v499-recovery-compat.cjs
      - name: Archive verified complete v499 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/499
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/499/
          test "$(cat legacy/v/499/VERSION)" = "499"
          test -s legacy/v/499/assets/js/mediaflow-v499.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v499.bundle.js
          git add --sparse -f legacy/v/499
          if ! git diff --cached --quiet; then
            git commit -m 'build(v499): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:feature/v499-logging-cover-aspect-interaction-audit
          fi
