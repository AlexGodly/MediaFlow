name: Build archive and release MediaFlow v512
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v512.yml'
  workflow_dispatch:
  # v512 PWA lifecycle repair release
permissions:
  contents: write
concurrency:
  group: mediaflow-v512-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build and check
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 512
          python3 scripts/build.py
          node --check assets/js/mediaflow-v512.bundle.js
          grep -q 'registerPageRenderer.*settings' src/js/components/374-v508-unified-category-panels.js
          grep -q 'mediaflow-v512.bundle.js' index.html
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/512
          for entry in VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/512/; fi
          done
          test -f legacy/v/512/assets/js/mediaflow-v512.bundle.js
          git add --sparse -f VERSION index.html sw.js manifest.json assets/js/mediaflow-v512.bundle.js legacy/v/512
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v512' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v512_Stable.zip HEAD:legacy/v/512
          sha256sum MediaFlow_v512_Stable.zip > MediaFlow_v512_Stable.sha256
          if ! gh release view 512 >/dev/null 2>&1; then
            gh release create 512 MediaFlow_v512_Stable.zip MediaFlow_v512_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v512 Stable' --notes 'Fix missing Today’s Balance and Library Overview settings in active Settings renderer. Both panels are now visible to Settings navigation and search. Rebuilt JS and PWA, preserved cloud settings, archived full v512 project.'
          fi
