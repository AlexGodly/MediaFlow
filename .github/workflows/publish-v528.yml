name: Build archive and release MediaFlow v528
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v528.yml'
  workflow_dispatch:
  # v528 hotfix: prevent recursive XP-settings injection while preserving universal media
  # CI rerun after completing the CommonJS test source identifier migration
  # Corrected v70 and v53 legacy Library dropdowns and narrowed bundle checks to sorter-specific text.
  # Release workflow registration trigger: tests and full archive required
permissions:
  contents: write
concurrency:
  group: mediaflow-v528-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build and check
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 528
          python3 scripts/build.py
          node --check assets/js/mediaflow-v528.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          node tests/test-v526-universal-sort-labels.cjs
          node tests/test-v527-universal-media.cjs
          node tests/test-v528-xp-observer.cjs
          grep -q "registerPageRenderer('settings'" src/js/components/375-v514-canonical-category-settings.js
          grep -q 'mediaflow-v528.bundle.js' index.html
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/528
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/528/; fi
          done
          test -f legacy/v/528/assets/js/mediaflow-v528.bundle.js
          test -f legacy/v/528/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json assets/js/mediaflow-v528.bundle.js legacy/v/528
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v528' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v528_Stable.zip HEAD:legacy/v/528
          sha256sum MediaFlow_v528_Stable.zip > MediaFlow_v528_Stable.sha256
          if ! gh release view 528 >/dev/null 2>&1; then
            gh release create 528 MediaFlow_v528_Stable.zip MediaFlow_v528_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v528 Stable' --notes 'MediaFlow v528 Stable hardening of v527 Universal Media: prevent the XP settings MutationObserver from recursively inserting its own generated unit controls during Settings changes, redraws and rehydration. Add regression coverage for the initial insertion, nested added frames, subsequent body scans and duplication guards. Preserve all four activity types, 15 units, Progress Reached, universal sorter wording, XP defaults and cloud/library/history compatibility without database changes. Full legacy/v/528 archive, bundle/PWA verification and Pages deployment.'
          fi
