name: Build archive and release MediaFlow v537
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v537.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v537-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build, smoke test and check cloud safety
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 537
          python3 scripts/build.py
          node --check assets/js/mediaflow-v537.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          node tests/test-v526-universal-sort-labels.cjs
          node tests/test-v527-universal-media.cjs
          node tests/test-v528-xp-observer.cjs
          node tests/test-v529-category-icons.cjs
          node tests/test-v530-category-types.cjs
          node tests/test-v531-status-labels.cjs
          node tests/test-v532-media-type-history-stats.cjs
          node tests/test-v533-history-stats-pages.cjs
          node tests/test-v534-category-class-delete-dialog.cjs
          node tests/test-v535-cloud-reliability.cjs
          node tests/test-v536-rotation-xp.cjs
          node tests/test-v537-unified-xp-preview.cjs
          grep -q 'mediaflow-v537.bundle.js' index.html
          grep -q 'mediaflow-pwa-v537-shell' sw.js
          test "$(python3 -c "import json;print(json.load(open('version.json'))['build'])")" = 537
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/537
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/537/; fi
          done
          test -f legacy/v/537/assets/js/mediaflow-v537.bundle.js
          test -f legacy/v/537/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json version.json assets/js/mediaflow-v537.bundle.js legacy/v/537
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v537' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v537_Stable.zip HEAD:legacy/v/537
          sha256sum MediaFlow_v537_Stable.zip > MediaFlow_v537_Stable.sha256
          if ! gh release view 537 >/dev/null 2>&1; then
            gh release create 537 MediaFlow_v537_Stable.zip MediaFlow_v537_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v537 Stable' --notes 'v537 Stable: Unified XP Reward Preview replaces the consumption-only card in Quick and Advanced Logging. Projects category-by-category consumption and Rotation XP, canonical System Respect XP (including recommended title slots and No-Skip/First-pick multipliers), exact session-level day streak rounding and total expected log XP. Preview uses the exact same pure respect calculation now shared with actual submit rewards, with no preview writes or XP re-awards. Updated XP History to show recorded consumption and Respect breakdowns without duplicate XP entries. Includes dynamic draft changes, mixed category, itemized runtime, mobile and reduced motion polish; regression tested four category health states, matched and unmatched recommendations, rerolls, projection-vs-actual XP, PWA/cloud continuity. Completion/repeat/other separate rewards are noted as additional awards rather than improperly included in log estimate. No Supabase changes or historical XP rewriting. Archive: legacy/v/537, Stable ZIP+SHA256 and Pages deployment.'
          fi
