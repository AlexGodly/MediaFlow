name: Build archive and release MediaFlow v527
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v527.yml'
  workflow_dispatch:
  # v527 universal category types, 15 units, Progress Reached and dynamic Stats/XP
  # CI rerun following Quick Logging message syntax correction
  # Corrected v70 and v53 legacy Library dropdowns and narrowed bundle checks to sorter-specific text.
  # Release workflow registration trigger: tests and full archive required
permissions:
  contents: write
concurrency:
  group: mediaflow-v527-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build and check
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 527
          python3 scripts/build.py
          node --check assets/js/mediaflow-v527.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          node tests/test-v526-universal-sort-labels.cjs
          node tests/test-v527-universal-media.cjs
          grep -q "registerPageRenderer('settings'" src/js/components/375-v514-canonical-category-settings.js
          grep -q 'mediaflow-v527.bundle.js' index.html
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/527
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/527/; fi
          done
          test -f legacy/v/527/assets/js/mediaflow-v527.bundle.js
          test -f legacy/v/527/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json assets/js/mediaflow-v527.bundle.js legacy/v/527
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v527' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v527_Stable.zip HEAD:legacy/v/527
          sha256sum MediaFlow_v527_Stable.zip > MediaFlow_v527_Stable.sha256
          if ! gh release view 527 >/dev/null 2>&1; then
            gh release create 527 MediaFlow_v527_Stable.zip MediaFlow_v527_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v527 Stable' --notes 'Universal media expansion on top of v526 labels: Watching/Reading/Playing/Listening activity types, 15 Add/Edit Category units including Sessions and Movies, unit-aware Progress Reached in Quick and Advanced Logging, dynamic units in Statistics, configurable default per-unit XP and repeat XP for new units, updated rewatch labels and adaptive late-rendered sorter controls. Preserve existing video and reading keys, four existing units, original Library, logging/session history, cloud state, custom settings, XP ledgers and Personal Order. No Supabase migration. Full v527 legacy archive, PWA build checks and dedicated regression tests.'
          fi
