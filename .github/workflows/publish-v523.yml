name: Build archive and release MediaFlow v523
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v523.yml'
  workflow_dispatch:
  # v523 rollback canceled title-side actions; no data model changes
  # Release workflow registration trigger: tests and full archive required
permissions:
  contents: write
concurrency:
  group: mediaflow-v523-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build and check
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 523
          python3 scripts/build.py
          node --check assets/js/mediaflow-v523.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          grep -q "registerPageRenderer('settings'" src/js/components/375-v514-canonical-category-settings.js
          grep -q 'mediaflow-v523.bundle.js' index.html
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/523
          for entry in VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/523/; fi
          done
          test -f legacy/v/523/assets/js/mediaflow-v523.bundle.js
          git add --sparse -f VERSION index.html sw.js manifest.json assets/js/mediaflow-v523.bundle.js legacy/v/523
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v523' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v523_Stable.zip HEAD:legacy/v/523
          sha256sum MediaFlow_v523_Stable.zip > MediaFlow_v523_Stable.sha256
          if ! gh release view 523 >/dev/null 2>&1; then
            gh release create 523 MediaFlow_v523_Stable.zip MediaFlow_v523_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v523 Stable' --notes 'Remove the two canceled Add to Personal Order and Add to Collection (N) buttons from the Add/Edit Title and Title Details interfaces. Remove their v520-v521 runtime/injection modules and associated CSS links, so they cannot reappear. Preserve existing Library entries, Collections, Personal Order, cloud sync, settings, history, logging, XP and established workflows without deleting or altering membership data. Add a renderer-level regression proving buttons, handlers and reinsertion modules are absent while standard title editing remains available. Package a full legacy/v/523 archive and publish the Stable release.'
          fi
