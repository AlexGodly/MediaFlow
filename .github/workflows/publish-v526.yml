name: Build archive and release MediaFlow v526
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v526.yml'
  workflow_dispatch:
  # v526 universal title-progress sorter labels, no logic or schema changes
  # Release workflow registration trigger: tests and full archive required
permissions:
  contents: write
concurrency:
  group: mediaflow-v526-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build and check
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 526
          python3 scripts/build.py
          node --check assets/js/mediaflow-v526.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          node tests/test-v526-universal-sort-labels.cjs
          grep -q "registerPageRenderer('settings'" src/js/components/375-v514-canonical-category-settings.js
          grep -q 'mediaflow-v526.bundle.js' index.html
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/526
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/526/; fi
          done
          test -f legacy/v/526/assets/js/mediaflow-v526.bundle.js
          test -f legacy/v/526/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json assets/js/mediaflow-v526.bundle.js legacy/v/526
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v526' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v526_Stable.zip HEAD:legacy/v/526
          sha256sum MediaFlow_v526_Stable.zip > MediaFlow_v526_Stable.sha256
          if ! gh release view 526 >/dev/null 2>&1; then
            gh release create 526 MediaFlow_v526_Stable.zip MediaFlow_v526_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v526 Stable' --notes 'Unify every applicable title-progress sort label across Normal and Dynamic Library, Arrange Your Session and title Logging browsers, Personal Order Add Titles and workspace, Collections title browser and Add Titles pickers, and the legacy Batch Log sort picker. Labels are Consumed progress, Total progress and Remaining progress, avoiding media-specific episodes/chapters language while keeping the existing progress, total and remaining sort keys and all underlying comparisons intact. Preserve v525 default session sorting, all title data, cloud sync, XP, History, and category settings. Include a compiled-bundle text audit and source-surface regression test, publish full legacy/v/526 archive, GitHub release and Pages deployment. The previously proposed four-activity-type expansion remains a separate upcoming feature update.'
          fi
