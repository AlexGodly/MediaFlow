name: Build archive and release MediaFlow v536
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v536.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v536-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build, smoke test and check cloud safety
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 536
          python3 scripts/build.py
          node --check assets/js/mediaflow-v536.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          node tests/test-v526-universal-sort-labels.cjs
          node tests/test-v527-universal-media.cjs
          node tests/test-v528-xp-observer.cjs
          node tests/test-v529-category-icons.cjs
          node tests/test-v530-category-types.cjs
          node tests/test-v531-status-labels.cjs
          node tests/test-v532-media-type-history-stats.cjs
          node tests/test-v533-history-stats-pages.cjs
          node tests/test-v534-category-class-delete-dialog.cjs
          node tests/test-v535-cloud-reliability.cjs
          node tests/test-v536-rotation-xp.cjs
          grep -q 'mediaflow-v536.bundle.js' index.html
          grep -q 'mediaflow-pwa-v536-shell' sw.js
          test "$(python3 -c "import json;print(json.load(open('version.json'))['build'])")" = 536
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/536
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/536/; fi
          done
          test -f legacy/v/536/assets/js/mediaflow-v536.bundle.js
          test -f legacy/v/536/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json version.json assets/js/mediaflow-v536.bundle.js legacy/v/536
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v536' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v536_Stable.zip HEAD:legacy/v/536
          sha256sum MediaFlow_v536_Stable.zip > MediaFlow_v536_Stable.sha256
          if ! gh release view 536 >/dev/null 2>&1; then
            gh release create 536 MediaFlow_v536_Stable.zip MediaFlow_v536_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v536 Stable' --notes 'v536 Stable: Fix incorrect categoryStatus(...).status lookups that forced Rotation XP to x1 despite user settings. All Quick Logging, Advanced Logging, Batch Logging, XP preview, skipped History records and edited History now use actual Neglected, Due, Healthy or Overused category health to apply configurable XP multipliers. Respect user-selected zero multipliers, preserve legacy unknown-status fallback, leave already-stored historical XP untouched and avoid duplicate XP rewards. Regression-test actual source for four health states, preview/streak math, submit paths, History edit and cloud/PWA continuity. Includes full legacy/v/536 archive, ZIP, SHA256 and GitHub Pages deployment. No Supabase schema or data migration.'
          fi
