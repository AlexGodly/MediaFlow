name: Build archive and release MediaFlow v521
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v521.yml'
  workflow_dispatch:
  # v521 direct visible title action mounting, live DOM tests and full release
  # Release workflow registration trigger: tests and full archive required
permissions:
  contents: write
concurrency:
  group: mediaflow-v521-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build and check
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 521
          python3 scripts/build.py
          node --check assets/js/mediaflow-v521.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v520-title-actions.cjs
          node tests/test-v521-visible-title-actions.cjs
          grep -q "registerPageRenderer('settings'" src/js/components/375-v514-canonical-category-settings.js
          grep -q 'mediaflow-v521.bundle.js' index.html
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/521
          for entry in VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/521/; fi
          done
          test -f legacy/v/521/assets/js/mediaflow-v521.bundle.js
          git add --sparse -f VERSION index.html sw.js manifest.json assets/js/mediaflow-v521.bundle.js legacy/v/521
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v521' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v521_Stable.zip HEAD:legacy/v/521
          sha256sum MediaFlow_v521_Stable.zip > MediaFlow_v521_Stable.sha256
          if ! gh release view 521 >/dev/null 2>&1; then
            gh release create 521 MediaFlow_v521_Stable.zip MediaFlow_v521_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v521 Stable' --notes 'Fix title action buttons not appearing in v520: v521 directly mounts and repositions visible Personal Order and Collection membership controls in the actual live Add/Edit Title modal and Title Details popup using safe DOM observation, preserving existing save/sync logic, collection selection, and per-title Personal Order toggling. Add an actual DOM-anchor regression test for both surfaces, retain v520 membership tests and historic settings/sorting/PWA tests, ensure mobile styling, produce a complete version archive and stable release.'
          fi
