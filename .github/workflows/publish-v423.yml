name: Publish MediaFlow v423 Navigation & Support (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v423.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mediaflow-v423-release
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact v422 baseline and v423 release guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 422
          test ! -e legacy/v/423
          test ! -f assets/js/mediaflow-v423.bundle.js
          test "$(git hash-object VERSION)" = 8d73f9387c81659b6eed501584b85a156d1f9a83
          test "$(git hash-object index.html)" = c4795d23d330ddac76fd6e0dbdab18da97d32ea2
          test "$(git hash-object src/js/runtime-order.json)" = f69c7cc757fbccbeed706a0c1adb4f5c2d255041
          test "$(git hash-object src/js/components/307-v422-adaptive-navigation-details-support.js)" = eacdf0cd95b6e7f80837b4a66bb4890511604215
          test "$(git hash-object README.md)" = 584640e9d204f2a6406f3e8aa520c31fd8ce21fb
          test "$(git hash-object README2.md)" = 4ea918a1e0a253336e36d463f799690684f394f0
          test -f assets/js/mediaflow-v422.bundle.js
          ! git show-ref --tags --verify --quiet refs/tags/423
          echo 'v422 source and v423 release guards verified.'

