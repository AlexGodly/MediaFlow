              p=Path(name)
              if p.is_absolute() or '..' in p.parts:raise RuntimeError('Invalid patch path')
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(z.read(name))
          print('Applied v423 source changes')
          MEDIAFLOW_V423_PATCH
          python scripts/build.py
          test "$(cat VERSION)" = 423
          test -f assets/js/mediaflow-v423.bundle.js
          test -f assets/css/234-v423-navigation-persistence-support.css
          grep -q 'mf423RestoreNavigationPreference' assets/js/mediaflow-v423.bundle.js
          grep -q 'mf423CleanNavigation' assets/js/mediaflow-v423.bundle.js
          grep -q '234-v423-navigation-persistence-support.css' index.html
          grep -q 'mediaflow-v423.bundle.js' index.html
          grep -q 'mediaflow-pwa-v423-shell-v1' sw.js
          node --check assets/js/mediaflow-v423.bundle.js
          git diff --check

      - name: Browser-test saved navigation, dock profiles, donate UI and preserved cover rendering
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/test-v423-navigation-donation.py
          python scripts/test-v423-cover-regression.py
          git diff --check

      - name: Commit complete v423 and archive full independent source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v423: repair navigation preferences and profile avatar, redesign Ko-fi support'
          mkdir -p "$RUNNER_TEMP/mediaflow-v423-source"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/node_modules/' \
            ./ "$RUNNER_TEMP/mediaflow-v423-source/"
          test -f "$RUNNER_TEMP/mediaflow-v423-source/assets/js/mediaflow-v423.bundle.js"
          test -f "$RUNNER_TEMP/mediaflow-v423-source/scripts/test-v423-navigation-donation.py"
          test ! -e "$RUNNER_TEMP/mediaflow-v423-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v423-source/beta"
          mkdir -p legacy/v/423
          rsync -a --delete "$RUNNER_TEMP/mediaflow-v423-source/" legacy/v/423/
          git add legacy/v/423
          git commit -m 'Archive complete MediaFlow v423 at legacy/v/423'
          git tag 423
          git push origin HEAD:main refs/tags/423
          echo "v423 pushed: $(git rev-parse HEAD)"

      - name: Package complete v423 modular ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import os
          src=Path(os.environ['RUNNER_TEMP'])/'mediaflow-v423-source'
          out=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v423_Modular.zip'
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for f in sorted(src.rglob('*')):
              if f.is_file():z.write(f,f.relative_to(src).as_posix())
          with ZipFile(out) as z:
            assert z.testzip() is None
            assert z.read('VERSION')==b'423\n'
            assert 'assets/js/mediaflow-v423.bundle.js' in z.namelist()
            assert 'assets/css/234-v423-navigation-persistence-support.css' in z.namelist()
            assert 'scripts/test-v423-navigation-donation.py' in z.namelist()
            assert not any(n.startswith(('legacy/','beta/','.github/')) for n in z.namelist())
          print('Complete ZIP:',out,out.stat().st_size)
          PYZIP

      - name: Publish v423 Stable release with changelog and ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 423 "$RUNNER_TEMP/MediaFlow_v423_Modular.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v423 Stable' \
            --notes-file docs/CHANGELOG_v423.md \
            --verify-tag
          gh release view 423 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare Pages artifact without legacy and beta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-v423-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-v423-site/"
          test "$(cat "$RUNNER_TEMP/mediaflow-v423-site/VERSION")" = 423
          test -f "$RUNNER_TEMP/mediaflow-v423-site/assets/js/mediaflow-v423.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v423-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v423-site/beta"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v423 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-v423-site

      - name: Deploy v423 as live website
        id: deployment
        uses: actions/deploy-pages@v4
