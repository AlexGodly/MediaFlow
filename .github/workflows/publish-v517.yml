name: Build archive and release MediaFlow v517
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v517.yml'
  workflow_dispatch:
  # v517 remaining episodes/chapters sortable Logging and Library picker
permissions:
  contents: write
concurrency:
  group: mediaflow-v517-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build and check
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 517
          python3 scripts/build.py
          node --check assets/js/mediaflow-v517.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          grep -q "registerPageRenderer('settings'" src/js/components/375-v514-canonical-category-settings.js
          grep -q 'mediaflow-v517.bundle.js' index.html
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/517
          for entry in VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/517/; fi
          done
          test -f legacy/v/517/assets/js/mediaflow-v517.bundle.js
          git add --sparse -f VERSION index.html sw.js manifest.json assets/js/mediaflow-v517.bundle.js legacy/v/517
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v517' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v517_Stable.zip HEAD:legacy/v/517
          sha256sum MediaFlow_v517_Stable.zip > MediaFlow_v517_Stable.sha256
          if ! gh release view 517 >/dev/null 2>&1; then
            gh release create 517 MediaFlow_v517_Stable.zip MediaFlow_v517_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v517 Stable' --notes 'Add Remaining episodes / chapters sorting everywhere the shared Logging sort dropdown appears: Logging draft title ordering and Add Titles from Library picker. Compute known remaining units from title total minus progress and, for Seasons View, sum per-season remaining units. Unknown totals sort last; both ascending and descending directions work. Change the default sorter to Date added to Library, newest first, including new Logging drafts and Library pickers, with safe migration of old untouched defaults. Preserve intentional custom sorting, progress, logging timestamps, History, XP, cloud data and personal order. Full archived v517 project and tested PWA.'
          fi
