      - name: Validate mobile and desktop layout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/test-v411-library-overview.py
          git diff --check

      - name: Commit v411 and archive complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v411: responsive Library Overview UI repair'
          mkdir -p "$RUNNER_TEMP/mediaflow-411-source"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/node_modules/' \
            ./ "$RUNNER_TEMP/mediaflow-411-source/"
          test -f "$RUNNER_TEMP/mediaflow-411-source/index.html"
          test -f "$RUNNER_TEMP/mediaflow-411-source/assets/css/223-v411-library-overview-responsive.css"
          test ! -e "$RUNNER_TEMP/mediaflow-411-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-411-source/beta"
          mkdir -p legacy/v/411
          rsync -a --delete "$RUNNER_TEMP/mediaflow-411-source/" legacy/v/411/
          git add legacy/v/411
          git commit -m 'Archive MediaFlow v411 at legacy/v/411'
          git tag 411
          git push origin HEAD:main refs/tags/411
          echo "Pushed MediaFlow v411: $(git rev-parse HEAD)"

      - name: Package modular source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'mediaflow-411-source'
          out=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v411_Modular.zip'
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for file in sorted(root.rglob('*')):
              if file.is_file():z.write(file,file.relative_to(root).as_posix())
          with ZipFile(out) as z:
            assert z.testzip() is None
            assert 'VERSION' in z.namelist()
            assert 'assets/css/223-v411-library-overview-responsive.css' in z.namelist()
            assert not any(x.startswith(('legacy/','beta/','.github/')) for x in z.namelist())
          print('Ready:',out,out.stat().st_size,'bytes')
          PY

      - name: Release 411 with changelog and modular ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create 411 "$RUNNER_TEMP/MediaFlow_v411_Modular.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v411 Stable' \
            --notes-file docs/CHANGELOG_v411.md \
            --verify-tag
          gh release view 411 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare v411 GitHub Pages artifact (exclude archived folders)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-411-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-411-site/"
          test -f "$RUNNER_TEMP/mediaflow-411-site/index.html"
          test -f "$RUNNER_TEMP/mediaflow-411-site/assets/css/223-v411-library-overview-responsive.css"
          test ! -e "$RUNNER_TEMP/mediaflow-411-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-411-site/beta"
          test "$(cat "$RUNNER_TEMP/mediaflow-411-site/VERSION")" = '411'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v411 site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-411-site

      - name: Deploy v411 as final live version
        id: deployment
        uses: actions/deploy-pages@v4
