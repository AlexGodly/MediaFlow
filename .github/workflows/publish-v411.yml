name: Publish MediaFlow v411 (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v411.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm exact v410 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "410"
          test ! -f assets/css/223-v411-library-overview-responsive.css
          test ! -e legacy/v/411
          test "$(git hash-object index.html)" = "6963b42d506ef32fc806b4784e75d652f997afe1"
          test "$(git hash-object README.md)" = "4f7dd2621ff49667e1783487755c226633358bad"
          test "$(git hash-object src/js/legacy/120-v188.js)" = "8dcced981fa8bfa8e2e188805bd8ebce77db94b7"
          ! git show-ref --tags --verify --quiet refs/tags/411
          echo "v410 baseline verified: $(git rev-parse --short HEAD)"

