name: Build archive and release MediaFlow v549
# v549 removes repeated whole-History scans from Dashboard category health and balance rendering.
# Regression coverage checks legacy calculation parity and 30,000-record History performance.
# No Library, History, XP or Supabase schema changes are part of this release.
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'tests/test-v544-xp-reward-contract.cjs'
      - 'tests/test-v545-startup-and-xp-preview.cjs'
      - 'tests/test-v546-recovery-lock-takeover.cjs'
      - 'version.json'
      - 'index.html'
      - 'src/js/runtime-order.json'
      - 'src/js/components/389-v549-dashboard-performance.js'
      - 'src/js/components/309-v424-advanced-cover-recovery.js'
      - 'src/js/components/319-v439-metadata-recovery.js'
      - 'src/js/components/322-v442-recovery-hardening.js'
      - 'src/js/components/386-v546-recovery-lock-takeover.js'
      - 'src/js/components/318-v439-metadata-adapters.js'
      - 'src/js/components/387-v547-external-ratings-intelligence.js'
      - 'src/js/components/388-v548-logging-large-library-sort.js'
      - 'src/js/core/runtime/149-v224-sort-foundation.js'
      - 'src/js/features/logging/153-v224-dashboard-logging-sorting.js'
      - 'tests/test-v548-logging-large-library-sort.cjs'
      - 'tests/test-v549-dashboard-performance.cjs'
      - '.github/workflows/test-v548-logging-large-library-sort.yml'
      - '.github/workflows/test-v549-dashboard-performance.yml'
      - 'assets/css/291-v547-external-ratings-intelligence.css'
      - 'tests/test-v547-external-ratings-intelligence.cjs'
      - 'assets/css/290-v546-recovery-lock-takeover.css'
      - 'src/js/components/375-v514-canonical-category-settings.js'
      - 'src/js/components/381-v537-unified-xp-reward-preview.js'
      - 'src/js/components/201-v267-sync-order-balance-dynamic-cover-reliability.js'
      - 'src/js/components/383-v542-award-parity.js'
      - 'src/js/components/267-v369-itemized-logging.js'
      - 'src/js/features/rewatch/038-v121-rewatch-reread-xp.js'
      - '.github/workflows/publish-v549.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v549-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build, smoke test and check cloud safety
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 549
          python3 scripts/build.py
          python3 scripts/pwa.py
          node --check assets/js/mediaflow-v549.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          node tests/test-v526-universal-sort-labels.cjs
          node tests/test-v527-universal-media.cjs
          node tests/test-v528-xp-observer.cjs
          node tests/test-v529-category-icons.cjs
          node tests/test-v530-category-types.cjs
          node tests/test-v531-status-labels.cjs
          node tests/test-v532-media-type-history-stats.cjs
          node tests/test-v533-history-stats-pages.cjs
          node tests/test-v534-category-class-delete-dialog.cjs
          node tests/test-v535-cloud-reliability.cjs
          node tests/test-v536-rotation-xp.cjs
          node tests/test-v537-unified-xp-preview.cjs
          node tests/test-v538-xp-renderer-integrity.cjs
          node tests/test-v539-advanced-logging-themed-confirm.cjs
          node tests/test-v540-season-dialog-icons-and-linebreaks.cjs
          node tests/test-v541-logging-xp-recovery.cjs
          node tests/test-v542-xp-award-parity.cjs
          node tests/test-v543-xp-preview-recovery.cjs
          node tests/test-v544-xp-reward-contract.cjs
          node tests/test-v545-startup-and-xp-preview.cjs
          node tests/test-v546-recovery-lock-takeover.cjs
          node tests/test-v547-external-ratings-intelligence.cjs
          node tests/test-v548-logging-large-library-sort.cjs
          grep -q 'mediaflow-v549.bundle.js' index.html
          grep -q 'assets/css/290-v546-recovery-lock-takeover.css' index.html
          grep -q 'components/386-v546-recovery-lock-takeover.js' src/js/runtime-order.json
          grep -q 'components/387-v547-external-ratings-intelligence.js' src/js/runtime-order.json
          grep -q 'components/388-v548-logging-large-library-sort.js' src/js/runtime-order.json
          grep -q 'components/389-v549-dashboard-performance.js' src/js/runtime-order.json
          grep -q 'assets/css/291-v547-external-ratings-intelligence.css' index.html
          grep -q 'mediaflow-pwa-v549-shell' sw.js
          test "$(python3 -c "import json;print(json.load(open('version.json'))['build'])")" = 549
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/549
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/549/; fi
          done
          test -f legacy/v/549/assets/js/mediaflow-v549.bundle.js
          test -f legacy/v/549/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json version.json assets/js/mediaflow-v549.bundle.js legacy/v/549
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v549' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v549_Stable.zip HEAD:legacy/v/549
          sha256sum MediaFlow_v549_Stable.zip > MediaFlow_v549_Stable.sha256
          if ! gh release view 549 >/dev/null 2>&1; then
            gh release create 549 MediaFlow_v549_Stable.zip MediaFlow_v549_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v549 Stable' --notes 'v549 Stable: Fixes severe responsiveness stalls in Dashboard Logging with large Libraries. Logging now builds a cached search index with precomputed normalized sort keys and a single reusable natural-language collator, then reuses sorted indexes as the user types or changes filters. Search, category/status/priority filtering, ascending/descending sorting and stable tie behavior are preserved. Relevant Library or category-name changes invalidate the cache before results are returned. Regression coverage compares old and optimized search/filter/sort results and exercises 30,000 titles. This is a read-only performance optimization: no Library, progress, History, XP, personal order, collection, cloud data, or Supabase schema changes.'
          fi
