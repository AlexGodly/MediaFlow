name: MediaFlow v460 Quick Actions and Background Processes Quality Gate
on:
  push:
    branches: [feature/v460-quick-actions-background-processes]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v460-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build v460 and verify syntax
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "460"
          python scripts/build.py
          node --check assets/js/mediaflow-v460.bundle.js
          node --check src/js/components/330-v450-universal-metadata-expansion.js
          node --check src/js/components/331-v451-recovery-stop-priority.js
          node --check src/js/components/332-v452-recovery-control-polish.js
          node --check src/js/components/333-v453-recovery-presets.js
          node --check src/js/components/334-v453-quick-title-recovery.js
          node --check src/js/components/335-v454-preset-layout.js
          node --check src/js/components/336-v454-quick-title-hardening.js
          node --check src/js/components/337-v455-workspace-direct-recovery.js
          node --check src/js/components/338-v455-recovery-handoff-visibility.js
          node --check src/js/components/339-v456-quick-cover-candidates.js
          node --check src/js/components/340-v456-recovery-start-status.js
          node --check src/js/components/341-v457-recovery-interaction-fixes.js
          node --check src/js/components/342-v458-recovery-dialog-quick-actions.js
          node --check src/js/components/343-v459-retire-cover-only-floating-widget.js
          node --check src/js/components/344-v460-quick-recovery-widget-toggle.js
          node --check scripts/test-v460-floating-shortcuts.cjs
          node --check scripts/test-v460-floating-shortcuts.cjs
          node --check scripts/test-v458-quick-recovery.cjs
          node --check scripts/test-v457-interactions.cjs
          node --check scripts/test-v455-unified-recovery.cjs
          node --check scripts/test-v455-quick-save.cjs
          node --check scripts/test-v456-quick-choices.cjs
          node --check scripts/test-v454-quick-ui-hardening.cjs
          node --check scripts/test-v453-quick-presets.cjs
          node --check scripts/test-v452-recovery-controls.cjs
          node --check scripts/test-v451-recovery-stop-priority.cjs
          node --check scripts/test-v450-metadata-expansion.cjs
          node --check scripts/test-v460-browser.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate existing authenticated provider gateway
        run: deno check --node-modules-dir=auto supabase/functions/mediaflow-api-gateway/index.ts
      - name: Verify metadata, recovery, existing features and PWA
        run: |
          set -euo pipefail
          # v460-specific assertions must run against the real release version.
          node scripts/test-v460-floating-shortcuts.cjs
          # Historical regression contracts predate v460 and validate their
          # v459 snapshot. Supply their expected VERSION only for that pass;
          # restore v460 before all current-version checks and publishing.
          echo 459 > VERSION
          node scripts/test-v455-unified-recovery.cjs
          node scripts/test-v455-quick-save.cjs
          node scripts/test-v456-quick-choices.cjs
          node scripts/test-v457-interactions.cjs
          node scripts/test-v458-quick-recovery.cjs
          node scripts/test-v454-quick-ui-hardening.cjs
          node scripts/test-v453-quick-presets.cjs
          node scripts/test-v452-recovery-controls.cjs
          node scripts/test-v451-recovery-stop-priority.cjs
          node scripts/test-v450-metadata-expansion.cjs
          node scripts/test-v437-universal-metadata.cjs
          node scripts/test-v437-editor-layout.cjs
          node scripts/test-v439-metadata-engine.cjs
          node scripts/test-v438-provider-registry.cjs
          node scripts/test-v440-cover-adapters.cjs
          node scripts/test-v441-recovery-workspace.cjs
          node scripts/test-v442-recovery-hardening.cjs
          node scripts/test-v443-provider-availability.cjs
          node scripts/test-v444-recovery-ui.cjs
          node scripts/test-v445-workspace.cjs
          node scripts/test-v446-recovery-controls.cjs
          node scripts/test-v447-universal-recovery.cjs
          node scripts/test-v448-smart-autofill.cjs
          node scripts/test-v431-cover-autosave.cjs
          node scripts/test-v433-id-foundation.cjs
          node scripts/test-v434-gateway.cjs
          node scripts/test-v435-omdb.cjs
          node scripts/test-v425-recovery.cjs
          node scripts/test-v427-cover-universal-id.cjs
          node scripts/check-settings-style.cjs
          echo 460 > VERSION
          python scripts/check.py
      - name: Desktop and 360px mobile Chromium browser smoke
        run: node scripts/test-v460-browser.cjs
      - name: Commit verified bundle and complete v460 source archive
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/460
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/460/
          test "$(cat legacy/v/460/VERSION)" = 460
          test -s legacy/v/460/assets/js/mediaflow-v460.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v460.bundle.js
          git add --sparse -f legacy/v/460
          if ! git diff --cached --quiet; then
            git commit -m 'build(v460): verified site and full legacy archive [skip ci]'
            git push origin HEAD:feature/v460-quick-actions-background-processes
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mediaflow-v460-verified-smoke
          path: |
            artifacts/v460-browser-smoke/
            version.json
