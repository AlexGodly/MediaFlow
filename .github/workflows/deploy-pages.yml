name: Deploy MediaFlow (exclude legacy and beta)

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build archive and release MediaFlow v550", "Build archive and release MediaFlow v551", "Build archive and release MediaFlow v552"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # A release workflow can publish its generated commit using GITHUB_TOKEN,
    # which does not trigger another push workflow. workflow_run explicitly
    # chains Pages deployment after the v550 release workflow completes.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current app without historical archives
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false

      - name: Build and verify the actual deployable version
        run: |
          set -euo pipefail
          python3 scripts/build.py
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          node tests/test-v526-universal-sort-labels.cjs
          node tests/test-v527-universal-media.cjs
          node tests/test-v528-xp-observer.cjs
          node tests/test-v529-category-icons.cjs
          node tests/test-v530-category-types.cjs
          node tests/test-v531-status-labels.cjs
          node tests/test-v532-media-type-history-stats.cjs
          node tests/test-v533-history-stats-pages.cjs
          node tests/test-v534-category-class-delete-dialog.cjs
          node tests/test-v535-cloud-reliability.cjs
          node tests/test-v536-rotation-xp.cjs
          node tests/test-v537-unified-xp-preview.cjs
          node tests/test-v538-xp-renderer-integrity.cjs
          node tests/test-v539-advanced-logging-themed-confirm.cjs
          node tests/test-v540-season-dialog-icons-and-linebreaks.cjs
          node tests/test-v541-logging-xp-recovery.cjs
          node tests/test-v542-xp-award-parity.cjs
          node tests/test-v543-xp-preview-recovery.cjs
          node tests/test-v544-xp-reward-contract.cjs
          node tests/test-v545-startup-and-xp-preview.cjs
          node tests/test-v546-recovery-lock-takeover.cjs
          node tests/test-v547-external-ratings-intelligence.cjs
          node tests/test-v548-logging-large-library-sort.cjs
          node tests/test-v549-dashboard-performance.cjs
          node tests/test-v550-dashboard-responsiveness.cjs
          node tests/test-v551-app-wide-performance.cjs
          node tests/test-v552-collection-delete-confirmation.cjs
          version="$(cat VERSION)"
          grep -q "mediaflow-v${version}.bundle.js" index.html
          grep -q "const MEDIAFLOW_VERSION=${version};" sw.js
          test -s "assets/js/mediaflow-v${version}.bundle.js"

      - name: Prepare site without legacy or beta
        run: |
          mkdir -p "$RUNNER_TEMP/mediaflow-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-site/"
          test -f "$RUNNER_TEMP/mediaflow-site/index.html"
          test ! -e "$RUNNER_TEMP/mediaflow-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-site/beta"
          du -sh "$RUNNER_TEMP/mediaflow-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
