name: Build archive and release MediaFlow v551
# v551 targets the app-wide stalls caused by repeated large-Library work on the UI thread.
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'version.json'
      - 'index.html'
      - 'src/js/runtime-order.json'
      - 'src/js/components/388-v548-logging-large-library-sort.js'
      - 'src/js/components/391-v551-app-wide-performance.js'
      - 'tests/test-v548-logging-large-library-sort.cjs'
      - 'tests/test-v549-dashboard-performance.cjs'
      - 'tests/test-v550-dashboard-responsiveness.cjs'
      - 'tests/test-v551-app-wide-performance.cjs'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/publish-v551.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v551-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build, smoke test and check cloud safety
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 551
          python3 scripts/build.py
          python3 scripts/pwa.py
          node --check assets/js/mediaflow-v551.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          node tests/test-v526-universal-sort-labels.cjs
          node tests/test-v527-universal-media.cjs
          node tests/test-v528-xp-observer.cjs
          node tests/test-v529-category-icons.cjs
          node tests/test-v530-category-types.cjs
          node tests/test-v531-status-labels.cjs
          node tests/test-v532-media-type-history-stats.cjs
          node tests/test-v533-history-stats-pages.cjs
          node tests/test-v534-category-class-delete-dialog.cjs
          node tests/test-v535-cloud-reliability.cjs
          node tests/test-v536-rotation-xp.cjs
          node tests/test-v537-unified-xp-preview.cjs
          node tests/test-v538-xp-renderer-integrity.cjs
          node tests/test-v539-advanced-logging-themed-confirm.cjs
          node tests/test-v540-season-dialog-icons-and-linebreaks.cjs
          node tests/test-v541-logging-xp-recovery.cjs
          node tests/test-v542-xp-award-parity.cjs
          node tests/test-v543-xp-preview-recovery.cjs
          node tests/test-v544-xp-reward-contract.cjs
          node tests/test-v545-startup-and-xp-preview.cjs
          node tests/test-v546-recovery-lock-takeover.cjs
          node tests/test-v547-external-ratings-intelligence.cjs
          node tests/test-v548-logging-large-library-sort.cjs
          node tests/test-v549-dashboard-performance.cjs
          node tests/test-v550-dashboard-responsiveness.cjs
          node tests/test-v551-app-wide-performance.cjs
          grep -q 'mediaflow-v551.bundle.js' index.html
          grep -q 'assets/css/290-v546-recovery-lock-takeover.css' index.html
          grep -q 'components/386-v546-recovery-lock-takeover.js' src/js/runtime-order.json
          grep -q 'components/387-v547-external-ratings-intelligence.js' src/js/runtime-order.json
          grep -q 'components/388-v548-logging-large-library-sort.js' src/js/runtime-order.json
          grep -q 'components/390-v550-dashboard-responsiveness.js' src/js/runtime-order.json
          grep -q 'components/391-v551-app-wide-performance.js' src/js/runtime-order.json
          grep -q 'assets/css/291-v547-external-ratings-intelligence.css' index.html
          grep -q 'mediaflow-pwa-v551-shell' sw.js
          test "$(python3 -c "import json;print(json.load(open('version.json'))['build'])")" = 551
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/551
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/551/; fi
          done
          test -f legacy/v/551/assets/js/mediaflow-v551.bundle.js
          test -f legacy/v/551/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json version.json assets/js/mediaflow-v551.bundle.js legacy/v/551
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v551' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v551_Stable.zip HEAD:legacy/v/551
          sha256sum MediaFlow_v551_Stable.zip > MediaFlow_v551_Stable.sha256
          if ! gh release view 551 >/dev/null 2>&1; then
            gh release create 551 MediaFlow_v551_Stable.zip MediaFlow_v551_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v551 Stable' --notes 'v551 Stable: Removes the repeated full-Library validation pass from Logging search, reuses pre-indexed title metadata and lazy sorted indexes in Batch Log, and avoids rebuilding all Library caches when only last-seen metadata changes. Last-seen persistence is deferred to idle time where supported. These changes target app-wide main-thread stalls affecting selection, editing, navigation, and large-Library interactions. Existing search/filter/sort behavior and user data remain authoritative. No Supabase schema changes.'
          fi
