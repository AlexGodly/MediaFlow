name: Build archive and release MediaFlow v545
# v545 verifies promised XP equals credited XP, with malformed saved-data hardening.
# Regression suite includes later runtime-extension ordering.
# Covers live season drafts and cancellation safety.
# Validates v537 projection plus the v545 confirmation presentation.
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'tests/test-v545-startup-and-xp-preview.cjs'
      - 'src/js/components/375-v514-canonical-category-settings.js'
      - 'src/js/components/381-v537-unified-xp-reward-preview.js'
      - 'src/js/components/201-v267-sync-order-balance-dynamic-cover-reliability.js'
      - 'src/js/components/383-v542-award-parity.js'
      - 'src/js/components/267-v369-itemized-logging.js'
      - 'src/js/features/rewatch/038-v121-rewatch-reread-xp.js'
      - '.github/workflows/publish-v545.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v545-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build, smoke test and check cloud safety
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 545
          python3 scripts/build.py
          node --check assets/js/mediaflow-v545.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          node tests/test-v526-universal-sort-labels.cjs
          node tests/test-v527-universal-media.cjs
          node tests/test-v528-xp-observer.cjs
          node tests/test-v529-category-icons.cjs
          node tests/test-v530-category-types.cjs
          node tests/test-v531-status-labels.cjs
          node tests/test-v532-media-type-history-stats.cjs
          node tests/test-v533-history-stats-pages.cjs
          node tests/test-v534-category-class-delete-dialog.cjs
          node tests/test-v535-cloud-reliability.cjs
          node tests/test-v536-rotation-xp.cjs
          node tests/test-v537-unified-xp-preview.cjs
          node tests/test-v538-xp-renderer-integrity.cjs
          node tests/test-v539-advanced-logging-themed-confirm.cjs
          node tests/test-v540-season-dialog-icons-and-linebreaks.cjs
          node tests/test-v541-logging-xp-recovery.cjs
          node tests/test-v542-xp-award-parity.cjs
          node tests/test-v543-xp-preview-recovery.cjs
          node tests/test-v544-xp-reward-contract.cjs
          node tests/test-v545-startup-and-xp-preview.cjs
          grep -q 'mediaflow-v545.bundle.js' index.html
          grep -q 'mediaflow-pwa-v545-shell' sw.js
          test "$(python3 -c "import json;print(json.load(open('version.json'))['build'])")" = 545
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/545
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/545/; fi
          done
          test -f legacy/v/545/assets/js/mediaflow-v545.bundle.js
          test -f legacy/v/545/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json version.json assets/js/mediaflow-v545.bundle.js legacy/v/545
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v545' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v545_Stable.zip HEAD:legacy/v/545
          sha256sum MediaFlow_v545_Stable.zip > MediaFlow_v545_Stable.sha256
          if ! gh release view 545 >/dev/null 2>&1; then
            gh release create 545 MediaFlow_v545_Stable.zip MediaFlow_v545_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v545 Stable' --notes 'v545 Stable: Repair a production-blocking JavaScript ReferenceError in v514 Settings/Balance integration. Removed the unconditional reference to a retired v264BalanceMarkup renderer; the optional legacy renderer is extended only if present. This restores initialization of all later runtime extensions, including XP projection, live Logging card repair and v544 reward guarantee. Hoist v537 numeric and formatting helpers so an early Logging render cannot trigger a temporal-dead-zone crash. Guard the retired v265 Balance enhancement to avoid unrelated Dashboard errors. Regression tests reproduce startup with the legacy function absent and present, early XP helper usage, Advanced Logging 15 units/3h30m, preservation of the XP guarantee, and production bundle ordering. No Supabase schema change, History rewrite or XP adjustment. Publish full legacy/v/545 archive, Stable ZIP, SHA256 and GitHub Pages deployment.'
          fi
