name: Build archive and release MediaFlow v544
# v544 verifies promised XP equals credited XP, with malformed saved-data hardening.
# Regression suite includes later runtime-extension ordering.
# Covers live season drafts and cancellation safety.
# Validates v537 projection plus the v544 confirmation presentation.
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'tests/test-v544-xp-reward-contract.cjs'
      - 'src/js/components/385-v544-reward-contract.js'
      - 'src/js/components/383-v542-award-parity.js'
      - 'src/js/components/267-v369-itemized-logging.js'
      - 'src/js/features/rewatch/038-v121-rewatch-reread-xp.js'
      - '.github/workflows/publish-v544.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v544-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build, smoke test and check cloud safety
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 544
          python3 scripts/build.py
          node --check assets/js/mediaflow-v544.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          node tests/test-v526-universal-sort-labels.cjs
          node tests/test-v527-universal-media.cjs
          node tests/test-v528-xp-observer.cjs
          node tests/test-v529-category-icons.cjs
          node tests/test-v530-category-types.cjs
          node tests/test-v531-status-labels.cjs
          node tests/test-v532-media-type-history-stats.cjs
          node tests/test-v533-history-stats-pages.cjs
          node tests/test-v534-category-class-delete-dialog.cjs
          node tests/test-v535-cloud-reliability.cjs
          node tests/test-v536-rotation-xp.cjs
          node tests/test-v537-unified-xp-preview.cjs
          node tests/test-v538-xp-renderer-integrity.cjs
          node tests/test-v539-advanced-logging-themed-confirm.cjs
          node tests/test-v540-season-dialog-icons-and-linebreaks.cjs
          node tests/test-v541-logging-xp-recovery.cjs
          node tests/test-v542-xp-award-parity.cjs
          node tests/test-v543-xp-preview-recovery.cjs
          node tests/test-v544-xp-reward-contract.cjs
          grep -q 'mediaflow-v544.bundle.js' index.html
          grep -q 'mediaflow-pwa-v544-shell' sw.js
          test "$(python3 -c "import json;print(json.load(open('version.json'))['build'])")" = 544
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/544
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/544/; fi
          done
          test -f legacy/v/544/assets/js/mediaflow-v544.bundle.js
          test -f legacy/v/544/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json version.json assets/js/mediaflow-v544.bundle.js legacy/v/544
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v544' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v544_Stable.zip HEAD:legacy/v/544
          sha256sum MediaFlow_v544_Stable.zip > MediaFlow_v544_Stable.sha256
          if ! gh release view 544 >/dev/null 2>&1; then
            gh release create 544 MediaFlow_v544_Stable.zip MediaFlow_v544_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v544 Stable' --notes 'v544 Stable: Strengthen the Logging XP reward contract and eliminate the known failure sources behind the XP preview. Validate malformed or imported Advanced Logging unit records and protect canonical repeat/progress readers. Preserve full read-only v542/v543 Consumption, Rotation, System Respect, streak, repeat and milestone calculations for valid drafts. Add a session-keyed, one-time XP shortfall guarantee: after successful submission, compare actual canonical account XP delta with the fully verified preview, and credit any shortfall once in the protected XP ledger, with idempotent cloud max-merging, historical deletion protection and accurate level/history metrics. Partial or invalid drafts never create promised amounts or award XP. Add regression tests for exact awards, 15-unit/3h30 drafts, mismatched awards, two consecutive logs with shared group IDs, duplicate cloud merges, removed sessions and invalid units. No Supabase schema changes, no bulk historical XP rewriting. Publish complete legacy/v/544 archive and stable ZIP plus SHA256, and deploy GitHub Pages.'
          fi
