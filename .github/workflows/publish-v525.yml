name: Build archive and release MediaFlow v525
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v525.yml'
  workflow_dispatch:
  # v525 session-only logging sort defaults and draft update recency
  # Retested legacy v517 sorter expectations after session-only default change.
  # Release workflow registration trigger: tests and full archive required
permissions:
  contents: write
concurrency:
  group: mediaflow-v525-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build and check
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 525
          python3 scripts/build.py
          node --check assets/js/mediaflow-v525.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          grep -q "registerPageRenderer('settings'" src/js/components/375-v514-canonical-category-settings.js
          grep -q 'mediaflow-v525.bundle.js' index.html
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/525
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/525/; fi
          done
          test -f legacy/v/525/assets/js/mediaflow-v525.bundle.js
          test -f legacy/v/525/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json assets/js/mediaflow-v525.bundle.js legacy/v/525
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v525' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v525_Stable.zip HEAD:legacy/v/525
          sha256sum MediaFlow_v525_Stable.zip > MediaFlow_v525_Stable.sha256
          if ! gh release view 525 >/dev/null 2>&1; then
            gh release create 525 MediaFlow_v525_Stable.zip MediaFlow_v525_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v525 Stable' --notes 'Logging Arrange Your Session only: change default sorter to Added to Logging (most recently added first) and add Last updated in draft, ordered by each draft title edit time, with reversible ASC/DESC. Read existing per-entry and per-unit change timestamps, stamp Quick Logging progress edits, and refresh the on-screen session sequence without rewriting draft entry arrays, changing logged watched-at times, touching Library progress or changing the separate all-Library picker. Safely migrate the previous default once while preserving custom/manual, random and other explicitly selected orderings. Regression tests cover sorting, migration, picker exclusion, quick draft timestamps, cloud-draft compatible state, README, and existing PWA and Library settings checks. Full v525 archive and stable release.'
          fi
