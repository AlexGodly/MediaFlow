name: Build archive and release MediaFlow v540
# v540 verifies semantic Keep/Replace icons and true paragraph formatting.
# Covers live season drafts and cancellation safety.
# Validates v537 projection plus the v540 confirmation presentation.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v540.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v540-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build, smoke test and check cloud safety
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 540
          python3 scripts/build.py
          node --check assets/js/mediaflow-v540.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          node tests/test-v517-remaining-sort.cjs
          node tests/test-v518-library-sort.cjs
          node tests/test-v523-canceled-title-actions.cjs
          node tests/test-v524-readme.cjs
          node tests/test-v525-session-draft-sort.cjs
          node tests/test-v526-universal-sort-labels.cjs
          node tests/test-v527-universal-media.cjs
          node tests/test-v528-xp-observer.cjs
          node tests/test-v529-category-icons.cjs
          node tests/test-v530-category-types.cjs
          node tests/test-v531-status-labels.cjs
          node tests/test-v532-media-type-history-stats.cjs
          node tests/test-v533-history-stats-pages.cjs
          node tests/test-v534-category-class-delete-dialog.cjs
          node tests/test-v535-cloud-reliability.cjs
          node tests/test-v536-rotation-xp.cjs
          node tests/test-v537-unified-xp-preview.cjs
          node tests/test-v538-xp-renderer-integrity.cjs
          node tests/test-v539-advanced-logging-themed-confirm.cjs
          node tests/test-v540-season-dialog-icons-and-linebreaks.cjs
          grep -q 'mediaflow-v540.bundle.js' index.html
          grep -q 'mediaflow-pwa-v540-shell' sw.js
          test "$(python3 -c "import json;print(json.load(open('version.json'))['build'])")" = 540
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/540
          for entry in README.md LICENSE icon.svg VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/540/; fi
          done
          test -f legacy/v/540/assets/js/mediaflow-v540.bundle.js
          test -f legacy/v/540/README.md
          git add --sparse -f README.md VERSION index.html sw.js manifest.json version.json assets/js/mediaflow-v540.bundle.js legacy/v/540
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v540' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v540_Stable.zip HEAD:legacy/v/540
          sha256sum MediaFlow_v540_Stable.zip > MediaFlow_v540_Stable.sha256
          if ! gh release view 540 >/dev/null 2>&1; then
            gh release create 540 MediaFlow_v540_Stable.zip MediaFlow_v540_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v540 Stable' --notes 'v540 Stable: Fix Advanced Logging themed confirmation formatting by rendering actual paragraph breaks instead of literal escaped backslash-n sequences. Use clear semantic SVG action icons: shield-check for Keep detailed entries, list-pencil for Replace season entries, replacing the meaningless matching circled-arrow icons. The icon system recognizes these owned SVGs without adding duplicates; responsive side-by-side buttons use the active MediaFlow theme. For categories without seasons (such as games and sessions) the message now names the title directly and omits misleading references to other seasons. Maintains v539 nondestructive cancel, draft race guards, and safe cloud merge behavior. Regression tests validate rendered HTML, both distinct icons, formatting, seasonless dialog copy, Quick/Advanced XP/cloud/PWA continuity. No Supabase changes or historical XP modifications. Includes complete legacy/v/540 archive, Stable ZIP/SHA256 and GitHub Pages deployment.'
          fi
