name: Publish MediaFlow v412 (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v412.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm exact v411 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "411"
          test -f assets/css/223-v411-library-overview-responsive.css
          test ! -f assets/css/224-v412-library-overview-live-layout.css
          test ! -e legacy/v/412
          test "$(git hash-object index.html)" = "251130c2c46b1645e95e5d86f001586ad9c4e87"
          test "$(git hash-object README.md)" = "2bc0bc9b85fbb993eca753cefe00a2dcf1e010f6"
          test "$(git hash-object src/js/legacy/120-v188.js)" = "8dcced981fa8bfa8e2e188805bd8ebce77db94b7"
          ! git show-ref --tags --verify --quiet refs/tags/412
          echo "v411 baseline verified: $(git rev-parse --short HEAD)"

