          grep -q 'mf412-overview-label' assets/js/mediaflow-v412.bundle.js
          grep -q 'v188-library-overview-block' assets/css/224-v412-library-overview-live-layout.css
          grep -q '224-v412-library-overview-live-layout.css' index.html
          grep -q '224-v412-library-overview-live-layout.css' sw.js
          grep -q 'mediaflow-pwa-v412-shell-v1' sw.js
          test "$(node --check assets/js/mediaflow-v412.bundle.js 2>&1 | wc -l)" -eq 0
          git diff --check

      - name: Validate mobile and desktop layout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/test-v412-library-overview-real-root.py
          git diff --check

      - name: Commit v412 and archive complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v412: fix production Library Overview card layout'
          mkdir -p "$RUNNER_TEMP/mediaflow-412-source"
          rsync -a \\
            --exclude='/.git/' \\
            --exclude='/.github/' \\
            --exclude='/legacy/' \\
            --exclude='/beta/' \\
            --exclude='/node_modules/' \\
            ./ "$RUNNER_TEMP/mediaflow-412-source/"
          test -f "$RUNNER_TEMP/mediaflow-412-source/index.html"
          test -f "$RUNNER_TEMP/mediaflow-412-source/assets/css/224-v412-library-overview-live-layout.css"
          test ! -e "$RUNNER_TEMP/mediaflow-412-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-412-source/beta"
          mkdir -p legacy/v/412
          rsync -a --delete "$RUNNER_TEMP/mediaflow-412-source/" legacy/v/412/
          git add legacy/v/412
          git commit -m 'Archive MediaFlow v412 at legacy/v/412'
          git tag 412
          git push origin HEAD:main refs/tags/412
          echo "Pushed MediaFlow v412: $(git rev-parse HEAD)"

      - name: Package modular source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'mediaflow-412-source'
          out=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v412_Modular.zip'
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for file in sorted(root.rglob('*')):
              if file.is_file():z.write(file,file.relative_to(root).as_posix())
          with ZipFile(out) as z:
            assert z.testzip() is None
            assert 'VERSION' in z.namelist()
            assert 'assets/css/224-v412-library-overview-live-layout.css' in z.namelist()
            assert not any(x.startswith(('legacy/','beta/','.github/')) for x in z.namelist())
          print('Ready:',out,out.stat().st_size,'bytes')
          PY

      - name: Release 412 with changelog and modular ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create 412 "$RUNNER_TEMP/MediaFlow_v412_Modular.zip" \\
            --repo "$GITHUB_REPOSITORY" \\
            --title 'v412 Hotfix' \\
            --notes-file docs/CHANGELOG_v412.md \\
            --verify-tag
          gh release view 412 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare v412 GitHub Pages artifact (exclude archived folders)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-412-site"
          rsync -a \\
            --exclude='/legacy/' \\
            --exclude='/beta/' \\
            --exclude='/.git/' \\
            --exclude='/.github/' \\
            ./ "$RUNNER_TEMP/mediaflow-412-site/"
          test -f "$RUNNER_TEMP/mediaflow-412-site/index.html"
          test -f "$RUNNER_TEMP/mediaflow-412-site/assets/css/224-v412-library-overview-live-layout.css"
          test ! -e "$RUNNER_TEMP/mediaflow-412-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-412-site/beta"
          test "$(cat "$RUNNER_TEMP/mediaflow-412-site/VERSION")" = '412'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v412 site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-412-site

      - name: Deploy v412 as final live version
        id: deployment
        uses: actions/deploy-pages@v4

