name: Build archive and release MediaFlow v515
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v515.yml'
  workflow_dispatch:
  # v515 icon-free accessible category controls and regression tests
permissions:
  contents: write
concurrency:
  group: mediaflow-v515-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Build and check
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 515
          python3 scripts/build.py
          node --check assets/js/mediaflow-v515.bundle.js
          node --check sw.js
          node scripts/check-pwa-release.js
          node tests/test-v514-category-settings.cjs
          grep -q "registerPageRenderer('settings'" src/js/components/375-v514-canonical-category-settings.js
          grep -q 'mediaflow-v515.bundle.js' index.html
      - name: Archive complete version
        run: |
          set -euo pipefail
          mkdir -p legacy/v/515
          for entry in VERSION version.json index.html sw.js manifest.json assets src scripts docs supabase; do
            if [ -e "$entry" ]; then cp -a "$entry" legacy/v/515/; fi
          done
          test -f legacy/v/515/assets/js/mediaflow-v515.bundle.js
          git add --sparse -f VERSION index.html sw.js manifest.json assets/js/mediaflow-v515.bundle.js legacy/v/515
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: build and archive MediaFlow v515' || true
          git push origin HEAD:main
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip --output=MediaFlow_v515_Stable.zip HEAD:legacy/v/515
          sha256sum MediaFlow_v515_Stable.zip > MediaFlow_v515_Stable.sha256
          if ! gh release view 515 >/dev/null 2>&1; then
            gh release create 515 MediaFlow_v515_Stable.zip MediaFlow_v515_Stable.sha256 --target "$(git rev-parse HEAD)" --title 'v515 Stable' --notes 'Replace auto-iconified custom category visibility buttons with accessible native checkboxes in both Dashboard Today’s Balance and Library Overview Display settings. Unchecked categories now have a clean empty box without the circular arrow or minus; checked categories display a native checkmark. Preserve show/hide, custom order, settings sources, cloud synchronization, and all existing data. Add regression tests for both panels and verify app JavaScript, PWA lifecycle, complete archive, and deployment.'
          fi
