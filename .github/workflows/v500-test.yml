name: MediaFlow v500 Logging Poster Size & Clean Icon Quality Gate
on:
  push:
    branches: [feature/v500-logging-cover-size-clean-icons]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v500-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "500"
          python scripts/build.py
          node --check src/js/components/388-v500-clean-logging-posters.js
          node --check assets/js/mediaflow-v500.bundle.js
          node --check src/js/core/rendering/035-render-loop-init.js
          node scripts/test-v500-poster-icons.cjs
          node scripts/test-v500-poster-browser.cjs
          node scripts/test-v500-logging-interactions.cjs
          node scripts/test-v500-cover-browser.cjs
          node scripts/test-v500-logging-visual-parity.cjs
          node scripts/test-v500-recovery-parity.cjs
          node scripts/test-v500-visual-direction.cjs
          node scripts/test-v500-unified-renderer.cjs
          node scripts/test-v500-artwork-reliability.cjs
          node scripts/test-v500-preview-laboratory.cjs
          node scripts/test-v500-cover-compat.cjs
          node scripts/test-v500-expressiveness-compat.cjs
          node scripts/test-v500-readability-compat.cjs
          node scripts/test-v500-mood-compat.cjs
          node scripts/test-v500-harmony-compat.cjs
          node scripts/test-v500-composition-compat.cjs
          node scripts/test-v500-artwork-compat.cjs
          node scripts/test-v500-source-compat.cjs
          node scripts/test-v500-ownership-compat.cjs
          node scripts/test-v500-visual-compat.cjs
          node scripts/test-v500-recovery-compat.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==500
          assert 'mediaflow-v500.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=500' in sw
          assert 'mediaflow-pwa-v500-shell' in sw
          assert 'mediaflow-v500.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v500 release/PWA coherence PASS')
          PY
      - name: Artwork pixel provenance, stale results, preview isolation and Legacy compatibility
        run: |
          node scripts/test-v500-ownership-compat.cjs
          node scripts/test-v500-visual-compat.cjs
          node scripts/test-v500-recovery-compat.cjs
      - name: Archive verified complete v500 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/500
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/500/
          test "$(cat legacy/v/500/VERSION)" = "500"
          test -s legacy/v/500/assets/js/mediaflow-v500.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v500.bundle.js
          git add --sparse -f legacy/v/500
          if ! git diff --cached --quiet; then
            git commit -m 'build(v500): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:feature/v500-logging-cover-size-clean-icons
          fi
