<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connect tracking — MediaFlow</title><style>body{font-family:system-ui;background:#0e111a;color:#f0f3fb;display:grid;min-height:100dvh;place-items:center;margin:0;padding:16px}main{background:#1c2331;border:1px solid #313c50;border-radius:20px;padding:26px;max-width:480px;width:100%}a{color:#91bcff}h1{font-size:1.45rem}</style></head><body><main><h1>MediaFlow · Tracking Connection</h1><p id="status">Completing secure authorization…</p><a href="./">Return to MediaFlow</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

history.replaceState(null,'',location.pathname);
}catch(e){el.textContent='Could not connect: '+String(e.message||e);} })();
