name: MediaFlow v493 Cover Intelligence Diagnostics & Corrections Quality Gate
on:
  push:
    branches: [feature/v493-cover-intelligence-corrections]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v493-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "493"
          python scripts/build.py
          node --check src/js/components/380-v493-cover-intelligence-corrections.js
          node --check assets/js/mediaflow-v493.bundle.js
          node --check src/js/core/rendering/035-render-loop-init.js
          node scripts/test-v493-cover-corrections.cjs
          node scripts/test-v493-expressiveness-compat.cjs
          node scripts/test-v493-readability-compat.cjs
          node scripts/test-v493-mood-compat.cjs
          node scripts/test-v493-harmony-compat.cjs
          node scripts/test-v493-composition-compat.cjs
          node scripts/test-v493-artwork-compat.cjs
          node scripts/test-v493-source-compat.cjs
          node scripts/test-v493-ownership-compat.cjs
          node scripts/test-v493-visual-compat.cjs
          node scripts/test-v493-recovery-compat.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==493
          assert 'mediaflow-v493.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=493' in sw
          assert 'mediaflow-pwa-v493-shell' in sw
          assert 'mediaflow-v493.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v493 release/PWA coherence PASS')
          PY
      - name: Pixel-grounded cover corrections, expressiveness, readability, source and Legacy compatibility
        run: |
          node scripts/test-v493-ownership-compat.cjs
          node scripts/test-v493-visual-compat.cjs
          node scripts/test-v493-recovery-compat.cjs
      - name: Archive verified complete v493 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/493
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/493/
          test "$(cat legacy/v/493/VERSION)" = "493"
          test -s legacy/v/493/assets/js/mediaflow-v493.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v493.bundle.js
          git add --sparse -f legacy/v/493
          if ! git diff --cached --quiet; then
            git commit -m 'build(v493): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:feature/v493-cover-intelligence-corrections
          fi
