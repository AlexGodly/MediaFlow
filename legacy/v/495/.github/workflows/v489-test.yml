name: MediaFlow v489 Perceptual Color Harmony Quality Gate
on:
  push:
    branches: [feature/v489-perceptual-color-harmony]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v489-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "489"
          python scripts/build.py
          node --check src/js/components/376-v489-perceptual-color-harmony.js
          node --check assets/js/mediaflow-v489.bundle.js
          node --check src/js/core/rendering/035-render-loop-init.js
          node scripts/test-v489-color-harmony.cjs
          node scripts/test-v489-composition-compat.cjs
          node scripts/test-v489-artwork-compat.cjs
          node scripts/test-v489-source-compat.cjs
          node scripts/test-v489-ownership-compat.cjs
          node scripts/test-v489-visual-compat.cjs
          node scripts/test-v489-recovery-compat.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==489
          assert 'mediaflow-v489.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=489' in sw
          assert 'mediaflow-pwa-v489-shell' in sw
          assert 'mediaflow-v489.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v489 release/PWA coherence PASS')
          PY
      - name: Perceptual harmony, composition, artwork, source, ownership and recovery
        run: |
          node scripts/test-v489-ownership-compat.cjs
          node scripts/test-v489-visual-compat.cjs
          node scripts/test-v489-recovery-compat.cjs
      - name: Archive verified complete v489 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/489
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/489/
          test "$(cat legacy/v/489/VERSION)" = "489"
          test -s legacy/v/489/assets/js/mediaflow-v489.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v489.bundle.js
          git add --sparse -f legacy/v/489
          if ! git diff --cached --quiet; then
            git commit -m 'build(v489): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:feature/v489-perceptual-color-harmony
          fi
