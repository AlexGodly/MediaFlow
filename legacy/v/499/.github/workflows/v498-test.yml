name: MediaFlow v498 Logging Readability, Cover Parity & Ambient Motion Quality Gate
on:
  push:
    branches: [feature/v498-logging-readability-cover-parity]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v498-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "498"
          python scripts/build.py
          node --check src/js/components/386-v498-logging-cover-parity.js
          node --check assets/js/mediaflow-v498.bundle.js
          node --check src/js/core/rendering/035-render-loop-init.js
          node scripts/test-v498-logging-visual-parity.cjs
          node scripts/test-v498-recovery-parity.cjs
          node scripts/test-v498-visual-direction.cjs
          node scripts/test-v498-unified-renderer.cjs
          node scripts/test-v498-artwork-reliability.cjs
          node scripts/test-v498-preview-laboratory.cjs
          node scripts/test-v498-cover-compat.cjs
          node scripts/test-v498-expressiveness-compat.cjs
          node scripts/test-v498-readability-compat.cjs
          node scripts/test-v498-mood-compat.cjs
          node scripts/test-v498-harmony-compat.cjs
          node scripts/test-v498-composition-compat.cjs
          node scripts/test-v498-artwork-compat.cjs
          node scripts/test-v498-source-compat.cjs
          node scripts/test-v498-ownership-compat.cjs
          node scripts/test-v498-visual-compat.cjs
          node scripts/test-v498-recovery-compat.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==498
          assert 'mediaflow-v498.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=498' in sw
          assert 'mediaflow-pwa-v498-shell' in sw
          assert 'mediaflow-v498.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v498 release/PWA coherence PASS')
          PY
      - name: Artwork pixel provenance, stale results, preview isolation and Legacy compatibility
        run: |
          node scripts/test-v498-ownership-compat.cjs
          node scripts/test-v498-visual-compat.cjs
          node scripts/test-v498-recovery-compat.cjs
      - name: Archive verified complete v498 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/498
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/498/
          test "$(cat legacy/v/498/VERSION)" = "498"
          test -s legacy/v/498/assets/js/mediaflow-v498.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v498.bundle.js
          git add --sparse -f legacy/v/498
          if ! git diff --cached --quiet; then
            git commit -m 'build(v498): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:feature/v498-logging-readability-cover-parity
          fi
