name: MediaFlow v491 Perceptual Color Science & Readability Quality Gate
on:
  push:
    branches: [feature/v491-perceptual-readability]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v491-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "491"
          python scripts/build.py
          node --check src/js/components/378-v491-perceptual-readability.js
          node --check assets/js/mediaflow-v491.bundle.js
          node --check src/js/core/rendering/035-render-loop-init.js
          node scripts/test-v491-readability.cjs
          node scripts/test-v491-mood-compat.cjs
          node scripts/test-v491-harmony-compat.cjs
          node scripts/test-v491-composition-compat.cjs
          node scripts/test-v491-artwork-compat.cjs
          node scripts/test-v491-source-compat.cjs
          node scripts/test-v491-ownership-compat.cjs
          node scripts/test-v491-visual-compat.cjs
          node scripts/test-v491-recovery-compat.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==491
          assert 'mediaflow-v491.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=491' in sw
          assert 'mediaflow-pwa-v491-shell' in sw
          assert 'mediaflow-v491.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v491 release/PWA coherence PASS')
          PY
      - name: Readability audit, artwork mood, harmony, source and Legacy compatibility
        run: |
          node scripts/test-v491-ownership-compat.cjs
          node scripts/test-v491-visual-compat.cjs
          node scripts/test-v491-recovery-compat.cjs
      - name: Archive verified complete v491 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/491
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/491/
          test "$(cat legacy/v/491/VERSION)" = "491"
          test -s legacy/v/491/assets/js/mediaflow-v491.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v491.bundle.js
          git add --sparse -f legacy/v/491
          if ! git diff --cached --quiet; then
            git commit -m 'build(v491): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:feature/v491-perceptual-readability
          fi
