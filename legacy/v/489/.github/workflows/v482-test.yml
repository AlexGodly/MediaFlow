name: MediaFlow v482 Category Library Class Assignment Readability Quality Gate
on:
  push:
    branches: [fix/v482-category-sidebar-readable-assignments]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v482-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "482"
          python scripts/build.py
          node --check src/js/components/369-v482-readable-class-assignments.js
          node --check assets/js/mediaflow-v482.bundle.js
          node --check src/js/core/rendering/035-render-loop-init.js
          node scripts/test-v482-category-sidebar-assignment.cjs
          node scripts/test-v482-category-class-ui-regression.cjs
          node scripts/test-v482-pwa-contract.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==482
          assert 'mediaflow-v482.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=482' in sw
          assert 'mediaflow-pwa-v482-shell' in sw
          assert 'mediaflow-v482.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v482 release/PWA coherence PASS')
          PY
      - name: Chromium mobile and desktop regression suite
        run: node scripts/test-v482-browser.cjs
      - name: Archive verified complete v482 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/482
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/482/
          test "$(cat legacy/v/482/VERSION)" = "482"
          test -s legacy/v/482/assets/js/mediaflow-v482.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v482.bundle.js
          git add --sparse -f legacy/v/482
          if ! git diff --cached --quiet; then
            git commit -m 'build(v482): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:fix/v482-category-sidebar-readable-assignments
          fi
