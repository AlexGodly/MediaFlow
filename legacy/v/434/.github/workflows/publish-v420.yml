      - name: Browser-test actual fallback, slider, Logging UI, Dashboard and sidebar
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/test-v420-real-covers-layout.py
          python scripts/test-v420-activity-filter-sidebar.py
          git diff --check

      - name: Commit complete v420 and archive independent full source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v420: fix real cover fallbacks, Logging selector, sidebar and Dashboard metrics'
          mkdir -p "$RUNNER_TEMP/mediaflow-v420-source"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/node_modules/' \
            ./ "$RUNNER_TEMP/mediaflow-v420-source/"
          test -f "$RUNNER_TEMP/mediaflow-v420-source/assets/js/mediaflow-v420.bundle.js"
          test -f "$RUNNER_TEMP/mediaflow-v420-source/scripts/test-v420-real-covers-layout.py"
          test ! -e "$RUNNER_TEMP/mediaflow-v420-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v420-source/beta"
          mkdir -p legacy/v/420
          rsync -a --delete "$RUNNER_TEMP/mediaflow-v420-source/" legacy/v/420/
          git add legacy/v/420
          git commit -m 'Archive complete MediaFlow v420 at legacy/v/420'
          git tag 420
          git push origin HEAD:main refs/tags/420
          echo "v420 pushed: $(git rev-parse HEAD)"

      - name: Package full MediaFlow v420 modular ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import os
          src=Path(os.environ['RUNNER_TEMP'])/'mediaflow-v420-source'
          out=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v420_Modular.zip'
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for f in sorted(src.rglob('*')):
              if f.is_file():z.write(f,f.relative_to(src).as_posix())
          with ZipFile(out) as z:
            assert z.testzip() is None
            assert z.read('VERSION')==b'420\n'
            assert 'assets/js/mediaflow-v420.bundle.js' in z.namelist()
            assert 'assets/css/231-v420-actual-cover-layout-repairs.css' in z.namelist()
            assert 'scripts/test-v420-real-covers-layout.py' in z.namelist()
            assert not any(n.startswith(('legacy/','beta/','.github/')) for n in z.namelist())
          print('Complete v420 ZIP:',out,out.stat().st_size)
          PYZIP

      - name: Publish v420 Stable GitHub release and changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 420 "$RUNNER_TEMP/MediaFlow_v420_Modular.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v420 Stable' \
            --notes-file docs/CHANGELOG_v420.md \
            --verify-tag
          gh release view 420 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare website without legacy or beta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-v420-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-v420-site/"
          test "$(cat "$RUNNER_TEMP/mediaflow-v420-site/VERSION")" = 420
          test -f "$RUNNER_TEMP/mediaflow-v420-site/assets/js/mediaflow-v420.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v420-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v420-site/beta"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v420 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-v420-site

      - name: Deploy v420 as live website
        id: deployment
        uses: actions/deploy-pages@v4
