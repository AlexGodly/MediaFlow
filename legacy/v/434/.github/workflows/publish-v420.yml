name: Publish MediaFlow v420 Cover & Dashboard Repairs (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v420.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mediaflow-v420-release
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact v419 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 419
          test ! -e legacy/v/420
          test ! -f assets/js/mediaflow-v420.bundle.js
          test "$(git hash-object VERSION)" = 7b53aa0009e4eb54f22098c01daa067655382524
          test "$(git hash-object index.html)" = 4229dd58b33b208e1b35fce4b5ca673d1c4d3460
          test "$(git hash-object src/js/runtime-order.json)" = ef56822ef931b0862505496219e0073dff2941c7
          test "$(git hash-object src/js/pages/dashboard/011-view-dashboard.js)" = 0d2c4b33b1064bfc726a46a433ed1d1a048b39ef
          test "$(git hash-object README.md)" = 6c2021031e327e67426a053d797e8daaa96f8094
          test "$(git hash-object README2.md)" = 312c5a5e46ca26c4e664c1e3f31addee2a05407f
          test -f assets/js/mediaflow-v417.bundle.js
          test -f assets/js/mediaflow-v419.bundle.js
          ! git show-ref --tags --verify --quiet refs/tags/420
          echo 'Exact v419 release baseline verified.'

