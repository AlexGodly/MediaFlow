name: Publish MediaFlow v414 (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v414.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mediaflow-v414-release
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify the production v413 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '413'
          test ! -e legacy/v/414
          test ! -f assets/js/mediaflow-v414.bundle.js
          test "$(git hash-object index.html)" = '66bbea95ada5d615fd79a98ae84ef75d9a6b07cd'
          test "$(git hash-object src/js/pages/library/013-v70-expanded-library-display-ordering.js)" = '28f99e95e8c5879d37e4a777ce07b852c1f24731'
          test "$(git hash-object README.md)" = '8a4bbe2b0fa92fdb938d3663083513068d9be998'
          ! git show-ref --tags --verify --quiet refs/tags/414
          echo 'Confirmed v413 production and legacy renderer baseline.'

