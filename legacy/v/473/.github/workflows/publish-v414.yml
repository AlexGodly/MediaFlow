          test "$(cat VERSION)" = '414'
          test -f assets/js/mediaflow-v414.bundle.js
          grep -Fq '${v183LibraryOverviewEnabled()?v183LibraryOverviewHtml():' assets/js/mediaflow-v414.bundle.js
          grep -q 'mediaflow-pwa-v414-shell-v1' sw.js
          node --check assets/js/mediaflow-v414.bundle.js
          git diff --check

      - name: Test final bundled Normal and Dynamic Library renderers
        shell: bash
        run: |
          set -euo pipefail
          git show 413:assets/js/mediaflow-v413.bundle.js > "$RUNNER_TEMP/mediaflow-v413-negative.js"
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          MF414_NEGATIVE_BUNDLE="$RUNNER_TEMP/mediaflow-v413-negative.js" python scripts/test-v414-real-library-route.py
          git diff --check

      - name: Commit and archive complete v414 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v414: route Normal Library Overview through shared renderer'
          mkdir -p "$RUNNER_TEMP/mediaflow-v414-source"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/node_modules/' \
            ./ "$RUNNER_TEMP/mediaflow-v414-source/"
          test -f "$RUNNER_TEMP/mediaflow-v414-source/assets/js/mediaflow-v414.bundle.js"
          test -f "$RUNNER_TEMP/mediaflow-v414-source/scripts/test-v414-real-library-route.py"
          test ! -e "$RUNNER_TEMP/mediaflow-v414-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v414-source/beta"
          mkdir -p legacy/v/414
          rsync -a --delete "$RUNNER_TEMP/mediaflow-v414-source/" legacy/v/414/
          git add legacy/v/414
          git commit -m 'Archive MediaFlow v414 at legacy/v/414'
          git tag 414
          git push origin HEAD:main refs/tags/414
          echo "v414 committed: $(git rev-parse HEAD)"

      - name: Package MediaFlow v414 modular ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          src=Path(os.environ['RUNNER_TEMP'])/'mediaflow-v414-source'
          out=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v414_Modular.zip'
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for f in sorted(src.rglob('*')):
              if f.is_file():z.write(f,f.relative_to(src).as_posix())
          with ZipFile(out) as z:
            assert z.testzip() is None
            assert z.read('VERSION') == b'414\n'
            assert 'assets/js/mediaflow-v414.bundle.js' in z.namelist()
            assert 'scripts/test-v414-real-library-route.py' in z.namelist()
            assert not any(n.startswith(('legacy/','beta/','.github/')) for n in z.namelist())
          print('ZIP complete:',out,out.stat().st_size)
          PY

      - name: Create v414 Hotfix release with changelog and ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 414 "$RUNNER_TEMP/MediaFlow_v414_Modular.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v414 Hotfix' \
            --notes-file docs/CHANGELOG_v414.md \
            --verify-tag
          gh release view 414 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare v414 Pages artifact (exclude legacy and beta)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-v414-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-v414-site/"
          test "$(cat "$RUNNER_TEMP/mediaflow-v414-site/VERSION")" = '414'
          test -f "$RUNNER_TEMP/mediaflow-v414-site/assets/js/mediaflow-v414.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v414-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v414-site/beta"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v414 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-v414-site

      - name: Deploy v414 as final live website
        id: deployment
        uses: actions/deploy-pages@v4
