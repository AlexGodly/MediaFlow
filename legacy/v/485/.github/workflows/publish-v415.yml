      - name: Verify Normal and Dynamic Library title/status totals in browser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/test-v415-library-overview-statuses.py
          git diff --check

      - name: Commit and archive complete v415 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v415: show category title totals and dynamic status counts'
          mkdir -p "$RUNNER_TEMP/mediaflow-v415-source"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/node_modules/' \
            ./ "$RUNNER_TEMP/mediaflow-v415-source/"
          test -f "$RUNNER_TEMP/mediaflow-v415-source/assets/js/mediaflow-v415.bundle.js"
          test -f "$RUNNER_TEMP/mediaflow-v415-source/scripts/test-v415-library-overview-statuses.py"
          test ! -e "$RUNNER_TEMP/mediaflow-v415-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v415-source/beta"
          mkdir -p legacy/v/415
          rsync -a --delete "$RUNNER_TEMP/mediaflow-v415-source/" legacy/v/415/
          git add legacy/v/415
          git commit -m 'Archive MediaFlow v415 at legacy/v/415'
          git tag 415
          git push origin HEAD:main refs/tags/415
          echo "v415 committed: $(git rev-parse HEAD)"

      - name: Package MediaFlow v415 modular ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          src=Path(os.environ['RUNNER_TEMP'])/'mediaflow-v415-source'
          out=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v415_Modular.zip'
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for f in sorted(src.rglob('*')):
              if f.is_file():z.write(f,f.relative_to(src).as_posix())
          with ZipFile(out) as z:
            assert z.testzip() is None
            assert z.read('VERSION') == b'415\n'
            assert 'assets/js/mediaflow-v415.bundle.js' in z.namelist()
            assert 'assets/css/226-v415-library-overview-status-totals.css' in z.namelist()
            assert 'scripts/test-v415-library-overview-statuses.py' in z.namelist()
            assert not any(n.startswith(('legacy/','beta/','.github/')) for n in z.namelist())
          print('ZIP complete:',out,out.stat().st_size)
          PY

      - name: Create v415 Stable release with changelog and ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 415 "$RUNNER_TEMP/MediaFlow_v415_Modular.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v415 Stable' \
            --notes-file docs/CHANGELOG_v415.md \
            --verify-tag
          gh release view 415 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare v415 Pages artifact (exclude legacy and beta)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-v415-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-v415-site/"
          test "$(cat "$RUNNER_TEMP/mediaflow-v415-site/VERSION")" = '415'
          test -f "$RUNNER_TEMP/mediaflow-v415-site/assets/js/mediaflow-v415.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v415-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v415-site/beta"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v415 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-v415-site

      - name: Deploy v415 as final live website
        id: deployment
        uses: actions/deploy-pages@v4
