name: Publish MediaFlow v415 (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v415.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mediaflow-v415-release
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify v414 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '414'
          test ! -e legacy/v/415
          test ! -f assets/js/mediaflow-v415.bundle.js
          test "$(git hash-object index.html)" = '03cac16a53974d20a10286db7f4128f23cca336f'
          test "$(git hash-object src/js/legacy/120-v188.js)" = 'f23fe7a2236fda881c1ac1fcda7e2e217f2d3e7f'
          test "$(git hash-object README.md)" = '0dd7d5e16fd879683757e5ece2d2b28bd81d5a58'
          ! git show-ref --tags --verify --quiet refs/tags/415
          echo 'Baseline v414 verified.'

