name: MediaFlow v476 Premium Background Processes Visual Quality Gate
on:
  push:
    branches: [feature/v476-background-processes-redesign]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v476-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "476"
          python scripts/build.py
          node --check src/js/components/363-v476-background-visual-redesign.js
          node --check assets/js/mediaflow-v476.bundle.js
          node --check src/js/core/rendering/035-render-loop-init.js
          node scripts/test-v476-background-design.cjs
          node scripts/test-v476-pwa-contract.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==476
          assert 'mediaflow-v476.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=476' in sw
          assert 'mediaflow-pwa-v476-shell' in sw
          assert 'mediaflow-v476.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v476 release/PWA coherence PASS')
          PY
      - name: Chromium mobile and desktop regression suite
        run: node scripts/test-v476-browser.cjs
      - name: Archive verified complete v476 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/476
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/476/
          test "$(cat legacy/v/476/VERSION)" = "476"
          test -s legacy/v/476/assets/js/mediaflow-v476.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v476.bundle.js
          git add --sparse -f legacy/v/476
          if ! git diff --cached --quiet; then
            git commit -m 'build(v476): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:feature/v476-background-processes-redesign
          fi
