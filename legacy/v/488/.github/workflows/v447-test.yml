name: MediaFlow v447 Universal Recovery Actions Quality Gate
on:
  push:
    branches: [feature/v447-universal-recovery-actions]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v447-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build v447 from source
        run: |
          test "$(cat VERSION)" = "447"
          python scripts/build.py
          node --check assets/js/mediaflow-v447.bundle.js
          node --check src/js/components/312-v431-dashboard-auto-save-navigation.js
          node --check scripts/test-v431-cover-autosave.cjs
          node --check src/js/components/313-v433-provider-registry-foundation.js
          node --check src/js/components/314-v434-provider-connection.js
          node --check scripts/test-v434-gateway.cjs
          node --check scripts/test-v435-omdb.cjs
          node --check scripts/test-v433-id-foundation.cjs
          node --check scripts/test-v432-avatar-icon.cjs
          node --check src/js/components/316-v437-universal-metadata-ratings.js
          node --check scripts/test-v437-universal-metadata.cjs
          node --check scripts/test-v437-browser.cjs
          node --check src/js/components/317-v438-unified-provider-management.js
          node --check scripts/test-v438-provider-registry.cjs
          node --check scripts/test-v444-browser.cjs
          node --check src/js/components/324-v444-recovery-ui-corrections.js
          node --check scripts/test-v444-recovery-ui.cjs
          node --check src/js/components/318-v439-metadata-adapters.js
          node --check src/js/components/319-v439-metadata-recovery.js
          node --check scripts/test-v439-metadata-engine.cjs
          node --check src/js/components/318-v439-metadata-adapters.js
          node --check src/js/components/319-v439-metadata-recovery.js
          node --check scripts/test-v439-metadata-engine.cjs
          node --check src/js/components/320-v440-universal-cover-adapters.js
          node --check scripts/test-v440-cover-adapters.cjs
          node --check src/js/components/321-v441-recovery-workspace.js
          node --check scripts/test-v441-recovery-workspace.cjs
          node --check src/js/components/322-v442-recovery-hardening.js
          node --check scripts/test-v442-recovery-hardening.cjs
          node --check src/js/components/323-v443-automatic-provider-availability.js
          node --check scripts/test-v443-provider-availability.cjs
          node --check src/js/components/325-v445-unified-recovery-workspace.js
          node --check scripts/test-v445-workspace.cjs
          node --check scripts/test-v445-browser.cjs
          node --check src/js/components/326-v446-recovery-scope-controls.js
          node --check scripts/test-v446-recovery-controls.cjs
          node --check scripts/test-v446-browser.cjs
          node --check src/js/components/327-v447-universal-recovery-actions.js
          node --check scripts/test-v447-universal-recovery.cjs
          node --check scripts/test-v447-browser.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck authenticated gateway source
        run: deno check --node-modules-dir=auto supabase/functions/mediaflow-api-gateway/index.ts
      - name: Verify cover validation, navigation and existing recovery features
        run: |
          node scripts/test-v431-cover-autosave.cjs
          node scripts/test-v433-id-foundation.cjs
          node scripts/test-v434-gateway.cjs
          node scripts/test-v435-omdb.cjs
          node scripts/test-v437-universal-metadata.cjs
          node scripts/test-v437-editor-layout.cjs
          node scripts/test-v438-provider-registry.cjs
          node scripts/test-v439-metadata-engine.cjs
          node scripts/test-v440-cover-adapters.cjs
          node scripts/test-v441-recovery-workspace.cjs
          node scripts/test-v442-recovery-hardening.cjs
          node scripts/test-v443-provider-availability.cjs
          node scripts/test-v444-recovery-ui.cjs
          node scripts/test-v445-workspace.cjs
          node scripts/test-v446-recovery-controls.cjs
          node scripts/test-v447-universal-recovery.cjs
          node scripts/test-v432-avatar-icon.cjs
          node scripts/test-v430-recovery-polish.cjs
          node scripts/test-v424-recovery.cjs
          node scripts/test-v425-recovery.cjs
          node scripts/test-v427-recovery.cjs
          node scripts/test-v427-cover-universal-id.cjs
          node scripts/test-v427-on-this-day.cjs
          node scripts/check-settings-style.cjs
          python scripts/check.py
      - name: Desktop and 360px mobile Chromium browser smoke
        run: node scripts/test-v447-browser.cjs
      - name: Commit built and archive full v447 recovery actions
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/447
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/447/
          test "$(cat legacy/v/447/VERSION)" = 447
          test -s legacy/v/447/assets/js/mediaflow-v447.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v447.bundle.js
          git add --sparse -f legacy/v/447
          if ! git diff --cached --quiet; then
            git commit -m 'build(v447): verified site and full legacy archive [skip ci]'
            git push origin HEAD:feature/v447-universal-recovery-actions
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mediaflow-v447-verified-smoke
          path: |
            artifacts/v447-browser-smoke/
            version.json
