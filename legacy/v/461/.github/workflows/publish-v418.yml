          python scripts/build.py
          test "$(cat VERSION)" = '418'
          test -f assets/js/mediaflow-v418.bundle.js
          test -f assets/css/229-v418-collections-display-polish.css
          grep -q 'mf418-detail-card' assets/js/mediaflow-v418.bundle.js
          grep -q 'mediaflow-pwa-v418-shell-v1' sw.js
          grep -q '229-v418-collections-display-polish.css' index.html
          node --check assets/js/mediaflow-v418.bundle.js
          git diff --check

      - name: Browser-test actual Collections rendering and slider limits
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/test-v418-collections.py
          git diff --check

      - name: Commit v418 and archive independent full source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v418: Collections UI and missing cover parity'
          mkdir -p "$RUNNER_TEMP/mediaflow-v418-source"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/node_modules/' \
            ./ "$RUNNER_TEMP/mediaflow-v418-source/"
          test -f "$RUNNER_TEMP/mediaflow-v418-source/assets/js/mediaflow-v418.bundle.js"
          test -f "$RUNNER_TEMP/mediaflow-v418-source/src/js/components/303-v418-collections-views-cover-parity.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v418-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v418-source/beta"
          mkdir -p legacy/v/418
          rsync -a --delete "$RUNNER_TEMP/mediaflow-v418-source/" legacy/v/418/
          git add legacy/v/418
          git commit -m 'Archive MediaFlow v418 at legacy/v/418'
          git tag 418
          git push origin HEAD:main refs/tags/418
          echo "v418 pushed: $(git rev-parse HEAD)"

      - name: Package complete MediaFlow v418 modular source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          source=Path(os.environ['RUNNER_TEMP'])/'mediaflow-v418-source'
          path=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v418_Modular.zip'
          with ZipFile(path,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for f in sorted(source.rglob('*')):
              if f.is_file():z.write(f,f.relative_to(source).as_posix())
          with ZipFile(path) as z:
            assert z.testzip() is None
            assert z.read('VERSION')==b'418\n'
            assert 'assets/js/mediaflow-v418.bundle.js' in z.namelist()
            assert 'assets/css/229-v418-collections-display-polish.css' in z.namelist()
            assert 'scripts/test-v418-collections.py' in z.namelist()
            assert not any(n.startswith(('legacy/','beta/','.github/')) for n in z.namelist())
          print('ZIP complete:',path,path.stat().st_size)
          PYZIP

      - name: Create v418 Stable release with changelog and ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 418 "$RUNNER_TEMP/MediaFlow_v418_Modular.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v418 Stable' \
            --notes-file docs/CHANGELOG_v418.md \
            --verify-tag
          gh release view 418 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare Pages artifact without legacy or beta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-v418-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-v418-site/"
          test "$(cat "$RUNNER_TEMP/mediaflow-v418-site/VERSION")" = '418'
          test -f "$RUNNER_TEMP/mediaflow-v418-site/assets/js/mediaflow-v418.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v418-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v418-site/beta"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v418 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-v418-site

      - name: Deploy v418 as final live website
        id: deployment
        uses: actions/deploy-pages@v4
