name: Publish MediaFlow v418 Collections 2.0 (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v418.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mediaflow-v418-release
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact v417 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '417'
          test ! -e legacy/v/418
          test ! -f src/js/components/303-v418-collections-views-cover-parity.js
          test ! -f assets/js/mediaflow-v418.bundle.js
          test "$(git hash-object index.html)" = '7b3e65fb8d01273acedc6cf945d08a8b609672df'
          test "$(git hash-object src/js/runtime-order.json)" = '61120b0b2258199dd9a540544e3e71793bac6386'
          test "$(git hash-object README.md)" = '511dd455b673a0ce9ac9998fc2f739924c93253f'
          ! git show-ref --tags --verify --quiet refs/tags/418
          echo 'v417 baseline verified.'

