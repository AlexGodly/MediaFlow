name: MediaFlow v428 Development Build and Contracts

on:
  push:
    branches:
      - feature/v428-universal-recovery
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mediaflow-v428-development
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature/v428-universal-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v428-universal-recovery
          persist-credentials: true
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and generate beta artifacts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 428
          # Historical archives are omitted from this fast development checkout.
          # The guarded release workflow validates the actual legacy/v/427 tree.
          python scripts/build.py
          node scripts/test-v428-recovery.cjs
          node scripts/test-v428-metadata.cjs
          node scripts/test-v428-fresh.cjs
          node scripts/test-v428-scheduler.cjs
          node scripts/test-v428-widget.cjs
          node scripts/test-v428-scale.cjs
          node scripts/test-v428-browser.cjs
          node scripts/test-v428-multitab.cjs
          node scripts/test-v427-recovery.cjs
          node scripts/test-v425-recovery.cjs
          node scripts/test-v424-recovery.cjs
          python scripts/check.py
          test -s assets/js/mediaflow-v428.bundle.js
          grep -q 'mf428MetadataOpen' assets/js/mediaflow-v428.bundle.js
          grep -q 'registerFresh' assets/js/mediaflow-v428.bundle.js
      - name: Commit generated bundle and cache to development branch only
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/mediaflow-v428.bundle.js index.html sw.js version.json manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(v428): generated beta bundle and PWA cache [skip ci]"
            git push origin HEAD:feature/v428-universal-recovery
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-v428-development-bundle
          path: |
            assets/js/mediaflow-v428.bundle.js
            sw.js
            version.json
            scripts/test-v428-recovery.cjs
            artifacts/v428-browser-smoke/
