name: Publish MediaFlow v413 (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v413.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mediaflow-v413-release
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact v412 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '412'
          test -f assets/css/224-v412-library-overview-live-layout.css
          test ! -f assets/css/225-v413-library-overview-isolated.css
          test ! -e legacy/v/413
          test "$(git hash-object index.html)" = 'c506098d619cd4bf8fe010039e04321b52769423'
          test "$(git hash-object README.md)" = 'f3c37b54e46d3c0447f1ad9c4a11ed4fd744ff10'
          test "$(git hash-object src/js/legacy/120-v188.js)" = 'e97f6c275e963946be32470bb0cfdfd54eb308f9'
          ! git show-ref --tags --verify --quiet refs/tags/413
          echo 'Confirmed MediaFlow v412 baseline.'

