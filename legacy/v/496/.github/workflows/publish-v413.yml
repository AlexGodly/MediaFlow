          python scripts/build.py
          test "$(cat VERSION)" = '413'
          test -f assets/js/mediaflow-v413.bundle.js
          test -f assets/css/225-v413-library-overview-isolated.css
          grep -q 'data-mf-overview-layout="413"' assets/js/mediaflow-v413.bundle.js
          grep -q '225-v413-library-overview-isolated.css' index.html
          grep -q 'mediaflow-pwa-v413-shell-v1' sw.js
          node --check assets/js/mediaflow-v413.bundle.js
          git diff --check

      - name: Run real Overview renderer browser regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/test-v413-overview-renderer.py
          git diff --check

      - name: Commit v413 and archive full modular source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v413: replace conflicting Library Overview renderer'
          mkdir -p "$RUNNER_TEMP/mediaflow-v413-source"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/node_modules/' \
            ./ "$RUNNER_TEMP/mediaflow-v413-source/"
          test -f "$RUNNER_TEMP/mediaflow-v413-source/index.html"
          test -f "$RUNNER_TEMP/mediaflow-v413-source/assets/js/mediaflow-v413.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v413-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v413-source/beta"
          mkdir -p legacy/v/413
          rsync -a --delete "$RUNNER_TEMP/mediaflow-v413-source/" legacy/v/413/
          git add legacy/v/413
          git commit -m 'Archive MediaFlow v413 at legacy/v/413'
          git tag 413
          git push origin HEAD:main refs/tags/413
          echo "v413 pushed: $(git rev-parse HEAD)"

      - name: Package v413 modular release ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import os
          source=Path(os.environ['RUNNER_TEMP'])/'mediaflow-v413-source'
          dest=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v413_Modular.zip'
          with ZipFile(dest,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for path in sorted(source.rglob('*')):
              if path.is_file():z.write(path,path.relative_to(source).as_posix())
          with ZipFile(dest) as z:
            assert z.testzip() is None
            assert z.read('VERSION') == b'413\n'
            assert 'assets/css/225-v413-library-overview-isolated.css' in z.namelist()
            assert 'scripts/test-v413-overview-renderer.py' in z.namelist()
            assert not any(x.startswith(('legacy/','beta/','.github/')) for x in z.namelist())
          print('Package ready:',dest,dest.stat().st_size)
          PY

      - name: Create v413 Hotfix GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 413 "$RUNNER_TEMP/MediaFlow_v413_Modular.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v413 Hotfix' \
            --notes-file docs/CHANGELOG_v413.md \
            --verify-tag
          gh release view 413 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare v413 Pages artifact without historical archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-v413-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-v413-site/"
          test "$(cat "$RUNNER_TEMP/mediaflow-v413-site/VERSION")" = '413'
          test -f "$RUNNER_TEMP/mediaflow-v413-site/assets/css/225-v413-library-overview-isolated.css"
          test -f "$RUNNER_TEMP/mediaflow-v413-site/assets/js/mediaflow-v413.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v413-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v413-site/beta"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v413 site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-v413-site

      - name: Deploy v413 as current live website
        id: deployment
        uses: actions/deploy-pages@v4

