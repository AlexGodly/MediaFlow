name: MediaFlow v436 Checked-title Recovery Shortcuts Quality Gate
on:
  push:
    branches: [feature/v436-selection-recovery-ui-defaults]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v436-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build v436 from source
        run: |
          test "$(cat VERSION)" = "436"
          python scripts/build.py
          node --check assets/js/mediaflow-v436.bundle.js
          node --check src/js/components/312-v431-dashboard-auto-save-navigation.js
          node --check scripts/test-v431-cover-autosave.cjs
          node --check src/js/components/313-v433-provider-registry-foundation.js
          node --check src/js/components/314-v434-provider-connection.js
          node --check scripts/test-v434-gateway.cjs
          node --check scripts/test-v435-omdb.cjs
          node --check src/js/components/315-v436-selected-recovery-shortcut.js
          node --check scripts/test-v436-shortcuts.cjs
          node --check scripts/test-v433-id-foundation.cjs
          node --check scripts/test-v432-avatar-icon.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck authenticated gateway source
        run: deno check --node-modules-dir=auto supabase/functions/mediaflow-api-gateway/index.ts
      - name: Verify cover validation, navigation and existing recovery features
        run: |
          node scripts/test-v431-cover-autosave.cjs
          node scripts/test-v433-id-foundation.cjs
          node scripts/test-v434-gateway.cjs
          node scripts/test-v435-omdb.cjs
          node scripts/test-v436-shortcuts.cjs
          node scripts/test-v432-avatar-icon.cjs
          node scripts/test-v430-recovery-polish.cjs
          node scripts/test-v424-recovery.cjs
          node scripts/test-v425-recovery.cjs
          node scripts/test-v427-recovery.cjs
          node scripts/test-v427-cover-universal-id.cjs
          node scripts/test-v427-on-this-day.cjs
          node scripts/check-settings-style.cjs
          python scripts/check.py
      - name: Desktop and 360px mobile Chromium browser smoke
        run: node scripts/test-v436-browser.cjs
      - name: Commit built site and full archived v436 project to feature branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/436
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/436/
          test "$(cat legacy/v/436/VERSION)" = 436
          test -s legacy/v/436/assets/js/mediaflow-v436.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v436.bundle.js
          git add --sparse -f legacy/v/436
          if ! git diff --cached --quiet; then
            git commit -m 'build(v436): verified site and full legacy archive [skip ci]'
            git push origin HEAD:feature/v436-selection-recovery-ui-defaults
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mediaflow-v436-verified-smoke
          path: |
            artifacts/v436-browser-smoke/
            version.json
