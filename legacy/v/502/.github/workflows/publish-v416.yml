              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(z.read(name))
          print('Applied v416 source changes')
          MEDIAFLOW_V416_PATCH
          python scripts/build.py
          test "$(cat VERSION)" = '416'
          test -f assets/js/mediaflow-v416.bundle.js
          test -f assets/css/227-v416-library-overview-hover.css
          grep -q -- '--mf416-accent:' assets/js/mediaflow-v416.bundle.js
          grep -q 'mediaflow-pwa-v416-shell-v1' sw.js
          grep -q '227-v416-library-overview-hover.css' index.html
          node --check assets/js/mediaflow-v416.bundle.js
          git diff --check

      - name: Verify full Library rendering, hover, touch, and reduced-motion
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/test-v416-library-overview-hover.py
          git diff --check

      - name: Commit and archive complete v416 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v416: polish Library Overview hover appearance'
          mkdir -p "$RUNNER_TEMP/mediaflow-v416-source"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/node_modules/' \
            ./ "$RUNNER_TEMP/mediaflow-v416-source/"
          test -f "$RUNNER_TEMP/mediaflow-v416-source/assets/js/mediaflow-v416.bundle.js"
          test -f "$RUNNER_TEMP/mediaflow-v416-source/scripts/test-v416-library-overview-hover.py"
          test ! -e "$RUNNER_TEMP/mediaflow-v416-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v416-source/beta"
          mkdir -p legacy/v/416
          rsync -a --delete "$RUNNER_TEMP/mediaflow-v416-source/" legacy/v/416/
          git add legacy/v/416
          git commit -m 'Archive MediaFlow v416 at legacy/v/416'
          git tag 416
          git push origin HEAD:main refs/tags/416
          echo "v416 committed: $(git rev-parse HEAD)"

      - name: Package MediaFlow v416 modular ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          src=Path(os.environ['RUNNER_TEMP'])/'mediaflow-v416-source'
          out=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v416_Modular.zip'
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for f in sorted(src.rglob('*')):
              if f.is_file():z.write(f,f.relative_to(src).as_posix())
          with ZipFile(out) as z:
            assert z.testzip() is None
            assert z.read('VERSION') == b'416\n'
            assert 'assets/js/mediaflow-v416.bundle.js' in z.namelist()
            assert 'assets/css/227-v416-library-overview-hover.css' in z.namelist()
            assert 'scripts/test-v416-library-overview-hover.py' in z.namelist()
            assert not any(n.startswith(('legacy/','beta/','.github/')) for n in z.namelist())
          print('ZIP complete:',out,out.stat().st_size)
          PY

      - name: Create v416 Stable release with changelog and ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 416 "$RUNNER_TEMP/MediaFlow_v416_Modular.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v416 Stable' \
            --notes-file docs/CHANGELOG_v416.md \
            --verify-tag
          gh release view 416 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare v416 Pages artifact (exclude legacy and beta)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-v416-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-v416-site/"
          test "$(cat "$RUNNER_TEMP/mediaflow-v416-site/VERSION")" = '416'
          test -f "$RUNNER_TEMP/mediaflow-v416-site/assets/js/mediaflow-v416.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v416-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v416-site/beta"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v416 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-v416-site

      - name: Deploy v416 as final live website
        id: deployment
        uses: actions/deploy-pages@v4
