name: Publish MediaFlow v416 Hover Polish (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v416.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mediaflow-v416-release
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify v415 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '415'
          test ! -e legacy/v/416
          test ! -f assets/js/mediaflow-v416.bundle.js
          test "$(git hash-object index.html)" = '2e6d6f06613574a44e872b9c84dd325d4a7b2689'
          test "$(git hash-object src/js/legacy/120-v188.js)" = '546ff43d4feaa4ed2f134fcf5dd035368dd502d2'
          test "$(git hash-object README.md)" = '008c96d316d36af5533bd5e11fc2e3765fd6c9f1'
          ! git show-ref --tags --verify --quiet refs/tags/416
          echo 'Baseline v415 verified.'

