            for name in z.namelist():
              p=Path(name)
              if p.is_absolute() or '..' in p.parts:raise RuntimeError('Invalid patch path')
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(z.read(name))
          print('Applied v422 source changes')
          MEDIAFLOW_V422_PATCH
          python scripts/build.py
          test "$(cat VERSION)" = 422
          test -f assets/js/mediaflow-v422.bundle.js
          test -f assets/css/233-v422-navigation-details-profile-support.css
          grep -q 'mf422NavigationControls' assets/js/mediaflow-v422.bundle.js
          grep -q 'mf422ToggleProgress' assets/js/mediaflow-v422.bundle.js
          grep -q '233-v422-navigation-details-profile-support.css' index.html
          grep -q 'mediaflow-v422.bundle.js' index.html
          grep -q 'mediaflow-pwa-v422-shell-v1' sw.js
          node --check assets/js/mediaflow-v422.bundle.js
          git diff --check

      - name: Browser-test Settings Center, adaptive navigation, Library details, Account, About and covers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/test-v422-ui-contract.py
          python scripts/test-v422-cover-regression.py
          git diff --check

      - name: Commit complete v422 and archive full independent source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v422: navigation 2.0, Library details, profile URL-only and Ko-fi support'
          mkdir -p "$RUNNER_TEMP/mediaflow-v422-source"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/node_modules/' \
            ./ "$RUNNER_TEMP/mediaflow-v422-source/"
          test -f "$RUNNER_TEMP/mediaflow-v422-source/assets/js/mediaflow-v422.bundle.js"
          test -f "$RUNNER_TEMP/mediaflow-v422-source/scripts/test-v422-ui-contract.py"
          test ! -e "$RUNNER_TEMP/mediaflow-v422-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v422-source/beta"
          mkdir -p legacy/v/422
          rsync -a --delete "$RUNNER_TEMP/mediaflow-v422-source/" legacy/v/422/
          git add legacy/v/422
          git commit -m 'Archive complete MediaFlow v422 at legacy/v/422'
          git tag 422
          git push origin HEAD:main refs/tags/422
          echo "v422 pushed: $(git rev-parse HEAD)"

      - name: Package complete v422 modular ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import os
          src=Path(os.environ['RUNNER_TEMP'])/'mediaflow-v422-source'
          out=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v422_Modular.zip'
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for f in sorted(src.rglob('*')):
              if f.is_file():z.write(f,f.relative_to(src).as_posix())
          with ZipFile(out) as z:
            assert z.testzip() is None
            assert z.read('VERSION')==b'422\n'
            assert 'assets/js/mediaflow-v422.bundle.js' in z.namelist()
            assert 'assets/css/233-v422-navigation-details-profile-support.css' in z.namelist()
            assert 'scripts/test-v422-ui-contract.py' in z.namelist()
            assert not any(n.startswith(('legacy/','beta/','.github/')) for n in z.namelist())
          print('Complete ZIP:',out,out.stat().st_size)
          PYZIP

      - name: Publish v422 Stable release with changelog and ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 422 "$RUNNER_TEMP/MediaFlow_v422_Modular.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v422 Stable' \
            --notes-file docs/CHANGELOG_v422.md \
            --verify-tag
          gh release view 422 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare Pages artifact without legacy and beta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-v422-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-v422-site/"
          test "$(cat "$RUNNER_TEMP/mediaflow-v422-site/VERSION")" = 422
          test -f "$RUNNER_TEMP/mediaflow-v422-site/assets/js/mediaflow-v422.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v422-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v422-site/beta"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v422 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-v422-site

      - name: Deploy v422 as live website
        id: deployment
        uses: actions/deploy-pages@v4
