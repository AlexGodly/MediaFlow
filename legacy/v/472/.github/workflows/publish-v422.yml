name: Publish MediaFlow v422 Navigation 2.0 & Library Details (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v422.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mediaflow-v422-release
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact v421 baseline and v422 release guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 421
          test ! -e legacy/v/422
          test ! -f assets/js/mediaflow-v422.bundle.js
          test "$(git hash-object VERSION)" = 1bb7ac539ae8f07b73046a3afb611ab976ccbd5d
          test "$(git hash-object index.html)" = f2db9b6d649499204026b24bab43fd70f8b39830
          test "$(git hash-object src/js/runtime-order.json)" = f9873e00f2fa4a3830d46ea19b932b9d24609d16
          test "$(git hash-object src/js/components/306-v421-adaptive-navigation-filter.js)" = 49e894be8e3ca758c438874a10916ede0c024424
          test "$(git hash-object README.md)" = c0f449ab1b2574a00eb0dce8ce2fcf40563606c5
          test "$(git hash-object README2.md)" = e2e1d72c2e30d8753085f48632f5c65b60faf5f3
          test -f assets/js/mediaflow-v421.bundle.js
          ! git show-ref --tags --verify --quiet refs/tags/422
          echo 'v421 source and v422 release guards verified.'

