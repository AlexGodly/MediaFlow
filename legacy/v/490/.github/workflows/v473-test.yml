name: MediaFlow v473 Five Full Poster Showcase Quality Gate
on:
  push:
    branches: [feature/v473-showcase-five-full-cover-hover]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v473-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "473"
          python scripts/build.py
          node --check src/js/components/360-v473-showcase-five-full-hover.js
          node --check assets/js/mediaflow-v473.bundle.js
          node scripts/test-v473-showcase.cjs
          node scripts/test-v473-pwa-contract.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==473
          assert 'mediaflow-v473.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=473' in sw
          assert 'mediaflow-pwa-v473-shell' in sw
          assert 'mediaflow-v473.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v473 release/PWA coherence PASS')
          PY
      - name: Chromium mobile and desktop regression suite
        run: node scripts/test-v473-browser.cjs
      - name: Archive verified complete v473 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/473
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/473/
          test "$(cat legacy/v/473/VERSION)" = "473"
          test -s legacy/v/473/assets/js/mediaflow-v473.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v473.bundle.js
          git add --sparse -f legacy/v/473
          if ! git diff --cached --quiet; then
            git commit -m 'build(v473): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:feature/v473-showcase-five-full-cover-hover
          fi
