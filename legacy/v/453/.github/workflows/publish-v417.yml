            for name in z.namelist():
              p=Path(name)
              if p.is_absolute() or '..' in p.parts:raise RuntimeError('Invalid payload path')
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(z.read(name))
          print('Applied v417 source changes')
          MEDIAFLOW_V417_PATCH
          python scripts/build.py
          test "$(cat VERSION)" = '417'
          test -f assets/js/mediaflow-v417.bundle.js
          test -f assets/css/228-v417-library-icons-covers.css
          grep -q 'v417LibraryThumbHtml' assets/js/mediaflow-v417.bundle.js
          grep -q 'mediaflow-pwa-v417-shell-v1' sw.js
          grep -q '228-v417-library-icons-covers.css' index.html
          node --check assets/js/mediaflow-v417.bundle.js
          git diff --check

      - name: Verify full Library rendering, status icons, missing covers, and responsiveness
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/test-v417-library-icons-covers.py
          git diff --check

      - name: Commit and archive complete v417 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v417: polish Library Overview hover appearance'
          mkdir -p "$RUNNER_TEMP/mediaflow-v417-source"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/node_modules/' \
            ./ "$RUNNER_TEMP/mediaflow-v417-source/"
          test -f "$RUNNER_TEMP/mediaflow-v417-source/assets/js/mediaflow-v417.bundle.js"
          test -f "$RUNNER_TEMP/mediaflow-v417-source/scripts/test-v417-library-icons-covers.py"
          test ! -e "$RUNNER_TEMP/mediaflow-v417-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v417-source/beta"
          mkdir -p legacy/v/417
          rsync -a --delete "$RUNNER_TEMP/mediaflow-v417-source/" legacy/v/417/
          git add legacy/v/417
          git commit -m 'Archive MediaFlow v417 at legacy/v/417'
          git tag 417
          git push origin HEAD:main refs/tags/417
          echo "v417 committed: $(git rev-parse HEAD)"

      - name: Package MediaFlow v417 modular ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          src=Path(os.environ['RUNNER_TEMP'])/'mediaflow-v417-source'
          out=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v417_Modular.zip'
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for f in sorted(src.rglob('*')):
              if f.is_file():z.write(f,f.relative_to(src).as_posix())
          with ZipFile(out) as z:
            assert z.testzip() is None
            assert z.read('VERSION') == b'417\n'
            assert 'assets/js/mediaflow-v417.bundle.js' in z.namelist()
            assert 'assets/css/228-v417-library-icons-covers.css' in z.namelist()
            assert 'scripts/test-v417-library-icons-covers.py' in z.namelist()
            assert not any(n.startswith(('legacy/','beta/','.github/')) for n in z.namelist())
          print('ZIP complete:',out,out.stat().st_size)
          PY

      - name: Create v417 Stable release with changelog and ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 417 "$RUNNER_TEMP/MediaFlow_v417_Modular.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v417 Stable' \
            --notes-file docs/CHANGELOG_v417.md \
            --verify-tag
          gh release view 417 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare v417 Pages artifact (exclude legacy and beta)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-v417-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-v417-site/"
          test "$(cat "$RUNNER_TEMP/mediaflow-v417-site/VERSION")" = '417'
          test -f "$RUNNER_TEMP/mediaflow-v417-site/assets/js/mediaflow-v417.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v417-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v417-site/beta"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v417 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-v417-site

      - name: Deploy v417 as final live website
        id: deployment
        uses: actions/deploy-pages@v4
