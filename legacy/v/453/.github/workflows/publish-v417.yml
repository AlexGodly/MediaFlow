name: Publish MediaFlow v417 Library Icons & Covers (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v417.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mediaflow-v417-release
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify v416 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '416'
          test ! -e legacy/v/417
          test ! -f assets/js/mediaflow-v417.bundle.js
          test "$(git hash-object index.html)" = '5d3d5c5b68708b573bc917387dbf6392b60ce03a'
          test "$(git hash-object src/js/legacy/120-v188.js)" = 'd94bb0567a16bc9917e9fa51396d81ff4cb454d2'
          test "$(git hash-object README.md)" = '309429fb77b03c59457f7287f3d3926ba75eba33'
          test "$(git hash-object src/js/pages/library/013-v70-expanded-library-display-ordering.js)" = '295a7c27a4171f5b16bfe6ed9bf5121819a656ae'
          test "$(git hash-object src/js/pages/library/112-dynamic-library-rendering.js)" = '2727e0925eb5a2fd1f36c6386773c86951870c34'
          ! git show-ref --tags --verify --quiet refs/tags/417
          echo 'Baseline v416 verified.'

