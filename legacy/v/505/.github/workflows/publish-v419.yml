name: Publish MediaFlow v419 Recommends 2.0 (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v419.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mediaflow-v419-release
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact v418 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 418
          test ! -e legacy/v/419
          test ! -f assets/js/mediaflow-v419.bundle.js
          test "$(git hash-object VERSION)" = 29aae8eeca636e8ff254bd25ebe785a986525ab1
          test "$(git hash-object index.html)" = 6aafb9f3d7ac3548dd870fb81573cf1c0e4e5754
          test "$(git hash-object src/js/runtime-order.json)" = 64e271070848f9ee419e465978fdcbc7d2006735
          test "$(git hash-object src/js/components/303-v418-collections-views-cover-parity.js)" = e6835cc3a4401981f396fc6ec9ed1bf871b9fce8
          test -f assets/js/mediaflow-v417.bundle.js
          ! git show-ref --tags --verify --quiet refs/tags/419
          echo 'Exact v418 release baseline verified.'

