          with ZipFile(BytesIO(b64decode(payload))) as z:
            for name in z.namelist():
              p=Path(name)
              if p.is_absolute() or '..' in p.parts:raise RuntimeError('Invalid release payload path')
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(z.read(name))
          print('Applied v419 source changes')
          MEDIAFLOW_V419_PATCH
          python scripts/build.py
          test "$(cat VERSION)" = 419
          test -f assets/js/mediaflow-v419.bundle.js
          test -f assets/css/230-v419-recommends-covers-logging.css
          test -f scripts/test-v419-recommends.py
          grep -q 'mf419OrderContext' assets/js/mediaflow-v419.bundle.js
          grep -q 'mf419MissingCoverHtml' assets/js/mediaflow-v419.bundle.js
          grep -q '230-v419-recommends-covers-logging.css' index.html
          grep -q 'mediaflow-v419.bundle.js' index.html
          grep -q 'mediaflow-pwa-v419-shell-v1' sw.js
          node --check assets/js/mediaflow-v419.bundle.js
          git diff --check

      - name: Browser-test recommendations, queue ranks and v418 Collections
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/test-v419-recommends.py
          python scripts/test-v419-collections-regression.py
          git diff --check

      - name: Commit complete v419 and archive independent source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v419: Recommends 2.0, unified covers and Logging experience'
          mkdir -p "$RUNNER_TEMP/mediaflow-v419-source"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/node_modules/' \
            ./ "$RUNNER_TEMP/mediaflow-v419-source/"
          test -f "$RUNNER_TEMP/mediaflow-v419-source/assets/js/mediaflow-v419.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v419-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v419-source/beta"
          mkdir -p legacy/v/419
          rsync -a --delete "$RUNNER_TEMP/mediaflow-v419-source/" legacy/v/419/
          git add legacy/v/419
          git commit -m 'Archive full MediaFlow v419 at legacy/v/419'
          git tag 419
          git push origin HEAD:main refs/tags/419
          echo "v419 committed: $(git rev-parse HEAD)"

      - name: Package full MediaFlow v419 modular ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import os
          src=Path(os.environ['RUNNER_TEMP'])/'mediaflow-v419-source'
          out=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v419_Modular.zip'
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for f in sorted(src.rglob('*')):
              if f.is_file():z.write(f,f.relative_to(src).as_posix())
          with ZipFile(out) as z:
            assert z.testzip() is None
            assert z.read('VERSION')==b'419\n'
            assert 'assets/js/mediaflow-v419.bundle.js' in z.namelist()
            assert 'assets/css/230-v419-recommends-covers-logging.css' in z.namelist()
            assert 'scripts/test-v419-recommends.py' in z.namelist()
            assert not any(n.startswith(('legacy/','beta/','.github/')) for n in z.namelist())
          print('Complete v419 ZIP:',out,out.stat().st_size)
          PYZIP

      - name: Publish v419 Stable GitHub release and changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 419 "$RUNNER_TEMP/MediaFlow_v419_Modular.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v419 Stable' \
            --notes-file docs/CHANGELOG_v419.md \
            --verify-tag
          gh release view 419 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare website without legacy or beta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-v419-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-v419-site/"
          test "$(cat "$RUNNER_TEMP/mediaflow-v419-site/VERSION")" = 419
          test -f "$RUNNER_TEMP/mediaflow-v419-site/assets/js/mediaflow-v419.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v419-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v419-site/beta"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v419 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-v419-site

      - name: Deploy v419 as live website
        id: deployment
        uses: actions/deploy-pages@v4
