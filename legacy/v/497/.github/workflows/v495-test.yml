name: MediaFlow v495 Artwork Extraction Reliability & Consistency Quality Gate
on:
  push:
    branches: [feature/v495-artwork-extraction-reliability]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v495-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "495"
          python scripts/build.py
          node --check src/js/components/382-v495-artwork-reliability-cache.js
          node --check assets/js/mediaflow-v495.bundle.js
          node --check src/js/core/rendering/035-render-loop-init.js
          node scripts/test-v495-artwork-reliability.cjs
          node scripts/test-v495-preview-laboratory.cjs
          node scripts/test-v495-cover-compat.cjs
          node scripts/test-v495-expressiveness-compat.cjs
          node scripts/test-v495-readability-compat.cjs
          node scripts/test-v495-mood-compat.cjs
          node scripts/test-v495-harmony-compat.cjs
          node scripts/test-v495-composition-compat.cjs
          node scripts/test-v495-artwork-compat.cjs
          node scripts/test-v495-source-compat.cjs
          node scripts/test-v495-ownership-compat.cjs
          node scripts/test-v495-visual-compat.cjs
          node scripts/test-v495-recovery-compat.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==495
          assert 'mediaflow-v495.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=495' in sw
          assert 'mediaflow-pwa-v495-shell' in sw
          assert 'mediaflow-v495.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v495 release/PWA coherence PASS')
          PY
      - name: Artwork pixel provenance, stale results, preview isolation and Legacy compatibility
        run: |
          node scripts/test-v495-ownership-compat.cjs
          node scripts/test-v495-visual-compat.cjs
          node scripts/test-v495-recovery-compat.cjs
      - name: Archive verified complete v495 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/495
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/495/
          test "$(cat legacy/v/495/VERSION)" = "495"
          test -s legacy/v/495/assets/js/mediaflow-v495.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v495.bundle.js
          git add --sparse -f legacy/v/495
          if ! git diff --cached --quiet; then
            git commit -m 'build(v495): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:feature/v495-artwork-extraction-reliability
          fi
