          MEDIAFLOW_PATCHES
          cat > "$RUNNER_TEMP/mediaflow-backfill/apply.py" <<'PY'
          import base64, hashlib, json, os, pathlib, sys, zlib
          version=str(sys.argv[1])
          data=json.loads(zlib.decompress(base64.b64decode(pathlib.Path(os.environ['RUNNER_TEMP'],'mediaflow-backfill/payload.b64').read_text())))
          assert pathlib.Path('VERSION').read_text().strip()==str(int(version)-1), 'Wrong base release'
          items=data[version]
          def sha(b):return hashlib.sha256(b).hexdigest()
          for name,entry in items.items():
              path=pathlib.Path(name)
              assert path.is_relative_to(pathlib.Path('.')) and '..' not in path.parts
              typ=entry['type']
              if typ=='delete':
                  assert sha(path.read_bytes())==entry['sha_before'],name
                  path.unlink()
                  continue
              if typ=='copy':
                  value=pathlib.Path(entry['from']).read_bytes()
              elif typ=='insert_from':
                  original=pathlib.Path(entry['from']).read_bytes()
                  index=entry['offset']
                  value=original[:index]+base64.b64decode(entry['insert'])+original[index:]
              elif typ=='new':
                  assert not path.exists(),name
                  value=base64.b64decode(entry['data'])
              elif typ=='edit':
                  initial=path.read_bytes()
                  assert sha(initial)==entry['sha_before'],f'Unexpected pre-update content: {name}'
                  segments=initial.splitlines(keepends=True)
                  for start,stop,piece in reversed(entry['edits']):
                      segments[start:stop]=base64.b64decode(piece).splitlines(keepends=True)
                  value=b''.join(segments)
              else:
                  raise RuntimeError('Unsupported modification')
              assert sha(value)==entry['sha_after'],f'Checksum mismatch: {name}'
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(value)
              print('verified',name)
          assert pathlib.Path('VERSION').read_text().strip()==version
          print('MediaFlow v'+version+': exact changes verified')
          PY

      - name: Commit archive tag and GitHub release v409
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/mediaflow-backfill/apply.py" 409
          mkdir -p legacy/v/409
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/legacy/' --exclude='/beta/' ./ legacy/v/409/
          test "$(find legacy/v/409 -type f | wc -l | tr -d ' ')" = 945
          git add -A
          git commit -m 'MediaFlow v409 Stable — repair mobile floating quick actions'
          git push origin HEAD:main
          git tag -a 409 -m 'MediaFlow v409 Stable'
          git push origin 409
          (cd legacy/v/409 && zip -q -r "$RUNNER_TEMP/mediaflow-backfill/MediaFlow_v409_Modular.zip" .)
          gh release create 409 "$RUNNER_TEMP/mediaflow-backfill/MediaFlow_v409_Modular.zip" \
            --title 'v409 Stable' --notes-file docs/CHANGELOG_v409.md --verify-tag

      - name: Commit archive tag and GitHub release v410
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/mediaflow-backfill/apply.py" 410
          mkdir -p legacy/v/410
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/legacy/' --exclude='/beta/' ./ legacy/v/410/
          test "$(find legacy/v/410 -type f | wc -l | tr -d ' ')" = 949
          git add -A
          git commit -m 'MediaFlow v410 Stable — compact mobile dock and action sheet'
          git push origin HEAD:main
          git tag -a 410 -m 'MediaFlow v410 Stable'
          git push origin 410
          (cd legacy/v/410 && zip -q -r "$RUNNER_TEMP/mediaflow-backfill/MediaFlow_v410_Modular.zip" .)
          gh release create 410 "$RUNNER_TEMP/mediaflow-backfill/MediaFlow_v410_Modular.zip" \
            --title 'v410 Stable' --notes-file docs/CHANGELOG_v410.md --verify-tag

      - name: Prepare v410 GitHub Pages publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 410
          mkdir -p "$RUNNER_TEMP/mediaflow-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-site/"
          test -f "$RUNNER_TEMP/mediaflow-site/index.html"
          test "$(cat "$RUNNER_TEMP/mediaflow-site/VERSION")" = 410
          test ! -e "$RUNNER_TEMP/mediaflow-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-site/beta"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v410 site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-site

      - name: Deploy v410 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
