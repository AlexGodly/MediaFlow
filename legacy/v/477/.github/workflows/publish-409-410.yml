name: Publish MediaFlow 409 and 410 (one-time)

on:
  push:
    paths:
      - .github/workflows/publish-409-410.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mediaflow-409-410-backfill
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout MediaFlow
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Guard historical v408 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 408
          test "$(git rev-parse HEAD^)" = "904bfee52b2011d03e945171e3b6bbc6e5215dda"
          test ! -e legacy/v/409
          test ! -e legacy/v/410
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/mediaflow-backfill"

      - name: Load exact v409 and v410 source changes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mediaflow-backfill/payload.b64" <<'MEDIAFLOW_PATCHES'
