name: Deploy MediaFlow (exclude legacy)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site without legacy
        run: |
          mkdir -p "$RUNNER_TEMP/mediaflow-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-site/"
          test -f "$RUNNER_TEMP/mediaflow-site/index.html"
          test ! -e "$RUNNER_TEMP/mediaflow-site/legacy"
          du -sh "$RUNNER_TEMP/mediaflow-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
