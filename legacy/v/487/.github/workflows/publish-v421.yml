          git diff --check

      - name: Browser-test navigation, filter and existing cover renderers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/test-v421-navigation-filter.py
          python scripts/test-v421-cover-regression.py
          git diff --check

      - name: Commit complete v421 and archive full independent source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlexGodly'
          git config user.email '90983397+AlexGodly@users.noreply.github.com'
          git add -A -- . ':!legacy' ':!beta'
          git commit -m 'MediaFlow v421: adaptive desktop navigation and Logging membership UI'
          mkdir -p "$RUNNER_TEMP/mediaflow-v421-source"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/node_modules/' \
            ./ "$RUNNER_TEMP/mediaflow-v421-source/"
          test -f "$RUNNER_TEMP/mediaflow-v421-source/assets/js/mediaflow-v421.bundle.js"
          test -f "$RUNNER_TEMP/mediaflow-v421-source/scripts/test-v421-navigation-filter.py"
          test ! -e "$RUNNER_TEMP/mediaflow-v421-source/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v421-source/beta"
          mkdir -p legacy/v/421
          rsync -a --delete "$RUNNER_TEMP/mediaflow-v421-source/" legacy/v/421/
          git add legacy/v/421
          git commit -m 'Archive complete MediaFlow v421 at legacy/v/421'
          git tag 421
          git push origin HEAD:main refs/tags/421
          echo "v421 pushed: $(git rev-parse HEAD)"

      - name: Package complete v421 modular ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import os
          src=Path(os.environ['RUNNER_TEMP'])/'mediaflow-v421-source'
          out=Path(os.environ['RUNNER_TEMP'])/'MediaFlow_v421_Modular.zip'
          with ZipFile(out,'w',ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for f in sorted(src.rglob('*')):
              if f.is_file():z.write(f,f.relative_to(src).as_posix())
          with ZipFile(out) as z:
            assert z.testzip() is None
            assert z.read('VERSION')==b'421\n'
            assert 'assets/js/mediaflow-v421.bundle.js' in z.namelist()
            assert 'assets/css/232-v421-adaptive-navigation-logging-select.css' in z.namelist()
            assert 'scripts/test-v421-navigation-filter.py' in z.namelist()
            assert not any(n.startswith(('legacy/','beta/','.github/')) for n in z.namelist())
          print('Complete ZIP:',out,out.stat().st_size)
          PYZIP

      - name: Publish v421 Stable release with changelog and ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 421 "$RUNNER_TEMP/MediaFlow_v421_Modular.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v421 Stable' \
            --notes-file docs/CHANGELOG_v421.md \
            --verify-tag
          gh release view 421 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url

      - name: Prepare Pages artifact without legacy and beta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflow-v421-site"
          rsync -a \
            --exclude='/legacy/' \
            --exclude='/beta/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            ./ "$RUNNER_TEMP/mediaflow-v421-site/"
          test "$(cat "$RUNNER_TEMP/mediaflow-v421-site/VERSION")" = 421
          test -f "$RUNNER_TEMP/mediaflow-v421-site/assets/js/mediaflow-v421.bundle.js"
          test ! -e "$RUNNER_TEMP/mediaflow-v421-site/legacy"
          test ! -e "$RUNNER_TEMP/mediaflow-v421-site/beta"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v421 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mediaflow-v421-site

      - name: Deploy v421 as live website
        id: deployment
        uses: actions/deploy-pages@v4
