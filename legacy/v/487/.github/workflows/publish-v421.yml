name: Publish MediaFlow v421 Adaptive Navigation (one-time)

on:
  push:
    paths:
      - '.github/workflows/publish-v421.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mediaflow-v421-release
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout MediaFlow main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify v420 baseline and release guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 420
          test ! -e legacy/v/421
          test ! -f assets/js/mediaflow-v421.bundle.js
          test "$(git hash-object VERSION)" = 816d01be5ca04d952ce4d347befefed997133065
          test "$(git hash-object index.html)" = 49eb4705d2088b7b90ca45f8d61d1435ccdc2401
          test "$(git hash-object src/js/runtime-order.json)" = 814c0712e673c614b6e4ffb9ffe444395f012b3b
          test "$(git hash-object src/js/components/305-v420-covers-dashboard-sidebar-fixes.js)" = 8f7461c493551cce5e20cad22d3a2aee3d98be33
          test "$(git hash-object README.md)" = 191aafba61fb6544d142b79dc5d2ce4dcc1a42d5
          test "$(git hash-object README2.md)" = cba6008e1c0015e5bb78b025f1f880aa80fccf57
          test -f assets/js/mediaflow-v420.bundle.js
          ! git show-ref --tags --verify --quiet refs/tags/421
          echo 'v420 source and v421 release guards verified.'

