name: Publish MediaFlow v433 Beta Archive
on:
  workflow_run:
    workflows: ['Deploy MediaFlow (exclude legacy and beta)']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - name: Verify built and archived v433
        id: match
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat VERSION)" != "433" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e HEAD:legacy/v/433/VERSION
          test "$(git show HEAD:legacy/v/433/VERSION | tr -d '\r\n')" = 433
          git cat-file -e HEAD:legacy/v/433/assets/js/mediaflow-v433.bundle.js
          echo "release=true" >> "$GITHUB_OUTPUT"
      - name: Zip archived source and checksum
        if: steps.match.outputs.release == 'true'
        run: |
          git archive --format=zip --output=MediaFlow_v433_Modular.zip HEAD:legacy/v/433
          sha256sum MediaFlow_v433_Modular.zip > MediaFlow_v433_Modular.sha256
          test -s MediaFlow_v433_Modular.zip
      - name: Publish numeric release 433
        if: steps.match.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 433 >/dev/null 2>&1; then
            echo "Release 433 already exists; no overwrite."
            exit 0
          fi
          gh release create 433 MediaFlow_v433_Modular.zip MediaFlow_v433_Modular.sha256 \
            --target "$GITHUB_SHA" --title "v433 Beta" --prerelease \
            --notes-file docs/CHANGELOG_v433.md
