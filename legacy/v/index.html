  <style>
    :root {
      color-scheme: dark;
      --bg: #07090f;
      --surface: rgba(15, 19, 30, 0.74);
      --surface-strong: rgba(20, 25, 39, 0.92);
      --border: rgba(255, 255, 255, 0.09);
      --border-hover: rgba(255, 255, 255, 0.16);
      --text: #f7f8fb;
      --muted: #9ba3b7;
      --accent: #8f6cff;
      --accent-2: #5c8dff;
      --success: #49d890;
      --danger: #ff6c7a;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-md: 13px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(143, 108, 255, 0.18), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(92, 141, 255, 0.14), transparent 34%),
        linear-gradient(145deg, #080a10 0%, #0a0d15 45%, #07090f 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.2;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .orb {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .15;
      pointer-events: none;
      animation: drift 10s ease-in-out infinite alternate;
    }

    .orb.one { background: #825cff; top: -160px; right: -110px; }
    .orb.two { background: #367cff; bottom: -180px; left: -120px; animation-delay: -4s; }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(30px, 20px, 0) scale(1.08); }
    }

    main {
      width: min(92vw, 680px);
      padding: 32px 0;
      position: relative;
      z-index: 1;
    }

    .launcher {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: linear-gradient(180deg, rgba(18, 22, 34, 0.84), rgba(11, 14, 23, 0.88));
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .launcher::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent);
    }

    .hero {
      padding: 34px 34px 26px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(143,108,255,.09), transparent 45%);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      border: 1px solid rgba(255,255,255,.11);
      background: rgba(255,255,255,.045);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 12px 30px rgba(0,0,0,.22);
      overflow: hidden;
    }

    .brand-icon img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      display: block;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #b7a8ff;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 2.35rem);
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .subtitle {
      margin: 15px 0 0;
      max-width: 520px;
      color: var(--muted);
      font-size: .97rem;
      line-height: 1.65;
    }

    .content { padding: 28px 34px 34px; }

    .status-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.026);
    }

    .status-left {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
    }

    .dot {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(73,216,144,.1), 0 0 18px rgba(73,216,144,.45);
    }

    .dot.loading {
      background: #ffbd59;
      box-shadow: 0 0 0 4px rgba(255,189,89,.1), 0 0 18px rgba(255,189,89,.35);
      animation: pulse 1.1s infinite ease-in-out;
    }

    .dot.error {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(255,108,122,.1), 0 0 18px rgba(255,108,122,.35);
    }

    @keyframes pulse { 50% { opacity: .45; transform: scale(.82); } }

    .status-text {
      min-width: 0;
      color: #cbd1df;
      font-size: .82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .refresh {
      border: 0;
      padding: 6px 8px;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: .78rem;
      transition: .2s ease;
    }

    .refresh:hover { color: var(--text); background: rgba(255,255,255,.055); }
    .refresh:disabled { opacity: .45; cursor: default; }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 9px;
    }

    label {
      color: #d8dce8;
      font-size: .86rem;
      font-weight: 700;
    }

    .count {
      color: var(--muted);
      font-size: .77rem;
    }

    .select-wrap { position: relative; }

    select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--border);
      outline: none;
      border-radius: var(--radius-md);
      padding: 15px 46px 15px 15px;
      color: var(--text);
      background: var(--surface-strong);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    select:hover { border-color: var(--border-hover); }
    select:focus {
      border-color: rgba(143,108,255,.62);
      box-shadow: 0 0 0 4px rgba(143,108,255,.10);
    }

    select:disabled { cursor: not-allowed; opacity: .6; }

    .chevron {
      position: absolute;
      top: 50%;
      right: 16px;
      width: 8px;
      height: 8px;
      border-right: 2px solid #aeb5c5;
      border-bottom: 2px solid #aeb5c5;
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }

    .launch {
      width: 100%;
      margin-top: 14px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: white;
      background: linear-gradient(135deg, #8d68ff, #5f7cff);
      box-shadow: 0 12px 30px rgba(98, 104, 255, .24), inset 0 1px 0 rgba(255,255,255,.18);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      letter-spacing: -.01em;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .launch:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.07);
      box-shadow: 0 16px 36px rgba(98, 104, 255, .30), inset 0 1px 0 rgba(255,255,255,.18);
    }

    .launch:active:not(:disabled) { transform: translateY(0); }
    .launch:disabled { cursor: not-allowed; opacity: .48; filter: grayscale(.18); }

    .external-icon {
      width: 16px;
      height: 16px;
      display: inline-block;
    }

    .latest-card {
      margin-top: 18px;
      display: none;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,.025);
    }

    .latest-card.visible { display: grid; }

    .latest-title {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .latest-version {
      margin: 0;
      font-weight: 850;
      letter-spacing: -.02em;
    }

    .latest-badge {
      padding: 6px 9px;
      border-radius: 999px;
      color: #b7ffd7;
      background: rgba(73,216,144,.10);
      border: 1px solid rgba(73,216,144,.16);
      font-size: .72rem;
      font-weight: 800;
    }

    .note {
      margin: 18px 0 0;
      color: #7f889d;
      font-size: .76rem;
      line-height: 1.55;
      text-align: center;
    }

    .note code {
      color: #b9c0cf;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media (max-width: 560px) {
      main { width: min(94vw, 680px); }
      .hero { padding: 26px 22px 22px; }
      .content { padding: 22px; }
      .brand-icon { width: 52px; height: 52px; flex-basis: 52px; border-radius: 15px; }
      .brand-icon img { width: 38px; height: 38px; }
      .subtitle { font-size: .9rem; }
      .status-strip { align-items: flex-start; }
      .status-text { white-space: normal; }
    }
  </style>
</head>

      }

      function numericSortDesc(a, b) {
        return Number(b) - Number(a);
      }

      function uniqueNumericFolders(items) {
        return [...new Set(items
          .map(String)
          .filter(name => /^\d+$/.test(name)))]
          .sort(numericSortDesc);
      }

      function githubContextFromCurrentUrl() {
        const hostMatch = location.hostname.match(/^([^.]+)\.github\.io$/i);
        if (!hostMatch) return null;

        const owner = hostMatch[1];
        const parts = location.pathname.split('/').filter(Boolean);
        if (!parts.length) return null;

        const repo = decodeURIComponent(parts.shift());
        const fileName = parts.at(-1) || '';
        if (/\.html?$/i.test(fileName)) parts.pop();

        return {
          owner,
          repo,
          path: parts.map(decodeURIComponent).join('/')
        };
      }

      async function discoverFromGitHub(repoInfo) {
        const encodedPath = repoInfo.path
          .split('/')
          .filter(Boolean)
          .map(encodeURIComponent)
          .join('/');

        const url = `https://api.github.com/repos/${encodeURIComponent(repoInfo.owner)}/${encodeURIComponent(repoInfo.repo)}/contents/${encodedPath}`;
        const response = await fetch(url, {
          headers: { 'Accept': 'application/vnd.github+json' },
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(`GitHub folder lookup failed (${response.status})`);
        }

        const data = await response.json();
        if (!Array.isArray(data)) throw new Error('Unexpected GitHub API response');

        return uniqueNumericFolders(
          data.filter(item => item && item.type === 'dir').map(item => item.name)
        );
      }

      async function folderExists(version) {
        // index.html avoids depending on directory-listing behavior.
        const target = new URL(`./${version}/index.html`, location.href);
        try {
          const response = await fetch(target.href, {
            method: 'GET',
            cache: 'no-store',
            redirect: 'follow'
          });
          return response.ok;
        } catch {
          return false;
        }
      }

      async function discoverFromLocalServer() {
        const found = [];
        let consecutiveMisses = 0;
        let startedFinding = false;

        for (let start = 1; start <= MAX_LOCAL_VERSION; start += LOCAL_BATCH_SIZE) {
          const batch = [];
          for (let version = start; version < start + LOCAL_BATCH_SIZE && version <= MAX_LOCAL_VERSION; version++) {
            batch.push(version);
          }

          const results = await Promise.all(batch.map(async version => ({
            version,
            exists: await folderExists(version)
          })));

          for (const result of results) {
            if (result.exists) {
              found.push(String(result.version));
              startedFinding = true;
              consecutiveMisses = 0;
            } else if (startedFinding) {
              consecutiveMisses++;
            }
          }

          if (startedFinding && consecutiveMisses >= STOP_AFTER_CONSECUTIVE_MISSES) break;
        }

        return uniqueNumericFolders(found);
      }

      function populate(versions, sourceLabel) {
        select.innerHTML = '';

        if (!versions.length) {
          const option = document.createElement('option');
          option.textContent = 'No versions found';
          option.value = '';
          select.appendChild(option);
          select.disabled = true;
          launchBtn.disabled = true;
          versionCount.textContent = '0 versions';
          latestCard.classList.remove('visible');
          setStatus('error', 'No numeric version folders were detected.');
          return;
        }

        for (const version of versions) {
          const option = document.createElement('option');
          option.value = version;
          option.textContent = `v${version}`;
          select.appendChild(option);
        }

        select.disabled = false;
        launchBtn.disabled = false;
        versionCount.textContent = `${versions.length} version${versions.length === 1 ? '' : 's'}`;
        latestVersion.textContent = `MediaFlow v${versions[0]}`;
        latestCard.classList.add('visible');
        setStatus('ready', `${versions.length} versions detected · ${sourceLabel}`);
        updateLaunchLabel();
      }

      function updateLaunchLabel() {
        const version = select.value;
        launchText.textContent = version ? `Launch MediaFlow v${version}` : 'Launch MediaFlow';
      }

      function launchSelected() {
        const version = select.value;
        if (!version || !/^\d+$/.test(version)) return;

        const target = new URL(`./${version}/`, location.href);
        window.open(target.href, '_blank', 'noopener,noreferrer');
      }

      async function discoverVersions() {
        refreshBtn.disabled = true;
        select.disabled = true;
        launchBtn.disabled = true;
        setStatus('loading', 'Scanning available versions…');

        let versions = [];
        let sourceLabel = '';
        let lastError = null;

        // 1) On GitHub Pages, ask the repository directly. This is the most exact
        //    way for a static page to know which folders actually exist.
        const githubContext = githubContextFromCurrentUrl();
        if (githubContext) {
          try {
            versions = await discoverFromGitHub(githubContext);
            sourceLabel = 'GitHub repository';
          } catch (error) {
            lastError = error;
          }
        }

        // 2) On localhost / another HTTP static server, probe ./1/index.html,
        //    ./2/index.html, etc. This detects newly-created local version folders.
        if (!versions.length && location.protocol !== 'file:') {
          try {
            versions = await discoverFromLocalServer();
            sourceLabel = 'local folders';
          } catch (error) {
            lastError = error;
          }
        }

        // 3) Browsers intentionally block folder enumeration from file://.
        //    In that case, use the public GitHub repo as the version source while
        //    keeping launch targets relative, so clicks still open local folders.
        if (!versions.length) {
          try {
            versions = await discoverFromGitHub(FALLBACK_REPO);
            sourceLabel = location.protocol === 'file:' ? 'GitHub list · local launch' : 'GitHub fallback';
          } catch (error) {
            lastError = error;
          }
        }

        if (versions.length) {
          populate(versions, sourceLabel);
        } else {
          populate([], sourceLabel);
          if (lastError) {
            statusText.textContent = `Could not detect versions: ${lastError.message}`;
          }
        }

        refreshBtn.disabled = false;
      }

      select.addEventListener('change', updateLaunchLabel);
      launchBtn.addEventListener('click', launchSelected);
      refreshBtn.addEventListener('click', discoverVersions);

      document.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !launchBtn.disabled) launchSelected();
      });

      discoverVersions();
    })();
  </script>
</body>
</html>
