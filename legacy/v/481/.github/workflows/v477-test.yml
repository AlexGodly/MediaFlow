name: MediaFlow v477 Readable Background Processes Footer Quality Gate
on:
  push:
    branches: [fix/v477-background-widget-footer-wrapping]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v477-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "477"
          python scripts/build.py
          node --check src/js/components/364-v477-background-footer-layout.js
          node --check assets/js/mediaflow-v477.bundle.js
          node --check src/js/core/rendering/035-render-loop-init.js
          node scripts/test-v477-footer-layout.cjs
          node scripts/test-v477-pwa-contract.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==477
          assert 'mediaflow-v477.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=477' in sw
          assert 'mediaflow-pwa-v477-shell' in sw
          assert 'mediaflow-v477.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v477 release/PWA coherence PASS')
          PY
      - name: Chromium mobile and desktop regression suite
        run: node scripts/test-v477-browser.cjs
      - name: Archive verified complete v477 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/477
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/477/
          test "$(cat legacy/v/477/VERSION)" = "477"
          test -s legacy/v/477/assets/js/mediaflow-v477.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v477.bundle.js
          git add --sparse -f legacy/v/477
          if ! git diff --cached --quiet; then
            git commit -m 'build(v477): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:fix/v477-background-widget-footer-wrapping
          fi
