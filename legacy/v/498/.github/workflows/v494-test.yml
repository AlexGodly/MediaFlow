name: MediaFlow v494 Theme Preview Laboratory & Comparison Quality Gate
on:
  push:
    branches: [feature/v494-theme-preview-laboratory]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mediaflow-v494-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/legacy/
            !/beta/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify latest PWA, data and XP contracts
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "494"
          python scripts/build.py
          node --check src/js/components/381-v494-theme-preview-laboratory.js
          node --check assets/js/mediaflow-v494.bundle.js
          node --check src/js/core/rendering/035-render-loop-init.js
          node scripts/test-v494-preview-laboratory.cjs
          node scripts/test-v494-cover-compat.cjs
          node scripts/test-v494-expressiveness-compat.cjs
          node scripts/test-v494-readability-compat.cjs
          node scripts/test-v494-mood-compat.cjs
          node scripts/test-v494-harmony-compat.cjs
          node scripts/test-v494-composition-compat.cjs
          node scripts/test-v494-artwork-compat.cjs
          node scripts/test-v494-source-compat.cjs
          node scripts/test-v494-ownership-compat.cjs
          node scripts/test-v494-visual-compat.cjs
          node scripts/test-v494-recovery-compat.cjs
          python scripts/check.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.')
          assert json.loads((r/'version.json').read_text())['appVersion']==494
          assert 'mediaflow-v494.bundle.js' in (r/'index.html').read_text()
          sw=(r/'sw.js').read_text()
          assert 'const MEDIAFLOW_VERSION=494' in sw
          assert 'mediaflow-pwa-v494-shell' in sw
          assert 'mediaflow-v494.bundle.js' in sw
          assert json.loads((r/'manifest.json').read_text())['scope']=='./'
          print('v494 release/PWA coherence PASS')
          PY
      - name: Side-by-side preview isolation, cover corrections and Legacy compatibility
        run: |
          node scripts/test-v494-ownership-compat.cjs
          node scripts/test-v494-visual-compat.cjs
          node scripts/test-v494-recovery-compat.cjs
      - name: Archive verified complete v494 project
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy/v/494
          rsync -a --exclude='/.git/' --exclude='/legacy/' --exclude='/beta/' --exclude='/artifacts/' ./ legacy/v/494/
          test "$(cat legacy/v/494/VERSION)" = "494"
          test -s legacy/v/494/assets/js/mediaflow-v494.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js version.json manifest.json assets/js/mediaflow-v494.bundle.js
          git add --sparse -f legacy/v/494
          if ! git diff --cached --quiet; then
            git commit -m 'build(v494): verified PWA and complete source archive [skip ci]'
            git push origin HEAD:feature/v494-theme-preview-laboratory
          fi
