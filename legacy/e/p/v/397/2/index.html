html[data-theme="purple"]{--bg:#140d23;--sidebar:#1d112f;--panel:#27193c;--panel-raised:#31234b;--border:#524068;--border-soft:#433457;--text:#fbf3ff;--text-dim:#d5c0e8;--text-mute:#a895be;--flow:#b691f8;--accent:#b691f8;--accent2:#dbbfff;--float-ink:#1c0b30}

/* Simulate the global MediaFlow theme applying to the entire preview. */

html[data-theme] .btn,html[data-theme] select,html[data-theme] input{background:var(--panel-raised);border-color:var(--border);color:var(--text)}
html[data-theme] .btn.primary{background:var(--flow);border-color:var(--flow);color:var(--float-ink)}
html[data-theme] .btn:hover{background:color-mix(in srgb,var(--flow) 15%,var(--panel-raised))}
html[data-theme] .demo-tag{background:color-mix(in srgb,var(--flow) 15%,var(--panel));border-color:color-mix(in srgb,var(--flow) 55%,var(--border));color:var(--text)}
html[data-theme] .stat label,html[data-theme] .controlgroup label{color:var(--text-dim)}
html[data-theme] .stat small,html[data-theme] .trybox p,html[data-theme] .item-info small{color:var(--text-dim)}
html[data-theme] .eyebrow,html[data-theme] .target-small,html[data-theme] .notice strong{color:var(--flow)}
html[data-theme] .mobilebar{background:var(--panel);border-color:var(--border)}
html[data-theme] .mobilebar button.active{color:var(--flow)}
html[data-theme] .modal{background:var(--panel);border-color:var(--border);color:var(--text)}
html[data-theme] .modal p,html[data-theme] .formrow label{color:var(--text-dim)}
html[data-theme] .toast{background:var(--panel-raised);color:var(--text);border-color:var(--flow)}
.theme-setting{display:flex;align-items:center;gap:9px;color:var(--text-dim);font-size:11px;font-weight:750}
.theme-setting select{width:126px;padding:8px 10px;border:1px solid var(--border);color:var(--text);background:var(--panel-raised);font-size:11px}
.theme-setting select:focus-visible{outline-color:var(--flow)}
/* Both floating surfaces always inherit live theme tokens, including custom accent settings. */
html[data-theme] .fab{color:var(--float-ink);background:linear-gradient(135deg,color-mix(in srgb,var(--flow) 72%,white),var(--flow) 52%,color-mix(in srgb,var(--flow) 72%,black));border-color:color-mix(in srgb,var(--flow) 80%,var(--border));box-shadow:0 13px 36px #0005,0 0 0 5px color-mix(in srgb,var(--flow) 15%,transparent)}
html[data-theme] .fab:hover{box-shadow:0 17px 39px #0006,0 0 0 8px color-mix(in srgb,var(--flow) 19%,transparent)}
html[data-theme] .fab:after{border-color:color-mix(in srgb,var(--flow) 50%,transparent)}
html[data-theme] .fan-orbit{border-color:color-mix(in srgb,var(--flow) 44%,transparent)}
html[data-theme] .fan-orbit:before{border-color:color-mix(in srgb,var(--flow) 38%,transparent)}
html[data-theme] .fan-action{color:var(--text);background:linear-gradient(120deg,color-mix(in srgb,var(--flow) 8%,var(--panel-raised)),color-mix(in srgb,var(--panel) 94%,transparent));border-color:color-mix(in srgb,var(--flow) 34%,var(--border));box-shadow:0 15px 33px #0006}
html[data-theme] .fan-action:hover{background:color-mix(in srgb,var(--flow) 18%,var(--panel));border-color:var(--flow)}
html[data-theme] .fan-action .action-icon{background:color-mix(in srgb,var(--flow) 16%,var(--panel));border-color:color-mix(in srgb,var(--flow) 53%,var(--border));color:var(--flow)}
html[data-theme] .fan-action small{color:var(--text-dim)}
html[data-theme] .fan-action .index{color:var(--flow)}
/* Floating progress card: liquid-like ambient BACKGROUND, standard animated foreground progress bar. */
html[data-theme] .progress-card{--p-tint:var(--flow);isolation:isolate;overflow:hidden;border-color:color-mix(in srgb,var(--p-tint) 42%,var(--border));background:color-mix(in srgb,var(--panel) 93%,transparent);color:var(--text);box-shadow:var(--shadow),inset 0 1px color-mix(in srgb,var(--text) 5%,transparent)}
html[data-theme] .progress-card.over{--p-tint:var(--float-warn)}
html[data-theme] .progress-card.reached{--p-tint:var(--float-good)}
.progress-card>.p-head,.progress-card>.progress-flex,.progress-card>.p-bottom{position:relative;z-index:2}
.p-liquid-bg{position:absolute;inset:0;pointer-events:none;z-index:0;border-radius:inherit;overflow:hidden}
.p-liquid-aura{position:absolute;inset:-30% -10% -10%;background:radial-gradient(circle at 22% 100%,color-mix(in srgb,var(--p-tint) 18%,transparent),transparent 65%);animation:ambient-breathe 6s ease-in-out infinite alternate}
.p-liquid-wave{position:absolute;bottom:-24%;left:0;width:200%;height:110%;color:var(--p-tint);opacity:.16;animation:liquid-slide 9s linear infinite;will-change:transform}
.p-liquid-wave svg{height:100%;width:100%;display:block}
.p-liquid-wave.front{opacity:.12;bottom:-12%;animation:liquid-slide-reverse 13s linear infinite;color:color-mix(in srgb,var(--p-tint) 70%,var(--panel))}
.p-liquid-bg:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--panel) 75%,transparent),transparent 63%);pointer-events:none}
@keyframes liquid-slide{to{transform:translateX(-50%)}}
@keyframes liquid-slide-reverse{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes ambient-breathe{to{transform:translate3d(5%,2%,0) scale(1.1);opacity:.65}}
html[data-theme] .p-name{color:var(--text-dim)}
html[data-theme] .p-name i{background:var(--p-tint);box-shadow:0 0 12px var(--p-tint)}
html[data-theme] .collapse{color:var(--text-dim)}
html[data-theme] .p-count small,html[data-theme] .p-range,html[data-theme] .p-percent small{color:var(--text-dim)}
html[data-theme] .p-percent{border-color:var(--border)}
html[data-theme] .p-percent strong{color:var(--text);text-shadow:0 0 16px color-mix(in srgb,var(--p-tint) 22%,transparent)}
html[data-theme] .p-track{background:color-mix(in srgb,var(--bg) 72%,var(--panel));border-color:var(--border)}
html[data-theme] .p-fill{background:linear-gradient(100deg,var(--p-tint) 0%,color-mix(in srgb,var(--p-tint) 55%,white) 40%,var(--p-tint) 67%,color-mix(in srgb,var(--p-tint) 65%,white) 95%);background-size:250% 100%;box-shadow:0 0 16px color-mix(in srgb,var(--p-tint) 38%,transparent),inset 0 2px color-mix(in srgb,white 35%,transparent)}
html[data-theme] .p-status{color:var(--p-tint)}
html[data-theme] .p-head-num{color:var(--text)}
html[data-theme] .progress-card.goalflash{animation:goalflash .7s ease-out}
html[data-theme] .qty button{background:var(--panel-raised);color:var(--text)}
@media(max-width:650px){.theme-setting span{display:none}.theme-setting select{width:111px;padding:7px}.header-right{gap:6px}.header-right .demo-tag{display:none}.p-liquid-wave{height:130%}}
@media(prefers-reduced-motion:reduce){.p-liquid-wave,.p-liquid-aura{will-change:auto}}

<body>
<div class="app">
  <aside class="sidebar"><div class="brand"><div class="brand-mark">M</div><div><strong>MEDIAFLOW</strong><small>v397 concept</small></div></div><div class="nav-kicker">WORKSPACE</div><nav class="nav" id="sidenav"></nav><div class="sidefoot"><strong>Interactive design preview</strong><p>This is a standalone simulation. Nothing in your real MediaFlow Library, Collections, or Logging draft is changed.</p></div></aside>
  <div class="main"><header class="topbar"><div class="breadcrumbs"><span>MEDIAFLOW</span><span>›</span><b id="crumb">Dashboard</b></div><div class="header-right"><label class="theme-setting" for="theme-select"><span>MediaFlow theme</span><select id="theme-select" aria-label="MediaFlow theme preview" onchange="setPreviewTheme(this.value)">
<option value="dark">Dark</option><option value="light">Light</option><option value="amoled">AMOLED</option><option value="midnight">Midnight</option><option value="ocean">Ocean</option><option value="forest">Forest</option><option value="sunset" selected>Sunset</option><option value="purple">Purple</option><option value="rose">Rose</option></select></label><span class="demo-tag">Prototype only</span></div></header><main id="page" class="page"></main></div>
</div>
<nav class="mobilebar" id="mobilebar"></nav>
<div id="menu-dimmer" class="menu-dimmer" onclick="closeQuick()"></div>
<div class="floatdock" id="floatdock">
  <div class="fab-wrap"><div class="fan" id="quick-fan"><div class="fan-orbit"></div>
    <button class="fan-action a1" onclick="quickAction('logging')"><span class="action-icon" id="quick-logging-icon"></span><span><strong>Add to Logging</strong><small>Open Logging Library picker</small></span><span class="index">01</span></button>
    <button class="fan-action a2" onclick="quickAction('library')"><span class="action-icon" id="quick-library-icon"></span><span><strong>Add to Library</strong><small>Open Add Title editor</small></span><span class="index">02</span></button>
    <button class="fan-action a3" onclick="quickAction('collection')"><span class="action-icon" id="quick-collection-icon"></span><span><strong>Add Collection</strong><small>Create & open collection</small></span><span class="index">03</span></button>
  </div><button class="fab" id="fab" aria-label="Open quick actions" aria-expanded="false" aria-controls="quick-fan" title="Quick actions" onclick="toggleQuick()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></button></div>
  <div class="progress-card" id="progress-card" aria-live="off"><div class="p-liquid-bg" aria-hidden="true"><div class="p-liquid-aura"></div><div class="p-liquid-wave back"><svg viewBox="0 0 800 180" preserveAspectRatio="none" aria-hidden="true"><path d="M0 62 Q50 32 100 62 T200 62 T300 62 T400 62 T500 62 T600 62 T700 62 T800 62 L800 180 H0 Z" fill="currentColor"/></svg></div><div class="p-liquid-wave front"><svg viewBox="0 0 800 180" preserveAspectRatio="none" aria-hidden="true"><path d="M0 78 Q50 49 100 78 T200 78 T300 78 T400 78 T500 78 T600 78 T700 78 T800 78 L800 180 H0 Z" fill="currentColor"/></svg></div></div><div class="p-head"><span class="p-name"><i></i><span id="progress-label">TASK PROGRESS · SEASONAL ANIME</span></span><span id="p-head-num" class="p-head-num"></span><button class="collapse" id="collapse" onclick="toggleCompact()" aria-label="Minimize task progress" title="Minimize/expand task progress"><svg id="collapse-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/></svg></button></div><div class="progress-flex"><div class="progress-left"><div class="p-count"><span id="p-count">7 / 10</span><small id="p-unit">episodes</small></div><div class="p-track"><div class="p-fill" id="p-fill"></div><span class="p-marker" id="p-marker"></span></div></div><div class="p-percent"><strong id="p-percent">50%</strong><small>COMPLETE</small></div></div><div class="p-bottom"><span class="p-status"><i></i><span id="p-status">In progress</span></span><span class="p-range" id="p-range">GOAL 10–14</span></div></div>
</div>
<div class="modal-layer" id="modal-layer" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const icons={dashboard:'<path d="M3 12.5 12 4l9 8.5V21H3v-8.5Z"/><path d="M9 21v-7h6v7"/>',logging:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/><path d="m5.7 9 .6.6 1-1"/>',library:'<path d="M5 4h14v17H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M6 17h13M9 8h6"/>',collections:'<rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 9V5a2 2 0 0 1 2-2h5l2 3"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',check:'<path d="M4 13 9.5 18 20 6"/>',arrow:'<path d="M4 12h16m-7-7 7 7-7 7"/>'};
const ico=(name,n=20)=>`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.plus}</svg>`;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data={view:'dashboard',task:'seasonal',goal:'range',search:'',library:[
 {id:1,title:'Tetsunabe no Jan!',category:'seasonal',cover:'🍜',tone:'',status:'Watching'},
 {id:2,title:'Yomi no Tsugai',category:'seasonal',cover:'🌙',tone:'violet',status:'Watching'},
 {id:3,title:'The Beginning After the End',category:'manga',cover:'📖',tone:'green',status:'Reading'},
 {id:4,title:'Frieren',category:'seasonal',cover:'✨',tone:'blue',status:'Watching'},
 {id:5,title:'Blue Lock',category:'seasonal',cover:'⚽',tone:'blue',status:'Watching'},
 {id:6,title:'Vinland Saga',category:'manga',cover:'🗡️',tone:'green',status:'Reading'},
 {id:7,title:'Interstellar',category:'movies',cover:'🪐',tone:'violet',status:'Watching'},
 ],draft:[{id:1,qty:4},{id:2,qty:3},{id:3,qty:8}],collections:[{id:1,title:'Weekend Queue',items:[1,2]}],openCollection:null,compact:false,menu:false};
const categories={seasonal:{label:'Seasonal Anime',unit:'episodes',singular:'episode',type:'watch'},manga:{label:'Asian Comics',unit:'chapters',singular:'chapter',type:'read'},movies:{label:'Movies',unit:'movies',singular:'movie',type:'watch'}};
const navItems=[['dashboard','Dashboard'],['logging','Logging'],['library','Library'],['collections','Collections']];
let nextId=10, currentPct=0, animFrame=0, previousStatus='', toastTimer=0;
const taskGoal=()=>data.goal==='fixed'?{low:3,high:3}:{low:10,high:14};
const catOf=id=>data.library.find(x=>x.id===id)?.category;
const matchingDraft=()=>data.draft.filter(e=>catOf(e.id)===data.task);
const countMatching=()=>matchingDraft().reduce((a,e)=>a+Math.max(0,e.qty),0);
const statusOf=(amount,low,high)=>{if(!amount)return 'Ready to log';if(amount<low)return 'In progress';if(amount===low && low!==high)return 'Minimum reached';if(amount>high){const type=categories[data.task].type;return type==='read'?'Overread':type==='watch'?'Overwatched':'Beyond target';}if(amount===high)return 'Goal reached';return 'Within recommended range';};
function navHtml(){const nav=navItems.map(([id,label])=>`<button class="${data.view===id?'active':''}" onclick="navigate('${id}')">${ico(id,18)}<span>${label}</span></button>`).join('');document.getElementById('sidenav').innerHTML=nav;document.getElementById('mobilebar').innerHTML=navItems.map(([id,label])=>`<button class="${data.view===id?'active':''}" onclick="navigate('${id}')">${ico(id,18)}<span>${label}</span></button>`).join('');document.getElementById('crumb').textContent=data.view==='collections'&&data.openCollection?data.collections.find(c=>c.id===data.openCollection)?.title||'Collections':navItems.find(n=>n[0]===data.view)?.[1]||'Dashboard';}
function navigate(view,focus=false){data.view=view;if(view!=='collections')data.openCollection=null;data.search='';closeQuick();navHtml();render();window.scrollTo({top:0,behavior:'smooth'});if(focus)setTimeout(()=>document.getElementById('title-search')?.focus(),100)}
function render(){navHtml();const pages={dashboard:dashboardPage,logging:loggingPage,library:libraryPage,collections:collectionsPage};document.getElementById('page').innerHTML=pages[data.view]();updateProgress()}
function head(label,title,description,extra=''){return `<div class="page-head"><div><div class="eyebrow">${label}</div><h1>${title}</h1><p class="lede">${description}</p></div>${extra}</div>`}
function dashboardPage(){const cat=categories[data.task],goal=taskGoal();return head('INTERACTIVE CONCEPT','Today','A realistic preview of where the floating controls will appear.',`<button class="btn mini" onclick="clearDraft()">Reset demo draft</button>`)+`<div class="card task"><div class="row between"><div class="target-small">◈ &nbsp; NEXT TASK</div><span class="demo-tag">Live demo values</span></div><div style="margin-top:17px"><span class="task-cat">◈ &nbsp; ${cat.label}</span></div><h2>Consume ${goal.low===goal.high?goal.low:`${goal.low}–${goal.high}`} ${cat.unit}</h2><p>Only the draft consumption from <b>${cat.label}</b> contributes to the floating Task Progress bar. Other categories do not affect it.</p><div class="task-options"><button class="btn primary" onclick="navigate('logging',true)">${ico('logging',16)} Open Logging Library</button><button class="btn" onclick="setTask('${data.task}',data.goal==='range'?'fixed':'range')">Try ${data.goal==='range'?'3 units':'10–14 units'}</button></div></div><div class="info-grid"><div class="stat"><label>TASK-CATEGORY DRAFT</label><strong>${countMatching()} ${cat.unit}</strong><small>Tracked by the floating bar</small></div><div class="stat"><label>OTHER-CATEGORY DRAFT</label><strong>${data.draft.filter(e=>catOf(e.id)!==data.task).reduce((n,e)=>n+e.qty,0)} units</strong><small>Excluded from Task Progress</small></div><div class="stat"><label>TITLE ENTRIES IN DRAFT</label><strong>${data.draft.length}</strong><small>At least one matching title is required to show the bar</small></div></div>${controlsPanel()}<div class="notice"><strong>Try this:</strong> Click the floating orange + in the bottom-right, then choose <strong>Add to Logging</strong>, <strong>Add to Library</strong>, or <strong>Add Collection</strong>. The animated bar appears only when your draft includes at least one title from the task category.</div>`}
function controlsPanel(){return `<div class="trybox"><h3>Prototype controls — simulate different task scenarios</h3><p>These are test controls only. They won't be part of the floating widget itself.</p><div class="select-row"><div class="controlgroup"><label>Task category</label><select onchange="setTask(this.value,data.goal)">${Object.entries(categories).map(([key,c])=>`<option value="${key}" ${key===data.task?'selected':''}>${c.label}</option>`).join('')}</select></div><div class="controlgroup"><label>Suggested target</label><select onchange="setTask(data.task,this.value)"><option value="range" ${data.goal==='range'?'selected':''}>10–14 ${categories[data.task].unit}</option><option value="fixed" ${data.goal==='fixed'?'selected':''}>3 ${categories[data.task].unit}</option></select></div><button class="btn mini" onclick="clearDraft()" style="align-self:end">Clear logging draft</button></div></div>`}
function coverHtml(item){return `<div class="cover ${item.tone||''}">${item.cover||'▤'}</div>`}
function loggingPage(){const cat=categories[data.task],goal=taskGoal();const list=data.library.filter(x=>x.title.toLowerCase().includes(data.search.toLowerCase()));return head('QUICK ACTION TARGET','Logging Library',`Select any title. Only <b>${cat.label}</b> contributes toward the current task (${goal.low===goal.high?goal.low:`${goal.low}–${goal.high}`} ${cat.unit}).`)+`<div class="row between" style="margin-bottom:16px"><div><strong>Library picker</strong><div class="lede">Add titles from any category without losing the current draft.</div></div><input id="title-search" class="search" placeholder="Search titles…" value="${escapeHtml(data.search)}" oninput="setSearch(this.value)"></div><div class="list" id="library-picker-list">${list.length?list.map(pickerItem).join(''):'<div class="empty">No matching titles</div>'}</div><h2 style="font-size:18px;margin:36px 0 13px">Titles in current draft <small style="font-size:12px;color:#a99e91">(${data.draft.length})</small></h2><div class="list">${data.draft.length?data.draft.map(draftItem).join(''):'<div class="empty"><strong>No titles added</strong>Use the Library picker above to add your first title.</div>'}</div><p class="mini-help">Quantities simulate Per Unit, Last Watched, Amount Consumed and Quick Logging consumption. The production feature will read the real draft records for each method. <strong>No actual History is saved by this prototype.</strong></p>`}
function pickerItem(item){const entry=data.draft.find(e=>e.id===item.id);return `<div class="item" data-title-id="${item.id}"><div class="item-main">${coverHtml(item)}<div class="item-info"><b>${escapeHtml(item.title)}</b><small>${escapeHtml(categories[item.category].label)} · ${item.status}</small></div></div><div class="item-actions">${entry?`<span style="font-size:11px;color:#96ddb0">✓ Added to draft</span><button class="btn mini" onclick="removeTitle(${item.id})">Remove</button>`:`<button class="btn mini primary" onclick="addTitleToDraft(${item.id})">${ico('plus',14)} Add to Logging</button>`}</div></div>`}
function draftItem(entry){const item=data.library.find(i=>i.id===entry.id);if(!item)return '';const counts=item.category===data.task;return `<div class="item"><div class="item-main">${coverHtml(item)}<div class="item-info"><b>${escapeHtml(item.title)}</b><small>${escapeHtml(categories[item.category].label)} · <span style="color:${counts?'#87d2a9':'#b8a198'}">${counts?'Counts toward current task':'Excluded — different category'}</span></small></div></div><div class="item-actions"><div class="qty"><button aria-label="Reduce quantity" onclick="changeQty(${entry.id},-1)">−</button><span>${entry.qty}</span><button aria-label="Increase quantity" onclick="changeQty(${entry.id},1)">+</button></div><button class="btn mini" onclick="removeTitle(${entry.id})">Remove</button></div></div>`}
function libraryPage(){return head('QUICK ACTION TARGET','Library','New titles created with the floating + button appear here.',`<button class="btn primary" onclick="openTitleModal()">${ico('plus',16)} Add Title</button>`)+`<div class="list">${data.library.map(item=>`<div class="item"><div class="item-main">${coverHtml(item)}<div class="item-info"><b>${escapeHtml(item.title)}</b><small>${escapeHtml(categories[item.category].label)} · ${item.status}</small></div></div><button class="btn mini" onclick="navigate('logging',true)">Open in Logging</button></div>`).join('')}</div>`}
function collectionsPage(){const c=data.collections.find(x=>x.id===data.openCollection);if(c)return head('COLLECTION OPENED',escapeHtml(c.title),'The collection has been created, and MediaFlow automatically opened it for you.',`<button class="btn" onclick="data.openCollection=null;render()">← All Collections</button>`)+`<div class="card"><div class="row between"><h2 style="margin:0;font-size:18px">${escapeHtml(c.title)}</h2><span class="demo-tag">New collection opened</span></div><p class="lede" style="margin:13px 0 26px">Add titles and customize this collection in the real app. This is a prototype of the create-and-open workflow.</p><div class="list">${c.items.length?c.items.map(id=>{const item=data.library.find(i=>i.id===id);return item?`<div class="item">${coverHtml(item)}<strong>${escapeHtml(item.title)}</strong></div>`:''}).join(''):'<div class="empty"><strong>Empty collection</strong>Your new collection is open and ready for titles.</div>'}</div></div>`;return head('QUICK ACTION TARGET','Collections','Create a collection using the floating + button and it will open immediately.',`<button class="btn primary" onclick="openCollectionModal()">${ico('plus',16)} New Collection</button>`)+`<div class="list">${data.collections.map(c=>`<div class="item"><div class="item-main"><div class="cover">▦</div><div class="item-info"><b>${escapeHtml(c.title)}</b><small>${c.items.length} titles</small></div></div><button class="btn mini" onclick="openCollection(${c.id})">Open collection →</button></div>`).join('')}</div>`}
function setSearch(value){data.search=value;const list=data.library.filter(x=>x.title.toLowerCase().includes(value.toLowerCase()));document.getElementById('library-picker-list').innerHTML=list.length?list.map(pickerItem).join(''):'<div class="empty">No matching titles</div>'}
function setTask(cat,goal){data.task=cat;data.goal=goal;previousStatus='';render();toast('Task changed: '+categories[cat].label+' · '+(goal==='range'?'10–14':'3')+' '+categories[cat].unit)}
function clearDraft(){data.draft=[];previousStatus='';render();toast('Demo logging draft cleared. + remains visible.')}
function addTitleToDraft(id){if(!data.draft.some(x=>x.id===id))data.draft.push({id,qty:0});render();toast('Title added to Logging · starts at 0 units')}
function changeQty(id,difference){const e=data.draft.find(x=>x.id===id);if(!e)return;e.qty=Math.max(0,Math.min(999,e.qty+difference));render()}
function removeTitle(id){data.draft=data.draft.filter(x=>x.id!==id);render();toast('Title removed from draft')}
function updateProgress(){const el=document.getElementById('progress-card');const match=matchingDraft();const visible=match.length>0;el.classList.toggle('hide',!visible);const cat=categories[data.task],goal=taskGoal(),amount=countMatching();const value=goal.low===goal.high?goal.high:amount<=goal.low?goal.low:Math.min(amount,goal.high);const pct=Math.max(0,Math.min(100,(amount/goal.high)*100));const status=statusOf(amount,goal.low,goal.high);el.classList.toggle('over',amount>goal.high);el.classList.toggle('reached',amount>=goal.low&&amount<=goal.high);el.classList.toggle('minimized',data.compact);document.getElementById('progress-label').textContent='TASK PROGRESS · '+cat.label.toUpperCase();document.getElementById('p-count').textContent=amount+' / '+value;document.getElementById('p-unit').textContent=cat.unit;document.getElementById('p-status').textContent=status;document.getElementById('p-range').textContent='GOAL '+(goal.low===goal.high?goal.low:goal.low+'–'+goal.high);document.getElementById('p-marker').style.setProperty('--marker',(goal.low/goal.high*100)+'%');document.getElementById('p-marker').style.display=goal.low===goal.high?'none':'block';document.getElementById('p-fill').style.width=pct+'%';document.getElementById('p-head-num').textContent=Math.round(pct)+'%';if(visible&&status!==previousStatus&&amount>=goal.low&&amount<=goal.high){el.classList.remove('goalflash');void el.offsetWidth;el.classList.add('goalflash')}previousStatus=visible?status:'';countTo(pct);document.getElementById('collapse').setAttribute('aria-label',data.compact?'Expand task progress':'Minimize task progress')}
function countTo(target){cancelAnimationFrame(animFrame);const start=currentPct,begin=performance.now(),duration=440;function step(now){const t=Math.min(1,(now-begin)/duration),ease=1-Math.pow(1-t,3);currentPct=start+(target-start)*ease;document.getElementById('p-percent').textContent=Math.round(currentPct)+'%';if(t<1)animFrame=requestAnimationFrame(step)}animFrame=requestAnimationFrame(step)}
function toggleCompact(){data.compact=!data.compact;updateProgress()}
function toggleQuick(){data.menu=!data.menu;const fab=document.getElementById('fab'),fan=document.getElementById('quick-fan');fab.setAttribute('aria-expanded',String(data.menu));fab.setAttribute('aria-label',data.menu?'Close quick actions':'Open quick actions');fan.classList.toggle('open',data.menu);document.getElementById('menu-dimmer').classList.toggle('on',data.menu)}
function closeQuick(){if(data.menu)toggleQuick()}
function quickAction(action){closeQuick();if(action==='logging')navigate('logging',true);if(action==='library')openTitleModal();if(action==='collection')openCollectionModal()}
function openTitleModal(){closeQuick();showModal(`<div class="eyebrow">QUICK ACTION · LIBRARY</div><h2>Add Title to Library</h2><p>This opens the existing Library title creation flow in the real app. Here you can try the prototype.</p><form onsubmit="submitTitle(event)"><div class="formrow"><label for="title-name">Title name</label><input id="title-name" name="title" placeholder="Enter a media title" required maxlength="120" autofocus></div><div class="formrow"><label for="title-category">Category</label><select id="title-category" name="category">${Object.entries(categories).map(([key,c])=>`<option value="${key}" ${key===data.task?'selected':''}>${c.label}</option>`).join('')}</select></div><div class="modalbuttons"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Create Title</button></div></form>`)}
function submitTitle(ev){ev.preventDefault();const form=new FormData(ev.target);const title=String(form.get('title')||'').trim().slice(0,120);if(!title)return;const category=String(form.get('category')||data.task);data.library.unshift({id:nextId++,title,category,cover:'✦',tone:'',status:'Planned'});closeModal();navigate('library');toast('New demo title added to Library')}
function openCollectionModal(){closeQuick();showModal(`<div class="eyebrow">QUICK ACTION · COLLECTIONS</div><h2>Create Collection</h2><p>Saving creates the collection and <strong style="color:#ffe0bd">opens that collection automatically</strong>, as requested.</p><form onsubmit="submitCollection(event)"><div class="formrow"><label for="collection-name">Collection name</label><input id="collection-name" name="name" placeholder="e.g. My Favorite Anime" required maxlength="100"></div><div class="modalbuttons"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Create & Open</button></div></form>`)}
function submitCollection(ev){ev.preventDefault();const form=new FormData(ev.target);const title=String(form.get('name')||'').trim().slice(0,100);if(!title)return;const id=nextId++;data.collections.push({id,title,items:[]});closeModal();data.view='collections';data.openCollection=id;navHtml();render();window.scrollTo({top:0,behavior:'smooth'});toast('Collection created and opened')}
function openCollection(id){data.openCollection=id;data.view='collections';render()}
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modal-layer').classList.add('open');setTimeout(()=>document.getElementById('modal').querySelector('input')?.focus(),60)}
function closeModal(){document.getElementById('modal-layer').classList.remove('open');document.getElementById('modal').innerHTML=''}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(document.getElementById('modal-layer').classList.contains('open'))closeModal();else closeQuick()}});
document.getElementById('quick-logging-icon').innerHTML=ico('logging');document.getElementById('quick-library-icon').innerHTML=ico('library');document.getElementById('quick-collection-icon').innerHTML=ico('collections');
// This standalone preview models MediaFlow Settings -> Theme. In the actual app
// no palette duplication is needed: both widgets will inherit the live CSS
// variables from the active html[data-theme] and its custom theme overrides.
function setPreviewTheme(theme){
  const choices=['dark','light','amoled','midnight','ocean','forest','sunset','purple','rose'];
  const next=choices.includes(theme)?theme:'sunset';
  document.documentElement.dataset.theme=next;
  const selector=document.getElementById('theme-select');if(selector)selector.value=next;
}
setPreviewTheme('sunset');

render();
</script>
</body>
</html>
