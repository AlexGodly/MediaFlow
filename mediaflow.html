<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MediaFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E111A;
  --panel:#161B29;
  --panel-raised:#1D2436;
  --border:#2A3149;
  --border-soft:#232A40;
  --text:#EDEFF6;
  --text-dim:#9AA3BC;
  --text-mute:#6A7290;

  --flow:#E8A94A;
  --flow-dim:#8a6a35;
  --healthy:#3FC7A6;
  --neglect:#9C8CF5;
  --overused:#E8607A;
  --due:#5AA9E6;

  --radius-s:6px;
  --radius-m:12px;
  --radius-l:20px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse 1200px 800px at 10% -10%, #1A2036 0%, var(--bg) 55%);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--flow); color:#1a1200;}
a{color:inherit;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#2a3149;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:236px; flex-shrink:0;
  background:linear-gradient(180deg, #131826 0%, #10131F 100%);
  border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column;
  padding:26px 16px;
  position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px 26px 8px;}
.brand-mark{
  width:34px; height:34px; border-radius:10px;
  background:conic-gradient(from 220deg, var(--flow), var(--healthy), var(--neglect), var(--flow));
  flex-shrink:0;
}
.brand-name{font-family:var(--font-display); font-size:19px; font-weight:600; letter-spacing:0.2px;}
.brand-sub{font-size:11px; color:var(--text-mute); margin-top:1px;}

.nav{display:flex; flex-direction:column; gap:2px; margin-top:8px;}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:10px 12px; border-radius:var(--radius-s);
  color:var(--text-dim); cursor:pointer; font-size:14px; font-weight:600;
  border:1px solid transparent; transition:background .15s, color .15s;
  user-select:none;
}
.nav-item svg{width:17px; height:17px; opacity:.85; flex-shrink:0;}
.nav-item:hover{background:var(--panel); color:var(--text);}
.nav-item.active{background:var(--panel-raised); color:var(--text); border-color:var(--border-soft);}
.nav-item.active svg{opacity:1; color:var(--flow);}

.sidebar-foot{margin-top:auto; padding:14px 10px; border-top:1px solid var(--border-soft);}
.sidebar-foot .k{font-size:11px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.06em;}
.sidebar-foot .v{font-family:var(--font-display); font-size:22px; margin-top:2px;}

/* ---------- Main ---------- */
.main{flex:1; min-width:0; padding:32px 40px 90px 40px;}
.view-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
.view-title{font-family:var(--font-display); font-size:28px; font-weight:600;}
.view-desc{color:var(--text-dim); font-size:13.5px; margin-top:4px;}

.container{max-width:1080px;}

/* ---------- Cards / primitives ---------- */
.card{
  background:var(--panel); border:1px solid var(--border-soft);
  border-radius:var(--radius-m); padding:20px;
}
.hairline{border-top:1px solid var(--border-soft);}
.section-label{font-size:12px; font-weight:700; color:var(--text-mute); letter-spacing:.04em; margin-bottom:10px;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:10px 18px; border-radius:9px; font-size:14px; font-weight:700;
  border:1px solid var(--border); background:var(--panel-raised); color:var(--text);
  cursor:pointer; transition:transform .1s ease, background .15s, border-color .15s;
}
.btn:hover{border-color:#3b4568;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--flow); color:#1c1305; border-color:var(--flow);}
.btn-primary:hover{background:#f0b65c;}
.btn-ghost{background:transparent; border-color:transparent; color:var(--text-dim);}
.btn-ghost:hover{color:var(--text); background:var(--panel);}
.btn-danger{background:transparent; border-color:var(--overused); color:var(--overused);}
.btn-danger:hover{background:rgba(232,96,122,.1);}
.btn-sm{padding:7px 12px; font-size:12.5px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.pill{
  display:inline-flex; align-items:center; gap:5px;
  padding:4px 10px; border-radius:99px; font-size:11.5px; font-weight:700;
  background:var(--panel-raised); border:1px solid var(--border-soft); color:var(--text-dim);
}
.dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}

input[type=text],input[type=number],select,textarea{
  width:100%; background:#12172480; background:#10141F; border:1px solid var(--border);
  color:var(--text); padding:9px 11px; border-radius:8px; font-size:14px; outline:none;
}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--flow-dim);}
label.field-label{display:block; font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px;}
.field{margin-bottom:14px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
input[type=range]{-webkit-appearance:none; width:100%; height:4px; background:var(--border); border-radius:3px; outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--flow); cursor:pointer; margin-top:-6px;}
input[type=checkbox]{width:16px; height:16px; accent-color:var(--flow);}

.progress-track{height:8px; background:#10141F; border:1px solid var(--border-soft); border-radius:99px; overflow:hidden;}
.progress-fill{height:100%; border-radius:99px; background:linear-gradient(90deg, var(--flow-dim), var(--flow)); transition:width .4s ease;}

/* ---------- Dashboard ---------- */
.today-strip{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:22px;}
.stat-box{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:16px 18px;}
.stat-box .num{font-family:var(--font-display); font-size:26px; font-weight:600;}
.stat-box .lbl{font-size:12px; color:var(--text-mute); margin-top:2px;}
.stat-box .progress-track{margin-top:10px;}

.hero{
  position:relative; border-radius:var(--radius-l); padding:30px 34px;
  background:linear-gradient(155deg, #1B1F30 0%, #171B29 60%);
  border:1px solid var(--border-soft); overflow:hidden; margin-bottom:26px;
}
.hero::before{
  content:''; position:absolute; top:-60px; right:-60px; width:260px; height:260px; border-radius:50%;
  background:radial-gradient(circle, rgba(232,169,74,.16), transparent 70%);
}
.hero-eyebrow{font-size:12px; color:var(--text-mute); font-weight:700; letter-spacing:.03em;}
.hero-cat{display:flex; align-items:center; gap:14px; margin-top:10px;}
.hero-icon{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0;}
.hero-name{font-family:var(--font-display); font-size:32px; font-weight:600;}
.hero-amount{font-size:16px; color:var(--text-dim); margin-top:10px;}
.hero-amount b{color:var(--text); font-weight:700;}
.hero-note{font-size:13px; color:var(--text-mute); margin-top:4px; font-style:italic;}
.hero-reasons{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; position:relative; z-index:1;}
.hero-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; position:relative; z-index:1;}

.log-form{margin-top:18px; padding-top:18px; border-top:1px dashed var(--border);}

.balance-list{display:flex; flex-direction:column;}
.balance-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border-soft);}
.balance-row:last-child{border-bottom:none;}
.bal-icon{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.bal-name{font-size:14px; font-weight:600; flex-shrink:0; width:150px;}
.bal-amt{font-size:13px; color:var(--text-dim); flex:1;}
.status-badge{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:99px; flex-shrink:0;}
.status-healthy{color:var(--healthy); background:rgba(63,199,166,.12);}
.status-neglected{color:var(--neglect); background:rgba(156,140,245,.14);}
.status-overused{color:var(--overused); background:rgba(232,96,122,.13);}
.status-due{color:var(--due); background:rgba(90,169,230,.13);}

/* ---------- Grid layouts ---------- */
.two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}

/* ---------- Library ---------- */
.overview-row{display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--border-soft);}
.overview-row:last-child{border-bottom:none;}
.ov-name{width:170px; font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px; flex-shrink:0;}
.ov-track{flex:1;}
.ov-num{width:130px; text-align:right; font-size:12.5px; color:var(--text-dim); flex-shrink:0;}

.lib-toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; justify-content:space-between;}
.lib-filters{display:flex; gap:8px; flex-wrap:wrap;}
.lib-filters select{width:auto; padding:8px 10px; font-size:13px;}

.item-row{display:grid; grid-template-columns:auto 1fr auto auto auto auto; gap:14px; align-items:center; padding:13px 6px; border-bottom:1px solid var(--border-soft);}
.item-row:hover{background:var(--panel-raised);}
.item-title{font-weight:700; font-size:14px;}
.item-sub{font-size:12px; color:var(--text-mute); margin-top:2px;}
.tag{font-size:10.5px; background:var(--panel-raised); border:1px solid var(--border-soft); color:var(--text-mute); padding:2px 7px; border-radius:6px; margin-right:4px;}
.empty-state{padding:60px 20px; text-align:center; color:var(--text-mute);}
.empty-state .em-icon{font-size:38px; margin-bottom:10px;}
.empty-state .em-title{font-family:var(--font-display); font-size:19px; color:var(--text); margin-bottom:6px;}

/* ---------- History ---------- */
.hist-row{display:flex; align-items:flex-start; gap:14px; padding:15px 4px; border-bottom:1px solid var(--border-soft);}
.hist-date{width:96px; flex-shrink:0; font-size:12px; color:var(--text-mute); padding-top:3px;}
.hist-icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}
.hist-main{flex:1; min-width:0;}
.hist-cat{font-weight:700; font-size:14px;}
.hist-amt{font-size:13px; color:var(--text-dim); margin-top:2px;}
.hist-note{font-size:12.5px; color:var(--text-mute); margin-top:4px; font-style:italic;}
.hist-status{flex-shrink:0;}

/* ---------- Stats ---------- */
.bal-bar-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.bal-bar-label{width:150px; font-size:13px; font-weight:600; flex-shrink:0; display:flex; align-items:center; gap:7px;}
.bal-bar-track{flex:1; height:14px; background:#10141F; border:1px solid var(--border-soft); border-radius:6px; overflow:hidden;}
.bal-bar-fill{height:100%; border-radius:5px;}
.bal-bar-val{width:70px; text-align:right; font-size:12px; color:var(--text-dim); flex-shrink:0;}

.sat-grid{display:flex; flex-direction:column; gap:10px;}
.sat-row{display:flex; align-items:center; justify-content:space-between; padding:9px 12px; background:var(--panel-raised); border-radius:9px; border:1px solid var(--border-soft);}
.sat-cat{display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600;}
.sat-lvl{font-size:11px; font-weight:800; letter-spacing:.03em; padding:3px 10px; border-radius:99px;}

.record-list{display:flex; flex-direction:column; gap:0;}
.record-row{display:flex; justify-content:space-between; padding:11px 2px; border-bottom:1px solid var(--border-soft); font-size:13.5px;}
.record-row:last-child{border-bottom:none;}
.record-row .k{color:var(--text-dim);}
.record-row .v{font-weight:700;}

/* ---------- Settings ---------- */
.intensity-row{display:flex; gap:10px; margin-bottom:6px;}
.intensity-opt{flex:1; padding:13px; border-radius:10px; border:1px solid var(--border); background:var(--panel-raised); cursor:pointer; text-align:center;}
.intensity-opt.active{border-color:var(--flow); background:rgba(232,169,74,.09);}
.intensity-opt .t{font-weight:800; font-size:13.5px;}
.intensity-opt .d{font-size:11px; color:var(--text-mute); margin-top:2px;}

.cat-manage-row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border-soft);}
.cat-manage-row .name{flex:1; font-weight:700; font-size:14px;}
.cat-manage-row .meta{font-size:12px; color:var(--text-mute);}

.toggle{position:relative; width:38px; height:22px; border-radius:99px; background:var(--border); border:none; cursor:pointer; flex-shrink:0;}
.toggle.on{background:var(--flow);}
.toggle::after{content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s;}
.toggle.on::after{left:18px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(6,7,12,.65); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-l); padding:26px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto;}
.modal-title{font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:18px;}
.modal-actions{display:flex; gap:10px; margin-top:20px; justify-content:flex-end;}

/* ---------- Mobile ---------- */
.mobile-tabbar{display:none;}
@media (max-width: 860px){
  #app{flex-direction:column;}
  .sidebar{display:none;}
  .main{padding:20px 16px 90px 16px;}
  .today-strip{grid-template-columns:1fr; }
  .two-col{grid-template-columns:1fr;}
  .grid-2{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:1fr 1fr;}
  .item-row{grid-template-columns:1fr; row-gap:6px;}
  .field-row{grid-template-columns:1fr;}
  .mobile-tabbar{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:#12162280; background:#12162299; backdrop-filter:blur(10px);
    border-top:1px solid var(--border-soft); padding:8px 6px calc(env(safe-area-inset-bottom) + 8px) 6px;
    justify-content:space-around;
  }
  .mtab{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-mute); font-size:10px; font-weight:700; padding:5px 8px; border-radius:9px;}
  .mtab.active{color:var(--flow);}
  .mtab svg{width:19px; height:19px;}
  .brand{display:none;}
  .hero{padding:22px;}
  .hero-name{font-size:24px;}
  .view-title{font-size:22px;}
}
.hide{display:none !important;}
.fade-in{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.loader-wrap{display:flex; align-items:center; justify-content:center; height:100vh; width:100%; color:var(--text-mute); font-size:14px;}
.reason-explain{margin-top:14px; padding:12px 14px; background:var(--panel-raised); border:1px solid var(--border-soft); border-radius:10px; font-size:12.5px; color:var(--text-dim); line-height:1.6;}
.link-btn{background:none; border:none; color:var(--text-mute); font-size:12px; font-weight:700; cursor:pointer; text-decoration:underline; padding:0;}
small.hint{display:block; color:var(--text-mute); font-size:11.5px; margin-top:5px;}
</style>
</head>
<body>
<div id="app"><div class="loader-wrap">Loading MediaFlow…</div></div>

<script>
(function(){
'use strict';

/* ============================================================
   CONSTANTS
   ============================================================ */
const UNITS = {
  episodes: {label:'episodes', singular:'episode'},
  chapters: {label:'chapters', singular:'chapter'},
  movies:   {label:'movies', singular:'movie'},
  issues:   {label:'issues', singular:'issue'},
};

const DEFAULT_CATEGORIES = [
  {id:'seasonal',    name:'Seasonal Anime',      icon:'🔴', type:'video',   unit:'episodes', target:4,  weight:4, minutesPerUnit:24,  color:'#E8607A', seasonal:true,  enabled:true, custom:false},
  {id:'backlog',     name:'Anime Backlog',       icon:'🟢', type:'video',   unit:'episodes', target:5,  weight:3, minutesPerUnit:24,  color:'#3FC7A6', seasonal:false, enabled:true, custom:false},
  {id:'tv',          name:'TV Series',           icon:'📺', type:'video',   unit:'episodes', target:2,  weight:3, minutesPerUnit:42,  color:'#5AA9E6', seasonal:false, enabled:true, custom:false},
  {id:'otheranim',   name:'Other Animation',     icon:'🎨', type:'video',   unit:'episodes', target:2,  weight:2, minutesPerUnit:24,  color:'#F5A3D0', seasonal:false, enabled:true, custom:false},
  {id:'movies',      name:'Movies',              icon:'🎥', type:'video',   unit:'movies',   target:1,  weight:3, minutesPerUnit:115, color:'#E8A94A', seasonal:false, enabled:true, custom:false},
  {id:'animemovies', name:'Anime Movies',        icon:'🎞️', type:'video',   unit:'movies',   target:1,  weight:2, minutesPerUnit:100, color:'#C98CF5', seasonal:false, enabled:true, custom:false},
  {id:'manga',       name:'Manga',               icon:'📖', type:'reading', unit:'chapters', target:20, weight:4, minutesPerUnit:6,   color:'#9C8CF5', seasonal:false, enabled:true, custom:false},
  {id:'manhwa',      name:'Manhwa / Manhua',     icon:'📚', type:'reading', unit:'chapters', target:20, weight:3, minutesPerUnit:4,   color:'#4FD1C5', seasonal:false, enabled:true, custom:false},
  {id:'comics',      name:'Western Comics',      icon:'📰', type:'reading', unit:'issues',   target:3,  weight:2, minutesPerUnit:15,  color:'#F5C56A', seasonal:false, enabled:true, custom:false},
];

const DEFAULT_SETTINGS = {
  dailyMinutes: 180,
  tasksPerDay: 5,
  intensity: 'normal',
  neglectRate: 6,        // score / day untouched
  neglectCap: 42,
  repetitionPenalty: 12, // per occurrence in recent window
  consecutivePenalty: 26,// per consecutive repeat
  saturationWeight: 20,
  seasonalBonus: 15,
  randomness: 0.28,      // jitter fraction
  seasonalFreshCount: 0,
};

const INTENSITY_PRESETS = {
  light:    {tasksPerDay:3, dailyMinutes:90,  label:'Light',    desc:'2–3 tasks'},
  normal:   {tasksPerDay:5, dailyMinutes:180, label:'Normal',   desc:'4–6 tasks'},
  marathon: {tasksPerDay:8, dailyMinutes:300, label:'Marathon', desc:'7–10+ tasks'},
};

const ICON_CHOICES = ['🔴','🟢','📺','🎨','🎥','🎞️','📖','📚','📰','🌊','⚡','🧩','🎮','🎭','🎧','📼','🀄','🖼️','🕹️','✨'];
const COLOR_CHOICES = ['#E8607A','#3FC7A6','#5AA9E6','#F5A3D0','#E8A94A','#C98CF5','#9C8CF5','#4FD1C5','#F5C56A','#7EE787','#F58A5A','#6AD1E3'];

/* ============================================================
   STATE
   ============================================================ */
let S = {
  categories: null,
  library: null,
  sessions: null,
  settings: null,
  currentTask: null,
  sessionActive: false,
  view: 'dashboard',
  loading: true,
  modal: null,          // {type:'category'|'library', data:{...}} or null
  logging: false,       // is the inline log form open on the hero
  logDraft: {},
  histFilters: {category:'all', type:'all', range:'all'},
  showReasonDetail: false,
};

/* ============================================================
   STORAGE
   ============================================================ */
async function storageGet(key, fallback){
  try{
    // Standalone HTML files do not have the artifact-only window.storage API.
    // Use browser localStorage so progress survives refreshes and reopening the file.
    const raw = localStorage.getItem('mediaflow:' + key);
    if(raw !== null) return JSON.parse(raw);
  }catch(e){
    console.error('localStorage get failed', key, e);
  }

  // Keep compatibility with environments that provide window.storage.
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const r = await window.storage.get(key, false);
      if(r && r.value !== undefined && r.value !== null) return JSON.parse(r.value);
    }
  }catch(e){
    console.error('storage get failed', key, e);
  }

  return fallback;
}
async function storageSet(key, value){
  const serialized = JSON.stringify(value);

  try{
    localStorage.setItem('mediaflow:' + key, serialized);
    return;
  }catch(e){
    console.error('localStorage set failed', key, e);
  }

  // Fallback for artifact environments where localStorage is unavailable.
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, serialized, false);
    }
  }catch(e){
    console.error('storage set failed', key, e);
  }
}

async function loadAll(){
  const [categories, library, sessions, settings, currentTask, sessionActive] = await Promise.all([
    storageGet('mf_categories', null),
    storageGet('mf_library', []),
    storageGet('mf_sessions', []),
    storageGet('mf_settings', null),
    storageGet('mf_currentTask', null),
    storageGet('mf_sessionActive', false),
  ]);
  S.categories = categories || JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  S.library = library || [];
  S.sessions = sessions || [];
  S.settings = Object.assign({}, DEFAULT_SETTINGS, settings || {});
  S.currentTask = currentTask;
  S.sessionActive = !!sessionActive;
  S.loading = false;
  if(!categories) storageSet('mf_categories', S.categories);
  if(!settings) storageSet('mf_settings', S.settings);
}

function persistCategories(){ storageSet('mf_categories', S.categories); }
function persistLibrary(){ storageSet('mf_library', S.library); }
function persistSessions(){ storageSet('mf_sessions', S.sessions); }
function persistSettings(){ storageSet('mf_settings', S.settings); }
function persistTask(){ storageSet('mf_currentTask', S.currentTask); storageSet('mf_sessionActive', S.sessionActive); }

/* ============================================================
   UTIL
   ============================================================ */
function uid(){ return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  const today = todayISO();
  const yest = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(iso===today) return 'Today';
  if(iso===yest) return 'Yesterday';
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}
function fmtMinutes(m){
  m = Math.round(m);
  if(m < 60) return m+'m';
  const h = Math.floor(m/60), mm = m%60;
  return h+'h '+(mm? mm+'m':'').trim();
}
function getCategory(id){
  return S.categories.find(c=>c.id===id) || {id, name:'(removed category)', icon:'❔', color:'#555', unit:'episodes', target:1, minutesPerUnit:10, weight:1, enabled:false};
}
function unitLabel(unitKey, count){
  const u = UNITS[unitKey] || UNITS.episodes;
  return count===1 ? u.singular : u.label;
}
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function daysSince(ts){ if(!ts) return Infinity; return (Date.now()-ts)/86400000; }
function hoursAgo(h){ return Date.now() - h*3600000; }

function lastSessionFor(catId){
  let best = null;
  for(const s of S.sessions){ if(s.categoryId===catId && (!best || s.timestamp>best.timestamp)) best = s; }
  return best;
}
function minutesSince(catId, hours){
  const cutoff = hoursAgo(hours);
  return S.sessions.filter(s=>s.categoryId===catId && s.timestamp>=cutoff && s.status!=='skipped')
    .reduce((sum,s)=>sum+(s.minutes||0),0);
}
function todaysSessions(){
  const t = todayISO();
  return S.sessions.filter(s=>s.date===t);
}
function sessionsInRange(days){
  const cutoff = hoursAgo(days*24);
  return S.sessions.filter(s=>s.timestamp>=cutoff);
}

/* ============================================================
   SCHEDULER
   ============================================================ */
function recentTaskWindow(n){
  const sorted = [...S.sessions].sort((a,b)=>b.timestamp-a.timestamp);
  return sorted.slice(0,n);
}

function computeScores(excludeIds){
  excludeIds = excludeIds || [];
  const st = S.settings;
  let pool = S.categories.filter(c=>c.enabled && !excludeIds.includes(c.id));
  if(pool.length===0) pool = S.categories.filter(c=>c.enabled);
  const recentWindow = recentTaskWindow(6);
  const lastTask = recentTaskWindow(1)[0];

  // consecutive streak of the most recent category
  let streakCatId = null, streakLen = 0;
  const chron = [...S.sessions].sort((a,b)=>b.timestamp-a.timestamp);
  if(chron.length){
    streakCatId = chron[0].categoryId;
    for(const s of chron){ if(s.categoryId===streakCatId) streakLen++; else break; }
  }

  return pool.map(cat=>{
    const last = lastSessionFor(cat.id);
    const dSince = daysSince(last ? last.timestamp : null);
    const neglectBonus = last ? Math.min(st.neglectCap, dSince*st.neglectRate) : st.neglectCap;

    const occurrences = recentWindow.filter(s=>s.categoryId===cat.id).length;
    const repetitionPenalty = occurrences * st.repetitionPenalty;

    const consecutivePenalty = (streakCatId===cat.id) ? streakLen*st.consecutivePenalty : 0;

    const expectedDailyMinutes = cat.target * cat.minutesPerUnit;
    const min24 = minutesSince(cat.id, 24);
    const satRatio = expectedDailyMinutes>0 ? min24/expectedDailyMinutes : 0;
    const saturationPenalty = satRatio>1 ? Math.min(60,(satRatio-1)*st.saturationWeight) : 0;

    const seasonalBonus = cat.seasonal ? (st.seasonalBonus + st.seasonalFreshCount*4) : 0;

    const weightScore = cat.weight * 8;

    const raw = weightScore + neglectBonus + seasonalBonus - repetitionPenalty - consecutivePenalty - saturationPenalty;
    const floored = Math.max(raw, 1.5);
    const jitter = floored * (Math.random()*st.randomness*2 - st.randomness);
    const final = Math.max(floored + jitter, 0.5);

    const reasons = [];
    if(!last) reasons.push({t:'Never consumed yet', w: st.neglectCap});
    else if(dSince>=1) reasons.push({t:`Neglected for ${Math.floor(dSince)}d`, w: neglectBonus});
    if(cat.seasonal && st.seasonalFreshCount>0) reasons.push({t:`${st.seasonalFreshCount} seasonal title(s) have fresh episodes`, w: seasonalBonus});
    else if(cat.seasonal) reasons.push({t:'Time-sensitive — airing now', w: seasonalBonus});
    if(saturationPenalty>4) reasons.push({t:'Recently overused — cooling off', w:-saturationPenalty});
    if(repetitionPenalty+consecutivePenalty>4) reasons.push({t:'Appeared often in recent tasks', w: -(repetitionPenalty+consecutivePenalty)});
    if(satRatio<0.15 && last) reasons.push({t:'Low recent saturation', w: 6});
    reasons.sort((a,b)=>Math.abs(b.w)-Math.abs(a.w));

    return {cat, score: final, reasons: reasons.slice(0,3), debug:{neglectBonus,repetitionPenalty,consecutivePenalty,saturationPenalty,seasonalBonus,weightScore}};
  });
}

function weightedPick(scored){
  const total = scored.reduce((s,x)=>s+x.score,0);
  let r = Math.random()*total;
  for(const x of scored){
    r -= x.score;
    if(r<=0) return x;
  }
  return scored[scored.length-1];
}

function suggestedAmount(cat){
  const t = cat.target;
  if(t<=2) return {low:t, high:t};
  const low = Math.max(1, Math.round(t*0.7));
  let high = Math.round(t*1.3);
  if(high<=low) high = low+1;
  return {low, high};
}

function generateTask(excludeIds){
  const scored = computeScores(excludeIds);
  if(scored.length===0) return null;
  const pick = weightedPick(scored);
  const {low, high} = suggestedAmount(pick.cat);
  return {
    id: uid(),
    categoryId: pick.cat.id,
    low, high,
    targetMid: Math.round((low+high)/2) || pick.cat.target,
    unit: pick.cat.unit,
    createdAt: Date.now(),
    reasons: pick.reasons.map(r=>r.t),
  };
}

/* ============================================================
   SESSION FLOW
   ============================================================ */
function startSession(){
  S.sessionActive = true;
  if(!S.currentTask) S.currentTask = generateTask([]);
  persistTask(); render();
}
function endSession(){
  S.sessionActive = false; S.currentTask = null; S.logging=false;
  persistTask(); render();
}
function rotateTask(){
  if(!S.currentTask) return;
  const excl = [S.currentTask.categoryId];
  S.currentTask = generateTask(excl);
  S.logging=false;
  persistTask(); render();
}
function skipTask(){
  if(!S.currentTask) return;
  const cat = getCategory(S.currentTask.categoryId);
  const sess = {
    id: uid(), timestamp: Date.now(), date: todayISO(),
    categoryId: cat.id, targetAmount: S.currentTask.targetMid, actualAmount: 0,
    minutes: 0, note: '', status: 'skipped', unit: cat.unit,
  };
  S.sessions.push(sess); persistSessions();
  S.currentTask = generateTask([cat.id]);
  S.logging=false;
  persistTask(); render();
}
function openLogForm(){
  const t = S.currentTask;
  S.logDraft = { amount: t.targetMid, minutes: Math.round(t.targetMid * getCategory(t.categoryId).minutesPerUnit), note:'' };
  S.logging = true; render();
}
function cancelLogForm(){ S.logging=false; render(); }
function submitLog(){
  const t = S.currentTask;
  const cat = getCategory(t.categoryId);
  const amount = clamp(Number(S.logDraft.amount)||0, 0, 999999);
  const minutes = clamp(Number(S.logDraft.minutes)||0, 0, 999999);
  let status = 'complete';
  if(amount<=0) status='skipped';
  else if(amount<t.targetMid) status='partial';
  else if(amount>t.targetMid) status='over';
  const sess = {
    id: uid(), timestamp: Date.now(), date: todayISO(),
    categoryId: cat.id, targetAmount: t.targetMid, actualAmount: amount,
    minutes, note: (S.logDraft.note||'').trim(), status, unit: cat.unit,
  };
  S.sessions.push(sess); persistSessions();
  S.currentTask = generateTask([cat.id]);
  S.logging = false;
  persistTask(); render();
}

/* ============================================================
   DERIVED / STATS HELPERS
   ============================================================ */
function categoryStatus(cat){
  const last = lastSessionFor(cat.id);
  const dSince = daysSince(last?last.timestamp:null);
  const min72 = minutesSince(cat.id,72);
  const expected3d = cat.target*cat.minutesPerUnit*2.2;
  const satRatio = expected3d>0 ? min72/expected3d : 0;
  const todayAmt = todaysSessions().filter(s=>s.categoryId===cat.id && s.status!=='skipped').reduce((a,s)=>a+s.actualAmount,0);
  if(todayAmt>0 && satRatio>=1.6) return 'overused';
  if(dSince>=6) return 'neglected';
  if(dSince>=2.2) return 'due';
  return 'healthy';
}
function saturationLevel(cat){
  const min72 = minutesSince(cat.id,72);
  const baseline = Math.max(cat.target*cat.minutesPerUnit,1)*2.2;
  const ratio = min72/baseline;
  if(ratio<0.25) return {label:'VERY LOW', c:'#5AA9E6'};
  if(ratio<0.7) return {label:'LOW', c:'#3FC7A6'};
  if(ratio<1.4) return {label:'MEDIUM', c:'#E8A94A'};
  if(ratio<2.4) return {label:'HIGH', c:'#F58A5A'};
  return {label:'VERY HIGH', c:'#E8607A'};
}

function totalsForSessions(list){
  const out = {minutes:0, episodes:0, chapters:0, movies:0, issues:0, tasks:0};
  list.forEach(s=>{
    if(s.status==='skipped') return;
    out.minutes += s.minutes||0;
    out.tasks += 1;
    if(out[s.unit]!==undefined) out[s.unit]+=s.actualAmount;
  });
  return out;
}

function computeDayStreak(){
  const days = new Set(S.sessions.filter(s=>s.status!=='skipped').map(s=>s.date));
  let streak=0, cur=new Date();
  while(true){
    const iso = cur.toISOString().slice(0,10);
    if(days.has(iso)){ streak++; cur.setDate(cur.getDate()-1); }
    else break;
  }
  return streak;
}

    let items = S.library.slice().sort((a,b)=>b.priority.localeCompare(a.priority) || a.title.localeCompare(b.title));
    if(catFilter!=='all') items = items.filter(i=>i.categoryId===catFilter);
    if(statusFilter!=='all') items = items.filter(i=>i.status===statusFilter);
    itemsHtml = items.map(i=>{
      const cat = getCategory(i.categoryId);
      const pct = i.total ? clamp(Math.round(i.progress/i.total*100),0,100) : null;
      return `<div class="item-row">
        <div class="bal-icon" style="background:${cat.color}22; color:${cat.color};">${cat.icon}</div>
        <div>
          <div class="item-title">${escapeHtml(i.title)}</div>
          <div class="item-sub">${escapeHtml(cat.name)} ${i.total? '· '+i.progress+' / '+i.total+' '+unitLabel(cat.unit,i.total) : (i.progress? '· '+i.progress+' '+unitLabel(cat.unit,i.progress):'')} ${(i.tags&&i.tags.length)? '· '+i.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join(''):''}</div>
        </div>
        <div class="pill" style="text-transform:capitalize;">${i.status}</div>
        <div class="pill" style="text-transform:capitalize;">${i.priority} priority</div>
        <button class="btn btn-sm btn-ghost" onclick="App.openLibraryModal('${i.id}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="App.deleteLibraryItem('${i.id}')">Delete</button>
      </div>`;
    }).join('') || `<div class="empty-state">No items match this filter.</div>`;
  }

  return `
    <div class="view-head">
      <div><div class="view-title">Library</div><div class="view-desc">Track your titles. The scheduler still only picks the category — this is just for your own progress.</div></div>
      <button class="btn btn-primary" onclick="App.openLibraryModal()">+ Add title</button>
    </div>

    <div class="section-label">OVERVIEW · ${overallPct}% of tracked library cleared</div>
    <div class="card" style="margin-bottom:26px;">${overviewRows}</div>

    <div class="lib-toolbar">
      <div class="section-label" style="margin:0;">TITLES (${S.library.length})</div>
      <div class="lib-filters">
        <select onchange="App.setLibFilter('libCategory', this.value)">
          <option value="all">All categories</option>
          ${cats.map(c=>`<option value="${c.id}" ${S.histFilters.libCategory===c.id?'selected':''}>${c.icon} ${escapeHtml(c.name)}</option>`).join('')}
        </select>
        <select onchange="App.setLibFilter('libStatus', this.value)">
          <option value="all">All statuses</option>
          ${['planned','active','paused','completed','dropped'].map(s=>`<option value="${s}" ${S.histFilters.libStatus===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="card">${itemsHtml}</div>
  `;
}

/* ============================================================
   VIEW: HISTORY
   ============================================================ */
function renderHistory(){
  const f = S.histFilters;
  let list = S.sessions.slice().sort((a,b)=>b.timestamp-a.timestamp);
  if(f.category && f.category!=='all') list = list.filter(s=>s.categoryId===f.category);
  if(f.type && f.type!=='all') list = list.filter(s=>getCategory(s.categoryId).type===f.type);
  if(f.range==='today') list = list.filter(s=>s.date===todayISO());
  else if(f.range==='week') list = list.filter(s=>s.timestamp>=hoursAgo(24*7));
  else if(f.range==='month') list = list.filter(s=>s.timestamp>=hoursAgo(24*30));

  const rows = list.map(s=>{
    const cat = getCategory(s.categoryId);
    const d = new Date(s.timestamp);
    const labelMap = {complete:'Complete', partial:'Partial', over:'Over', skipped:'Skipped'};
    const colorMap = {complete:'healthy', partial:'due', over:'neglect', skipped:'overused'};
    return `<div class="hist-row">
      <div class="hist-date">${fmtDate(s.date)}<br><span style="opacity:.6;">${d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}</span></div>
      <div class="hist-icon" style="background:${cat.color}22; color:${cat.color};">${cat.icon}</div>
      <div class="hist-main">
        <div class="hist-cat">${escapeHtml(cat.name)}</div>
        <div class="hist-amt">${s.actualAmount} ${unitLabel(s.unit,s.actualAmount)} · ${fmtMinutes(s.minutes)} · target ${s.targetAmount}</div>
        ${s.note? `<div class="hist-note">"${escapeHtml(s.note)}"</div>`:''}
      </div>
      <div class="hist-status"><span class="status-badge status-${s.status==='skipped'?'overused':s.status==='partial'?'due':s.status==='over'?'neglected':'healthy'}">${labelMap[s.status]}</span></div>
    </div>`;
  }).join('') || `<div class="empty-state"><div class="em-icon">🕓</div><div class="em-title">No sessions yet</div><div>Complete a task from the dashboard to see it here.</div></div>`;

  return `
    <div class="view-head">
      <div><div class="view-title">History</div><div class="view-desc">Every logged task, in one place.</div></div>
    </div>
    <div class="lib-toolbar">
      <div class="lib-filters">
        <select onchange="App.setHistFilter('category', this.value)">
          <option value="all">All categories</option>
          ${S.categories.map(c=>`<option value="${c.id}" ${f.category===c.id?'selected':''}>${c.icon} ${escapeHtml(c.name)}</option>`).join('')}
        </select>
        <select onchange="App.setHistFilter('type', this.value)">
          <option value="all">All media types</option>
          <option value="video" ${f.type==='video'?'selected':''}>Video</option>
          <option value="reading" ${f.type==='reading'?'selected':''}>Reading</option>
        </select>
        <select onchange="App.setHistFilter('range', this.value)">
          <option value="all" ${f.range==='all'?'selected':''}>All time</option>
          <option value="today" ${f.range==='today'?'selected':''}>Today</option>
          <option value="week" ${f.range==='week'?'selected':''}>This week</option>
          <option value="month" ${f.range==='month'?'selected':''}>This month</option>
        </select>
      </div>
      <button class="btn btn-sm" onclick="App.exportCSV()">Export CSV</button>
    </div>
    <div class="card">${rows}</div>
  `;
}

/* ============================================================
   VIEW: STATS
   ============================================================ */
function renderStats(){
  const today = totalsForSessions(todaysSessions());
  const week = totalsForSessions(sessionsInRange(7));
  const month = totalsForSessions(sessionsInRange(30));
  const lifetime = totalsForSessions(S.sessions);

  const cats = S.categories.filter(c=>c.enabled);
  const weekMinutesByCat = cats.map(c=>({c, m: sessionsInRange(7).filter(s=>s.categoryId===c.id && s.status!=='skipped').reduce((a,s)=>a+s.minutes,0)}));
  const maxW = Math.max(1, ...weekMinutesByCat.map(x=>x.m));

  const balanceHtml = weekMinutesByCat.map(({c,m})=>`
    <div class="bal-bar-row">
      <div class="bal-bar-label">${c.icon} ${escapeHtml(c.name)}</div>
      <div class="bal-bar-track"><div class="bal-bar-fill" style="width:${Math.round(m/maxW*100)}%; background:${c.color};"></div></div>
      <div class="bal-bar-val">${fmtMinutes(m)}</div>
    </div>`).join('');

  const satHtml = cats.map(c=>{
    const lvl = saturationLevel(c);
    return `<div class="sat-row">
      <div class="sat-cat">${c.icon} ${escapeHtml(c.name)}</div>
      <div class="sat-lvl" style="color:${lvl.c}; background:${lvl.c}20;">${lvl.label}</div>
    </div>`;
  }).join('');

  // records
  const lifetimeByCat = cats.map(c=>({c, m: S.sessions.filter(s=>s.categoryId===c.id && s.status!=='skipped').reduce((a,s)=>a+s.minutes,0)}));
  lifetimeByCat.sort((a,b)=>b.m-a.m);
  const most = lifetimeByCat[0];
  const least = lifetimeByCat[lifetimeByCat.length-1];

  const neglect = cats.map(c=>{
    const last = lastSessionFor(c.id);
    return {c, d: daysSince(last?last.timestamp:null)};
  }).sort((a,b)=>b.d-a.d)[0];

  // current streak
  const chron = [...S.sessions].filter(s=>s.status!=='skipped').sort((a,b)=>b.timestamp-a.timestamp);
  let curStreakCat=null, curStreakLen=0;
  if(chron.length){ curStreakCat=chron[0].categoryId; for(const s of chron){ if(s.categoryId===curStreakCat) curStreakLen++; else break; } }

  // longest streak ever
  const chronAsc = [...S.sessions].filter(s=>s.status!=='skipped').sort((a,b)=>a.timestamp-b.timestamp);
  let longest={cat:null,len:0}, run={cat:null,len:0};
  for(const s of chronAsc){
    if(s.categoryId===run.cat) run.len++;
    else run={cat:s.categoryId, len:1};
    if(run.len>longest.len) longest={cat:run.cat, len:run.len};
  }

  const distinctDays = new Set(S.sessions.filter(s=>s.status!=='skipped').map(s=>s.date)).size || 1;
  const avgDailyMinutes = Math.round(lifetime.minutes/distinctDays);
  const nonSkipped = S.sessions.filter(s=>s.status!=='skipped').length;
  const completedOrOver = S.sessions.filter(s=>s.status==='complete'||s.status==='over').length;
  const avgCompletion = nonSkipped>0 ? Math.round(completedOrOver/nonSkipped*100) : 0;

  return `
    <div class="view-head"><div><div class="view-title">Statistics</div><div class="view-desc">Your consumption, measured.</div></div></div>

    <div class="grid-3" style="margin-bottom:24px;">
      ${statCard('Today', today)}
      ${statCard('This week', week)}
      ${statCard('This month', month)}
    </div>

    <div class="two-col" style="margin-bottom:24px;">
      <div class="card">
        <div class="section-label">CATEGORY BALANCE — LAST 7 DAYS</div>
        ${balanceHtml || '<div class="empty-state">No data yet.</div>'}
      </div>
      <div class="card">
        <div class="section-label">RECENT SATURATION</div>
        <div class="sat-grid">${satHtml || '<div class="empty-state">No categories enabled.</div>'}</div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">RECORDS</div>
      <div class="record-list">
        <div class="record-row"><span class="k">Most consumed category</span><span class="v">${most? most.c.icon+' '+escapeHtml(most.c.name)+' — '+fmtMinutes(most.m) : '—'}</span></div>
        <div class="record-row"><span class="k">Least consumed category</span><span class="v">${least? least.c.icon+' '+escapeHtml(least.c.name)+' — '+fmtMinutes(least.m) : '—'}</span></div>
        <div class="record-row"><span class="k">Current category streak</span><span class="v">${curStreakCat? getCategory(curStreakCat).icon+' '+getCategory(curStreakCat).name+' × '+curStreakLen : '—'}</span></div>
        <div class="record-row"><span class="k">Longest streak ever</span><span class="v">${longest.cat? getCategory(longest.cat).icon+' '+getCategory(longest.cat).name+' × '+longest.len : '—'}</span></div>
        <div class="record-row"><span class="k">Most neglected category</span><span class="v">${neglect && isFinite(neglect.d)? neglect.c.icon+' '+neglect.c.name+' — '+Math.floor(neglect.d)+'d' : (neglect? neglect.c.icon+' '+neglect.c.name+' — never':'—')}</span></div>
        <div class="record-row"><span class="k">Average daily consumption</span><span class="v">${fmtMinutes(avgDailyMinutes)}</span></div>
        <div class="record-row"><span class="k">Average task completion rate</span><span class="v">${avgCompletion}%</span></div>
        <div class="record-row"><span class="k">Total lifetime</span><span class="v">${fmtMinutes(lifetime.minutes)} · ${lifetime.episodes} ep · ${lifetime.chapters} ch · ${lifetime.movies} mv · ${lifetime.issues} is</span></div>
      </div>
    </div>
  `;
}
function statCard(label, t){
  return `<div class="stat-box">
    <div class="lbl" style="margin-bottom:8px;">${label}</div>
    <div class="num" style="font-size:20px;">${fmtMinutes(t.minutes)}</div>
    <div style="font-size:12px; color:var(--text-dim); margin-top:6px; line-height:1.7;">

}

/* ============================================================
   APP — public actions (bound to window)
   ============================================================ */
const App = {
  setView(v){ S.view=v; render(); },
  startSession, endSession, rotateTask, skipTask, openLogForm, cancelLogForm, submitLog,
  toggleReasonDetail(){ S.showReasonDetail=!S.showReasonDetail; render(); },
  updateLogDraft(k,v){ S.logDraft[k]=v; },

  setHistFilter(k,v){ S.histFilters[k]=v; render(); },
  setLibFilter(k,v){ S.histFilters[k]=v; render(); },

  setIntensity(k){
    const p = INTENSITY_PRESETS[k];
    S.settings.intensity=k; S.settings.tasksPerDay=p.tasksPerDay; S.settings.dailyMinutes=p.dailyMinutes;
    persistSettings(); render();
  },
  updateSetting(key, val){
    const num = Number(val);
    S.settings[key] = isNaN(num) ? val : num;
    persistSettings(); render();
  },

  toggleCategory(id){
    const c = S.categories.find(c=>c.id===id); if(!c) return;
    c.enabled = !c.enabled; persistCategories(); render();
  },
  openCategoryModal(id){
    const data = id ? Object.assign({}, getCategory(id)) : {name:'', icon:'✨', type:'video', unit:'episodes', target:5, weight:3, minutesPerUnit:20, color:COLOR_CHOICES[0], enabled:true, seasonal:false};
    S.modal = {type:'category', data}; render();
  },
  pickIcon(ic){ document.getElementById('m-icon').value = ic; S.modal.data.icon = ic; renderModal(); },
  pickColor(c){ document.getElementById('m-color').value = c; S.modal.data.color = c; renderModal(); },
  saveCategoryModal(id){
    const data = {
      id: id || uid(),
      name: document.getElementById('m-name').value.trim() || 'Untitled category',
      icon: document.getElementById('m-icon').value || '✨',
      type: document.getElementById('m-type').value,
      unit: document.getElementById('m-unit').value,
      target: Math.max(1, Number(document.getElementById('m-target').value)||1),
      weight: clamp(Number(document.getElementById('m-weight').value)||3,1,5),
      minutesPerUnit: Math.max(1, Number(document.getElementById('m-mpu').value)||20),
      seasonal: document.getElementById('m-seasonal').checked,
      color: document.getElementById('m-color').value,
      enabled: document.getElementById('m-enabled').checked,
      custom: true,
    };
    const idx = S.categories.findIndex(c=>c.id===id);
    if(idx>=0) S.categories[idx] = Object.assign({}, S.categories[idx], data);
    else S.categories.push(data);
    persistCategories(); S.modal=null; render();
  },
  deleteCategory(id){
    if(!confirm('Delete this category? Past history stays but will show as removed.')) return;
    S.categories = S.categories.filter(c=>c.id!==id);
    persistCategories(); render();
  },

  openLibraryModal(id){
    const data = id ? Object.assign({}, S.library.find(i=>i.id===id)) : {categoryId:S.categories[0]?.id, progress:0, status:'planned', priority:'medium', tags:[]};
    S.modal = {type:'library', data}; render();
  },
  saveLibraryModal(id){
    const tagsRaw = document.getElementById('l-tags').value;
    const data = {
      id: id || uid(),
      title: document.getElementById('l-title').value.trim() || 'Untitled',
      categoryId: document.getElementById('l-category').value,
      progress: Math.max(0, Number(document.getElementById('l-progress').value)||0),
      total: document.getElementById('l-total').value ? Math.max(0, Number(document.getElementById('l-total').value)) : null,
      status: document.getElementById('l-status').value,
      priority: document.getElementById('l-priority').value,
      estimatedMinutes: document.getElementById('l-est').value ? Number(document.getElementById('l-est').value) : null,
      tags: tagsRaw.split(',').map(t=>t.trim()).filter(Boolean),
    };
    const idx = S.library.findIndex(i=>i.id===id);
    if(idx>=0) S.library[idx] = data; else S.library.push(data);
    persistLibrary(); S.modal=null; render();
  },
  deleteLibraryItem(id){
    if(!confirm('Delete this title from your library?')) return;
    S.library = S.library.filter(i=>i.id!==id);
    persistLibrary(); render();
  },
  closeModal(){ S.modal=null; render(); },

  exportJSON(){
    const blob = new Blob([JSON.stringify({categories:S.categories, library:S.library, sessions:S.sessions, settings:S.settings, exportedAt:new Date().toISOString()}, null, 2)], {type:'application/json'});
    triggerDownload(blob, `mediaflow-backup-${todayISO()}.json`);
  },
  importJSON(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!confirm('This will replace your current MediaFlow data with the imported backup. Continue?')) return;
        if(data.categories) S.categories = data.categories;
        if(data.library) S.library = data.library;
        if(data.sessions) S.sessions = data.sessions;
        if(data.settings) S.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings);
        persistCategories(); persistLibrary(); persistSessions(); persistSettings();
        render();
      }catch(e){ alert('Could not read that file — is it a valid MediaFlow JSON backup?'); }
    };
    reader.readAsText(file);
  },
  exportCSV(){
    const header = ['date','time','category','target','actual','unit','minutes','status','note'];
    const rows = S.sessions.slice().sort((a,b)=>a.timestamp-b.timestamp).map(s=>{
      const cat = getCategory(s.categoryId);
      const d = new Date(s.timestamp);
      return [s.date, d.toLocaleTimeString(), cat.name, s.targetAmount, s.actualAmount, s.unit, s.minutes, s.status, (s.note||'').replace(/,/g,';')];
    });
    const csv = [header.join(','), ...rows.map(r=>r.join(','))].join('\\n');
    triggerDownload(new Blob([csv],{type:'text/csv'}), `mediaflow-history-${todayISO()}.csv`);
  },
  resetAll(){
    if(!confirm('This deletes ALL MediaFlow data — categories, library, history, settings. This cannot be undone. Continue?')) return;
    S.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
    S.library = []; S.sessions = []; S.settings = Object.assign({}, DEFAULT_SETTINGS);
    S.currentTask = null; S.sessionActive = false;
    persistCategories(); persistLibrary(); persistSessions(); persistSettings(); persistTask();
    render();
  },
};
window.App = App;

function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
}

/* ============================================================
   RENDER LOOP + INIT
   ============================================================ */
function render(){
  if(!document.querySelector('.sidebar')) { renderShell(); return; }
  // update sidebar active states + streak without full rebuild for smoothness
  document.querySelectorAll('.nav-item').forEach((el,i)=>el.classList.toggle('active', NAV_ITEMS[i].id===S.view));
  document.querySelectorAll('.mtab').forEach((el,i)=>el.classList.toggle('active', NAV_ITEMS[i].id===S.view));
  renderView();
  renderModal();
}

async function init(){
  await loadAll();
  renderShell();
}
init();

})();
</script>
</body>
</html>
