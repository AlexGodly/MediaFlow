<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>MediaFlow by Alex Godly</title>

<meta name="theme-color" content="#0E111A">

<style>

:root{

  --bg:#0E111A;

  --panel:#161B29;

  --panel-raised:#1D2436;

  --border:#2A3149;

  --border-soft:#232A40;

  --text:#EDEFF6;

  --text-dim:#9AA3BC;

  --text-mute:#6A7290;

  --flow:#E8A94A;

  --flow-dim:#8a6a35;

  --healthy:#3FC7A6;

  --neglect:#9C8CF5;

  --overused:#E8607A;

  --due:#5AA9E6;

  --radius-s:6px;

  --radius-m:12px;

  --radius-l:20px;

  --font-display:'Fraunces', Georgia, serif;

  --font-body:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

}

*{box-sizing:border-box;}
html[data-theme="light"]{--bg:#F5F6F8;--panel:#FFFFFF;--panel-raised:#EEF1F5;--border:#D7DCE5;--border-soft:#E4E7ED;--text:#171A21;--text-dim:#596274;--text-mute:#7B8496;}
html[data-theme="light"] body{background:radial-gradient(ellipse 1200px 800px at 10% -10%, #FFFFFF 0%, var(--bg) 60%);}
html[data-theme="light"] .sidebar{background:linear-gradient(180deg,#FFFFFF 0%,#F3F5F8 100%);}
html[data-theme="amoled"]{--bg:#000000;--panel:#050505;--panel-raised:#0A0A0A;--border:#202020;--border-soft:#151515;--text:#F5F5F5;--text-dim:#A0A0A0;--text-mute:#666;--flow:#E8A94A;}
html[data-theme="amoled"] body{background:#000;}
html[data-theme="amoled"] .sidebar{background:#000;}
.stopwatch-card{margin-top:22px;}
.stopwatch-display{font-family:var(--font-display);font-size:42px;letter-spacing:.04em;text-align:center;margin:8px 0 16px;}
.stopwatch-custom{display:flex;gap:8px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:0 auto 14px;}
.stopwatch-time-field{width:78px;}
.stopwatch-time-field label{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--text-dim);margin:0 0 5px;text-align:center;}
.stopwatch-time-field input{text-align:center;width:100%;box-sizing:border-box;}
.stopwatch-custom-note{text-align:center;margin:-4px 0 12px;}
.chart-wrap{overflow:auto;}
.chart-svg{width:100%;min-width:560px;height:220px;display:block;}
.chart-bar{transition:opacity .15s;} .chart-bar:hover{opacity:.78;}
.profile-stat-hero{display:flex;align-items:center;gap:20px;padding:24px;border-radius:var(--radius-l);background:linear-gradient(135deg,var(--panel-raised),var(--panel));border:1px solid var(--border-soft);margin-bottom:24px;}
.profile-stat-avatar{width:104px;height:104px;border-radius:50%;overflow:hidden;border:2px solid var(--flow);display:grid;place-items:center;font-size:32px;font-weight:800;background:var(--panel);flex-shrink:0;}
.profile-stat-avatar img{width:100%;height:100%;object-fit:cover;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:16px;}
.filter-row .field{min-width:150px;flex:1;}
.priority-choice{width:100%;display:flex;align-items:center;gap:11px;padding:12px 13px;border:1px solid var(--border-soft);background:var(--panel-raised);border-radius:11px;color:var(--text);cursor:pointer;text-align:left;transition:border-color .12s ease,background .12s ease,transform .12s ease;} .priority-choice:hover{border-color:var(--flow);transform:translateY(-1px);} .priority-choice.selected{border-color:var(--flow);background:color-mix(in srgb,var(--flow) 10%,var(--panel-raised));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--flow) 22%,transparent);} .priority-choice-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--panel);font-weight:900;color:var(--flow);font-size:15px;line-height:1;} .priority-choice small{display:block;color:var(--text-mute);font-size:11px;line-height:1.35;margin-top:2px;} .priority-choice-check{width:20px;text-align:center;color:var(--flow);font-weight:900;} .priority-click{cursor:pointer;transition:transform .12s,background .12s;} .priority-click:hover{transform:translateY(-1px);background:var(--panel-raised)!important;}
.status-click,.category-click{cursor:pointer;transition:transform .12s,background .12s,border-color .12s;} .status-click:hover,.category-click:hover{transform:translateY(-1px);background:var(--panel-raised)!important;border-color:var(--flow)!important;} .choice-list{display:grid;gap:8px;max-height:52vh;overflow:auto;padding-right:2px}.status-choice,.category-choice{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--border-soft);background:var(--panel-raised);border-radius:11px;color:var(--text);cursor:pointer;text-align:left;transition:border-color .12s ease,background .12s ease,transform .12s ease}.status-choice:hover,.category-choice:hover{border-color:var(--flow);transform:translateY(-1px)}.status-choice.selected,.category-choice.selected{border-color:var(--flow);background:color-mix(in srgb,var(--flow) 10%,var(--panel-raised));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--flow) 22%,transparent)} .choice-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--panel);font-weight:900}.choice-check{width:20px;text-align:center;color:var(--flow);font-weight:900}.stats-level-card{position:relative;overflow:hidden}.stats-level-card:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--flow-dim),var(--flow));opacity:.9}.stats-level-meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:9px;font-size:11px;color:var(--text-dim)}.stats-level-percent{font-family:var(--font-display);font-weight:700;color:var(--flow)}.stats-level-track{height:8px;background:var(--border);border:1px solid var(--border-soft);border-radius:99px;overflow:hidden;margin-top:9px;box-shadow:inset 0 1px 2px rgba(0,0,0,.16)}.stats-level-fill{height:100%;background:linear-gradient(90deg,var(--flow-dim),var(--flow));border-radius:99px;min-width:0;transition:width .35s ease}.stats-level-caption{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:10px;color:var(--text-mute)}
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#3FC7A622;color:var(--healthy);border:1px solid #3FC7A644;}
@media(max-width:860px){.profile-stat-hero{align-items:flex-start}.chart-svg{min-width:480px}.sidebar-resizer{display:none;}}


html,body{margin:0;padding:0;}

body{

  background:radial-gradient(ellipse 1200px 800px at 10% -10%, #1A2036 0%, var(--bg) 55%);

  color:var(--text);

  font-family:var(--font-body);

  min-height:100vh;

  -webkit-font-smoothing:antialiased;

}

::selection{background:var(--flow); color:#1a1200;}

a{color:inherit;}

button{font-family:inherit;}

input,select,textarea{font-family:inherit;}

::-webkit-scrollbar{width:10px;height:10px;}

::-webkit-scrollbar-thumb{background:#2a3149;border-radius:8px;}

::-webkit-scrollbar-track{background:transparent;}

#app{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */

.sidebar{

  width:var(--sidebar-width,236px); flex-shrink:0;

  background:linear-gradient(180deg, #131826 0%, #10131F 100%);

  border-right:1px solid var(--border-soft);

  display:flex; flex-direction:column;

  padding:26px 16px;

  position:sticky; top:0; height:100vh;

}

.brand{display:flex; align-items:center; gap:10px; padding:0 8px 26px 8px;}

.brand-mark{

  width:34px; height:34px; border-radius:10px;

  background:conic-gradient(from 220deg, var(--flow), var(--healthy), var(--neglect), var(--flow));

  flex-shrink:0;

}

.brand-name{font-family:var(--font-display); font-size:19px; font-weight:600; letter-spacing:0.2px;}

.brand-sub{font-size:11px; color:var(--text-mute); margin-top:1px;}

.nav{display:flex; flex-direction:column; gap:2px; margin-top:8px;}

.nav-item{

  display:flex; align-items:center; gap:11px;

  padding:10px 12px; border-radius:var(--radius-s);

  color:var(--text-dim); cursor:pointer; font-size:14px; font-weight:600;

  border:1px solid transparent; transition:background .15s, color .15s;

  user-select:none;

}

.nav-item svg{width:17px; height:17px; opacity:.85; flex-shrink:0;}

.nav-item:hover{background:var(--panel); color:var(--text);}

.nav-item.active{background:var(--panel-raised); color:var(--text); border-color:var(--border-soft);}

.nav-item.active svg{opacity:1; color:var(--flow);}

.sidebar-foot{margin-top:auto; padding:14px 10px; border-top:1px solid var(--border-soft);}

.sidebar-foot .k{font-size:11px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.06em;}

.sidebar-foot .v{font-family:var(--font-display); font-size:22px; margin-top:2px;}.stats-level-progress-track{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:0;flex:1;min-width:260px;max-width:520px;} .stats-level-progress-fill{height:100%;background:linear-gradient(90deg,var(--flow-dim),var(--flow));border-radius:99px;transition:width .3s ease;} .sidebar-foot .level-block{margin-top:14px;padding:11px 10px;border:1px solid var(--border-soft);background:var(--panel);border-radius:12px;} .sidebar-foot .level-head{display:flex;align-items:center;justify-content:space-between;gap:8px;} .sidebar-foot .level-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-mute);} .sidebar-foot .level-num{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--flow);} .sidebar-foot .xp-line{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--text-dim);margin-top:3px;} .sidebar-foot .xp-track{height:5px;margin-top:8px;background:var(--border);border-radius:99px;overflow:hidden;} .sidebar-foot .xp-fill{height:100%;background:linear-gradient(90deg,var(--flow-dim),var(--flow));border-radius:99px;transition:width .3s ease;} .sidebar-foot .level-next{font-size:10px;color:var(--text-mute);margin-top:6px;}
.sidebar-resizer{position:absolute;top:0;right:-7px;width:14px;height:100%;cursor:col-resize;z-index:100;touch-action:none;user-select:none;-webkit-user-select:none;background:transparent;}
.sidebar-resizer::after{content:'';position:absolute;top:0;bottom:0;left:6px;width:2px;background:transparent;transition:background .15s;}
.sidebar:hover .sidebar-resizer::after,.sidebar-resizer:focus-visible::after{background:var(--flow);}
body.sidebar-resizing{cursor:col-resize;user-select:none;}
body.sidebar-resizing *{cursor:col-resize !important;user-select:none !important;-webkit-user-select:none !important;}
body.sidebar-resizing{overflow:hidden;}
.account-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border);background:var(--panel);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--text-dim);}
.account-avatar-btn{border:0;padding:0;background:transparent;cursor:pointer;border-radius:50%;display:grid;place-items:center;flex-shrink:0;}
.account-avatar-btn:focus-visible{outline:2px solid var(--flow);outline-offset:2px;}
.account-profile-btn{border:0;background:transparent;color:var(--text-dim);padding:0;min-width:0;flex:1;text-align:left;cursor:pointer;font:inherit;}
.account-profile-btn:hover .account-menu-email{color:var(--text);}
.profile-avatar-wrap{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.profile-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:1px solid var(--border);background:var(--panel-raised);display:grid;place-items:center;font-size:25px;font-weight:800;color:var(--text-dim);overflow:hidden;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-avatar-actions{display:flex;gap:8px;flex-wrap:wrap;}
.profile-note{font-size:11.5px;color:var(--text-mute);line-height:1.55;margin-top:7px;}
.profile-card{max-width:720px;}
.profile-section{margin-bottom:22px;}

/* ---------- Main ---------- */

.main{flex:1; min-width:0; padding:32px 40px 90px 40px;}

.view-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}

.view-title{font-family:var(--font-display); font-size:28px; font-weight:600;}

.view-desc{color:var(--text-dim); font-size:13.5px; margin-top:4px;}

.container{max-width:1080px;}

/* ---------- Cards / primitives ---------- */

.card{

  background:var(--panel); border:1px solid var(--border-soft);

  border-radius:var(--radius-m); padding:20px;

}

.hairline{border-top:1px solid var(--border-soft);}

.settings-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.settings-section-head .btn{font-size:10px;padding:5px 8px}.section-label{font-size:12px; font-weight:700; color:var(--text-mute); letter-spacing:.04em; margin-bottom:10px;}

.btn{

  display:inline-flex; align-items:center; justify-content:center; gap:7px;

  padding:10px 18px; border-radius:9px; font-size:14px; font-weight:700;

  border:1px solid var(--border); background:var(--panel-raised); color:var(--text);

  cursor:pointer; transition:transform .1s ease, background .15s, border-color .15s;

}

.btn:hover{border-color:#3b4568;}

.btn:active{transform:scale(.97);}

.btn-primary{background:var(--flow); color:#1c1305; border-color:var(--flow);}

.btn-primary:hover{background:#f0b65c;}

.btn-ghost{background:transparent; border-color:transparent; color:var(--text-dim);}

.btn-ghost:hover{color:var(--text); background:var(--panel);}

.btn-danger{background:transparent; border-color:var(--overused); color:var(--overused);}

.btn-danger:hover{background:rgba(232,96,122,.1);}

.btn-sm{padding:7px 12px; font-size:12.5px;}

.btn-block{width:100%;}

.btn:disabled{opacity:.4; cursor:not-allowed;}

.pill{

  display:inline-flex; align-items:center; gap:5px;

  padding:4px 10px; border-radius:99px; font-size:11.5px; font-weight:700;

  background:var(--panel-raised); border:1px solid var(--border-soft); color:var(--text-dim);

}

.dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}

input[type=text],input[type=number],select,textarea{

  width:100%; background:#12172480; background:#10141F; border:1px solid var(--border);

  color:var(--text); padding:9px 11px; border-radius:8px; font-size:14px; outline:none;

}

input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--flow-dim);}

label.field-label{display:block; font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px;}

.field{margin-bottom:14px;}

.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

input[type=range]{-webkit-appearance:none; width:100%; height:4px; background:var(--border); border-radius:3px; outline:none;}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--flow); cursor:pointer; margin-top:-6px;}

input[type=checkbox]{width:16px; height:16px; accent-color:var(--flow);}

.progress-track{height:8px; background:#10141F; border:1px solid var(--border-soft); border-radius:99px; overflow:hidden;}

.progress-fill{height:100%; border-radius:99px; background:linear-gradient(90deg, var(--flow-dim), var(--flow)); transition:width .4s ease;}

/* ---------- Dashboard ---------- */

.today-strip{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:22px;}

.stat-box{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:16px 18px;}

.stat-box .num{font-family:var(--font-display); font-size:26px; font-weight:600;}

.stat-box .lbl{font-size:12px; color:var(--text-mute); margin-top:2px;}

.stat-box .progress-track{margin-top:10px;}

.hero{

  position:relative; border-radius:var(--radius-l); padding:30px 34px;

  background:linear-gradient(155deg, #1B1F30 0%, #171B29 60%);

  border:1px solid var(--border-soft); overflow:hidden; margin-bottom:26px;

}

.hero::before{

  content:''; position:absolute; top:-60px; right:-60px; width:260px; height:260px; border-radius:50%;

  background:radial-gradient(circle, rgba(232,169,74,.16), transparent 70%);

}

.hero-eyebrow{font-size:12px; color:var(--text-mute); font-weight:700; letter-spacing:.03em;}

.hero-cat{display:flex; align-items:center; gap:14px; margin-top:10px;}

.hero-icon{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0;}

.hero-name{font-family:var(--font-display); font-size:32px; font-weight:600;}

.hero-amount{font-size:16px; color:var(--text-dim); margin-top:10px;}

.hero-amount b{color:var(--text); font-weight:700;}

.hero-note{font-size:13px; color:var(--text-mute); margin-top:4px; font-style:italic;}

.hero-reasons{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; position:relative; z-index:1;}

.hero-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; position:relative; z-index:1;}

.log-form{margin-top:18px; padding-top:18px; border-top:1px dashed var(--border);}

.balance-list{display:flex; flex-direction:column;}

.balance-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border-soft);}

.balance-row:last-child{border-bottom:none;}

.bal-icon{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}

.bal-name{font-size:14px; font-weight:600; flex-shrink:0; width:150px;}

.bal-amt{font-size:13px; color:var(--text-dim); flex:1;}

.status-badge{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:99px; flex-shrink:0;}

.status-healthy{color:var(--healthy); background:rgba(63,199,166,.12);}

.status-neglected{color:var(--neglect); background:rgba(156,140,245,.14);}

.status-overused{color:var(--overused); background:rgba(232,96,122,.13);}

.status-due{color:var(--due); background:rgba(90,169,230,.13);}

/* ---------- Grid layouts ---------- */

.two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start;}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}

.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}

/* ---------- Library ---------- */

.overview-row{display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--border-soft);}

.overview-row:last-child{border-bottom:none;}

.ov-name{width:170px; font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px; flex-shrink:0;}

.ov-track{flex:1;}

.ov-num{width:130px; text-align:right; font-size:12.5px; color:var(--text-dim); flex-shrink:0;}

.lib-toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; justify-content:space-between;}

.lib-filters{display:flex; gap:8px; flex-wrap:wrap;}

.lib-filters select{width:auto; padding:8px 10px; font-size:13px;}
.lib-search{min-width:220px; flex:1 1 220px;}
.lib-pagination{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin:14px 0 0;}
.lib-pagination .page-num{min-width:36px;}
.lib-pagination .page-current{border-color:var(--flow); background:rgba(232,169,74,.10); color:var(--text);}

.item-row{display:grid; grid-template-columns:auto 1fr auto auto auto auto; gap:14px; align-items:center; padding:13px 6px; border-bottom:1px solid var(--border-soft);}

.item-row:hover{background:var(--panel-raised);}

.item-title{font-weight:700; font-size:14px;}

.item-sub{font-size:12px; color:var(--text-mute); margin-top:2px;}

.tag{font-size:10.5px; background:var(--panel-raised); border:1px solid var(--border-soft); color:var(--text-mute); padding:2px 7px; border-radius:6px; margin-right:4px;}

.empty-state{padding:60px 20px; text-align:center; color:var(--text-mute);}

.empty-state .em-icon{font-size:38px; margin-bottom:10px;}

.empty-state .em-title{font-family:var(--font-display); font-size:19px; color:var(--text); margin-bottom:6px;}

/* ---------- History ---------- */

.hist-row{display:flex; align-items:flex-start; gap:14px; padding:15px 4px; border-bottom:1px solid var(--border-soft);}

.hist-date{width:96px; flex-shrink:0; font-size:12px; color:var(--text-mute); padding-top:3px;}

.hist-icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}

.hist-main{flex:1; min-width:0;}

.hist-cat{font-weight:700; font-size:14px;}

.hist-amt{font-size:13px; color:var(--text-dim); margin-top:2px;}

.hist-note{font-size:12.5px; color:var(--text-mute); margin-top:4px; font-style:italic;}

.hist-status{flex-shrink:0;}

/* ---------- Stats ---------- */

.bal-bar-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}

.bal-bar-label{width:150px; font-size:13px; font-weight:600; flex-shrink:0; display:flex; align-items:center; gap:7px;}

.bal-bar-track{flex:1; height:14px; background:#10141F; border:1px solid var(--border-soft); border-radius:6px; overflow:hidden;}

.bal-bar-fill{height:100%; border-radius:5px;}

.bal-bar-val{width:70px; text-align:right; font-size:12px; color:var(--text-dim); flex-shrink:0;}

.sat-grid{display:flex; flex-direction:column; gap:10px;}

async function encodeCloudState(value){
  // Large MediaFlow histories can make the single JSONB row expensive to update.
  // Compress the state in browsers that support CompressionStream before sending it.
  const json=JSON.stringify(value);
  try{
    if(typeof CompressionStream==='function' && typeof TextEncoder!=='undefined'){
      const cs=new CompressionStream('gzip');
      const writer=cs.writable.getWriter();
      writer.write(new TextEncoder().encode(json));
      writer.close();
      const buf=await new Response(cs.readable).arrayBuffer();
      let binary='';
      const bytes=new Uint8Array(buf);
      const chunk=0x8000;
      for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
      return {__mediaflowCompressed:'gzip',data:btoa(binary)};
    }
  }catch(e){
    console.warn('MediaFlow: compression unavailable, saving normally.',e);
  }
  return value;
}

async function decodeCloudState(value){
  if(!value || value.__mediaflowCompressed!=='gzip') return value;
  try{
    if(typeof DecompressionStream!=='function' || typeof TextDecoder==='undefined') throw new Error('DecompressionStream unavailable');
    const binary=atob(value.data||'');
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const ds=new DecompressionStream('gzip');
    const writer=ds.writable.getWriter();
    writer.write(bytes);
    writer.close();
    const text=await new Response(ds.readable).text();
    return JSON.parse(text);
  }catch(e){
    throw new Error('MediaFlow cloud data could not be decompressed. Try another Chromium-based browser or restore from a JSON backup.');
  }
}

async function rawGet(key){

  const {data,error}=await supabase.from('mediaflow_states').select('state_data').eq('user_id',AUTH_USER.id).maybeSingle();

async function rawSet(key,value){
  if(!AUTH_USER||!supabase)throw new Error('MediaFlow cloud session is unavailable.');
  const payload=await encodeCloudState(value);
  // Keep a local copy as a safety net while the cloud write is in flight.
  try{ localSetRaw(CLOUD_CACHE_KEY,value); }catch(_){}

  let lastError=null;
  const delays=[0,450,1000,2000,4000];
  for(let attempt=0;attempt<delays.length;attempt++){
    if(delays[attempt]) await new Promise(r=>setTimeout(r,delays[attempt]));
    try{
      const {error}=await supabase.from('mediaflow_states').upsert({user_id:AUTH_USER.id,state_data:payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});
      if(!error) return true;
      lastError=error;
      const code=String(error?.code||'');
      if(code!=='57014' && !/timeout|canceling statement/i.test(String(error?.message||''))) throw error;
      if(attempt<delays.length-1) console.warn(`MediaFlow: cloud save timed out, retrying (${attempt+1}/${delays.length-1})...`);
    }catch(e){
      lastError=e;
      const code=String(e?.code||'');
      const timeout=code==='57014' || /timeout|canceling statement/i.test(String(e?.message||''));
      if(!timeout || attempt===delays.length-1) throw e;
      console.warn(`MediaFlow: cloud save timed out, retrying (${attempt+1}/${delays.length-1})...`);
    }
  }
  throw lastError||new Error('MediaFlow cloud save failed.');
}

// Serialize saves so two rapid actions never race each other; always await the tail.

function saveState(){
  // Serialize saves so concurrent UI actions cannot overwrite each other.
  // Each queued save snapshots only when its turn begins, so a burst of actions
  // always ends with the newest state rather than a pile of stale uploads.
  saveQueue = saveQueue.then(async ()=>{
    try{
      await rawSet(STATE_KEY, snapshot());
      if(lastSaveFailed){ lastSaveFailed=false; hideSaveError(); }
    }catch(e){
      console.error('MediaFlow: save failed', e);
      lastSaveFailed = true; showSaveError();
    }
  });
  return saveQueue;
}

function sanitizeLibrary(list){
  const out=[];

  for(const raw of (Array.isArray(list)?list:[])){

    const title=cleanTitle(raw.title);
    if(!title) continue;
    const item=Object.assign({

      status:'planned', priority:'medium', estimatedMinutes:null, tags:[], createdAt:Date.now(), completedAt:null
    }, raw, {title, id:raw.id || uid()});
    const key=(item.categoryId||'')+'::'+title.toLowerCase();
    if(seen.has(key)){
      const existing=seen.get(key);
      existing.progress=Math.max(Number(existing.progress)||0, Number(item.progress)||0);
      if(item.total) existing.total=item.total;
      if(item.status) existing.status=item.status;
      if(item.tags?.length) existing.tags=[...new Set([...(existing.tags||[]),...item.tags])];
    }else{
      seen.set(key,item); out.push(item);
    }
  }

}

function uid(){ return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

function todayISO(){ return new Date().toISOString().slice(0,10); }

function fmtDate(iso){

  const d = new Date(iso+'T00:00:00');

  const today = todayISO();

  const yest = new Date(Date.now()-86400000).toISOString().slice(0,10);

  if(iso===today) return 'Today';

  if(iso===yest) return 'Yesterday';

  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});

}

function fmtMinutes(m){

  m = Math.round(m);

  if(m < 60) return m+'m';

  const h = Math.floor(m/60), mm = m%60;

  return h+'h '+(mm? mm+'m':'').trim();

}

function unitLabel(unitKey, count){

function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cleanTitle(value){
  return String(value ?? '')
    .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/gi, '$1')
    .replace(/^\s*<!\[CDATA\[\s*/i, '')
    .replace(/\s*\]\]>\s*$/i, '')
    .trim();
}

function daysSince(ts){ if(!ts) return Infinity; return (Date.now()-ts)/86400000; }

function hoursAgo(h){ return Date.now() - h*3600000; }

function lastSessionFor(catId){

  let best = null;

  for(const s of S.sessions){ if(s.categoryId===catId && (!best || s.timestamp>best.timestamp)) best = s; }

  return best;

}

function minutesSince(catId, hours){

  const cutoff = hoursAgo(hours);

  return S.sessions.filter(s=>s.categoryId===catId && s.timestamp>=cutoff && s.status!=='skipped')

    .reduce((sum,s)=>sum+(s.minutes||0),0);

}

function todaysSessions(){

  return S.sessions.filter(s=>s.date===t);

}

function sessionsInRange(days){

  const cutoff = hoursAgo(days*24);

  return S.sessions.filter(s=>s.timestamp>=cutoff);

}

   SCHEDULER

   ============================================================ */

function recentTaskWindow(n){

  const sorted = [...S.sessions].sort((a,b)=>b.timestamp-a.timestamp);

  return sorted.slice(0,n);

}

function schedulerConsumptionSessions(){
  return S.sessions.filter(s=>s && s.status!=='skipped' && ((Number(s.minutes)||0)>0 || (Number(s.actualAmount)||0)>0));
}

function categoryBalance(cat){
  const enabled=S.categories.filter(c=>c.enabled);
  const weightTotal=enabled.reduce((a,c)=>a+Math.max(0.25,Number(c.weight)||1),0) || 1;
  const desiredShare=Math.max(0.25,Number(cat.weight)||1)/weightTotal;
  const all=schedulerConsumptionSessions();
  const now=Date.now();

  // Recent behavior matters most, but lifetime history remains a real signal.
  const windows=[
    {days:3, weight:.35, minMinutes:60},
    {days:7, weight:.25, minMinutes:120},
    {days:30, weight:.20, minMinutes:240},
    {days:null, weight:.20, minMinutes:1}
  ];

  let ratioSum=0, usedWeight=0;
  const detail={};
  for(const w of windows){
    const rows=w.days==null ? all : all.filter(x=>Number(x.timestamp)>=now-w.days*86400000);
    const totalMinutes=rows.reduce((a,x)=>a+Math.max(0,Number(x.minutes)||0),0);
    const catMinutes=rows.filter(x=>x.categoryId===cat.id).reduce((a,x)=>a+Math.max(0,Number(x.minutes)||0),0);
    const key=w.days==null?'lifetime':`${w.days}d`;
    const actualShare=totalMinutes>0 ? catMinutes/totalMinutes : 0;
    const ratio=desiredShare>0 ? actualShare/desiredShare : 1;
    detail[key]={totalMinutes,catMinutes,actualShare,ratio};
    if(totalMinutes>=w.minMinutes){ ratioSum+=Math.min(6,ratio)*w.weight; usedWeight+=w.weight; }
  }

  const consumptionRatio=usedWeight>0 ? ratioSum/usedWeight : 1;
  const last=lastSessionFor(cat.id);
  const daysIdle=daysSince(last?last.timestamp:null);
  return {desiredShare,consumptionRatio,daysIdle,detail};
}

function computeScores(excludeIds){
  excludeIds = excludeIds || [];
  const st = S.settings;
  let pool = S.categories.filter(c=>c.enabled && !excludeIds.includes(c.id));
  if(pool.length===0) pool = S.categories.filter(c=>c.enabled);
  const recentWindow = recentTaskWindow(6);

  let streakCatId = null, streakLen = 0;
  const chron = [...S.sessions].sort((a,b)=>b.timestamp-a.timestamp);
  if(chron.length){
    streakCatId = chron[0].categoryId;
    for(const s of chron){ if(s.categoryId===streakCatId) streakLen++; else break; }
  }

  return pool.map(cat=>{
    const last = lastSessionFor(cat.id);
    const dSince = daysSince(last ? last.timestamp : null);
    const neglectBonus = last ? Math.min(st.neglectCap, dSince*st.neglectRate) : st.neglectCap;
    const occurrences = recentWindow.filter(s=>s.categoryId===cat.id).length;
    const repetitionPenalty = occurrences * st.repetitionPenalty;
    const consecutivePenalty = (streakCatId===cat.id) ? streakLen*st.consecutivePenalty : 0;

    const balance=categoryBalance(cat);
    // Ratio 1 = on balance. Above 1 = category owns too much consumption time.
    // Below 1 = underrepresented. Cap both sides so one binge never permanently locks a category out.
    const overRatio=Math.max(0,balance.consumptionRatio-1);
    const underRatio=Math.max(0,1-balance.consumptionRatio);
    const saturationPenalty=Math.min(70,overRatio*st.saturationWeight*2.2);
    const balanceBonus=Math.min(28,underRatio*st.neglectCap*.55);

    const seasonalBonus = cat.seasonal ? (st.seasonalBonus + st.seasonalFreshCount*4) : 0;
    const weightScore = cat.weight * 8;
    const raw = weightScore + neglectBonus + balanceBonus + seasonalBonus - repetitionPenalty - consecutivePenalty - saturationPenalty;
    const floored = Math.max(raw, 1.5);
    const jitter = floored * (Math.random()*st.randomness*2 - st.randomness);
    const final = Math.max(floored + jitter, 0.5);

    const reasons = [];
    if(!last) reasons.push({t:'Never consumed yet', w: st.neglectCap});
    else if(dSince>=1) reasons.push({t:`Neglected for ${Math.floor(dSince)}d`, w: neglectBonus});
    if(balance.consumptionRatio>=1.35) reasons.push({t:'Overrepresented across your consumption history — cooling off',w:-saturationPenalty});
    else if(balance.consumptionRatio<=.70 && last) reasons.push({t:'Underrepresented in your overall consumption — catching up',w:balanceBonus});
    if(cat.seasonal && st.seasonalFreshCount>0) reasons.push({t:`${st.seasonalFreshCount} seasonal title(s) have fresh episodes`, w: seasonalBonus});
    else if(cat.seasonal) reasons.push({t:'Time-sensitive — airing now', w: seasonalBonus});
    if(repetitionPenalty+consecutivePenalty>4) reasons.push({t:'Appeared often in recent tasks', w: -(repetitionPenalty+consecutivePenalty)});
    reasons.sort((a,b)=>Math.abs(b.w)-Math.abs(a.w));

    return {cat, score: final, reasons: reasons.slice(0,3), debug:{neglectBonus,repetitionPenalty,consecutivePenalty,saturationPenalty,seasonalBonus,weightScore,balanceBonus,balanceRatio:balance.consumptionRatio}};
  });
}

function weightedPick(scored){
  const total = scored.reduce((s,x)=>s+x.score,0);
  let r = Math.random()*total;
  for(const x of scored){
    r -= x.score;
    if(r<=0) return x;
  }
  return scored[scored.length-1];
}

function suggestedAmount(cat){
  const t=Math.max(1,Number(cat.target)||1);
  const balance=categoryBalance(cat);
  const ratio=balance.consumptionRatio;
  const idle=balance.daysIdle;

  // Amount is self-correcting too: overconsumed categories shrink, neglected ones grow.
  // Recent windows dominate, lifetime history prevents a long binge from being forgotten overnight.
  let mult=1;
  if(ratio>=2.5) mult*=.50;
  else if(ratio>=1.8) mult*=.62;
  else if(ratio>=1.35) mult*=.78;
  else if(ratio<=.45) mult*=1.35;
  else if(ratio<=.70) mult*=1.18;

  // Time since last consumption adds a gradual catch-up boost with diminishing returns.
  if(Number.isFinite(idle)){
    if(idle>=60) mult*=1.65;
    else if(idle>=30) mult*=1.50;
    else if(idle>=14) mult*=1.32;
    else if(idle>=7) mult*=1.18;
  }else{
    mult*=1.5;
  }

  // Keep correction gradual. MediaFlow should rebalance over rotations, not create giant debt sessions.
  mult=clamp(mult,.45,2.0);
  const center=Math.max(1,Math.round(t*mult));
  let low,high;
  if(center<=2){ low=center; high=center; }
  else{
    low=Math.max(1,Math.round(center*.85));
    high=Math.max(low,Math.round(center*1.15));
  }

  const direction=mult<.9?'reduced':mult>1.1?'increased':'normal';
  return {low,high,multiplier:mult,direction,balanceRatio:ratio,daysIdle:idle};
}

function scoreLibraryTitle(item, cat){
  if(!item || item.categoryId!==cat.id) return -Infinity;
  if(item.status==='completed' || item.status==='dropped') return -Infinity;
  const total = Number(item.total);
  const progress = Number(item.progress)||0;
  const completion = total>0 ? Math.min(1,progress/total) : 0;
  const remaining = total>0 ? Math.max(0,total-progress) : 10;
  const priorityBonus = ({high:18,medium:8,low:0}[item.priority]||0);
  const activeBonus = item.status==='active' ? 12 : item.status==='planned' ? 5 : 0;
  const unfinishedBonus = total>0 ? Math.min(20, remaining*2) : 6;
  const seasonalBonus = cat.seasonal ? 10 : 0;
  const jitter = Math.random()*8;
  return priorityBonus + activeBonus + unfinishedBonus + seasonalBonus - completion*10 + jitter;
}

function pickLibraryTitle(cat){
  const pool=S.library.filter(i=>i && i.categoryId===cat.id && i.status!=='completed' && i.status!=='dropped');
  if(!pool.length) return null;
  return pool.slice().sort((a,b)=>scoreLibraryTitle(b,cat)-scoreLibraryTitle(a,cat))[0] || null;
}


function generateTask(excludeIds){
  const scored = computeScores(excludeIds);
  if(scored.length===0) return null;
  const pick = weightedPick(scored);
  const amount = suggestedAmount(pick.cat);
  const {low, high} = amount;
  const recommendedTitle = S.settings.exactTitleRecommendations ? pickLibraryTitle(pick.cat) : null;
  const amountReason=amount.direction==='reduced'
    ? 'Session size reduced because this category is overrepresented in your consumption'
    : amount.direction==='increased'
      ? 'Session size increased to gradually catch this category up'
      : 'Session size is near its normal target';
  return {
    id: uid(),
    categoryId: pick.cat.id,
    libraryId: recommendedTitle ? recommendedTitle.id : null,
    title: recommendedTitle ? cleanTitle(recommendedTitle.title) : null,
    low, high,
    targetMid: Math.round((low+high)/2) || pick.cat.target,
    unit: pick.cat.unit,
    createdAt: Date.now(),
    reasons: [...pick.reasons.map(r=>r.t),amountReason].slice(0,4),
    amountMultiplier: amount.multiplier,
    balanceRatio: amount.balanceRatio
  };
}

function findLibraryMatch(categoryId, title){

  const t = title.trim().toLowerCase();

  return S.library.find(i=>i.categoryId===categoryId && i.title.trim().toLowerCase()===t) || null;

}

function entriesNote(entries){

  return entries.map(e=> e.qty>1 ? `${e.title} ×${e.qty}` : e.title).join(', ');

}

function entriesTotal(entries){

  return entries.reduce((s,e)=>s+(Number(e.qty)||0),0);

function normalizeSeasonalLibraryItems(){
  const seasonal=S.categories.find(c=>c.id==='seasonal');
  const backlog=S.categories.find(c=>c.id==='backlog');
  if(!seasonal || !backlog) return false;
  let changed=false;
  S.library.forEach(item=>{
    if(!item || item.categoryId!==seasonal.id) return;
    const completeByProgress=item.total!=null && Number(item.total)>0 && Number(item.progress||0)>=Number(item.total);
    const completeByStatus=item.status==='completed';
    if(completeByProgress || completeByStatus){
      // Completion is represented by the Anime Backlog category.
      // Do not add/remove/modify tags as part of this transition.
      item.categoryId=backlog.id;
      item.status='completed';
      if(item.total!=null) item.progress=Math.max(Number(item.progress)||0,Number(item.total)||0);
      changed=true;
    }
  });
  return changed;
}

function logTitleCandidates(query){
  const q=String(query||'').trim().toLowerCase();
  if(!q) return [];
  return S.library.filter(i=>{
    if(!i || i.status==='dropped' || i.status==='completed') return false;
    return cleanTitle(i.title).toLowerCase().includes(q);
  }).slice(0,10);
}

function renderLogSuggestions(){
  const box=document.getElementById('log-suggestions');
  if(!box) return;
  const candidates=logTitleCandidates(S.entryDraft.title);
  if(!candidates.length){ box.innerHTML=''; return; }
  box.innerHTML=`<div class="log-suggestion-list">${candidates.map(i=>{
    const c=getCategory(i.categoryId);
    const icon=c?.icon||'📚';
    const name=c?.name||'Library';
    const progress=i.total!=null?`${i.progress||0}/${i.total}`:'progress unknown';
    return `<div class="log-suggestion"><div><b>${escapeHtml(cleanTitle(i.title))}</b><small>${icon} ${escapeHtml(name)} · ${progress}</small></div><button class="btn btn-sm btn-ghost" type="button" onclick="App.selectLogTitle('${i.id}')">Use</button></div>`;
  }).join('')}</div>`;
}

function submitLog(){

  const t = S.currentTask;

  const cat = getCategory(t.categoryId);

  const amount = clamp(Number(S.logDraft.amount)||0, 0, 999999);

  const minutes = clamp(Number(S.logDraft.minutes)||0, 0, 999999);

  let status = 'complete';

  if(amount<=0) status='skipped';

  else if(amount<t.targetMid) status='partial';

  else if(amount>t.targetMid) status='over';

  const entries = S.logDraft.entries||[];

  const autoNote = entriesNote(entries);

  const extra = (S.logDraft.note||'').trim();

  const note = [autoNote, extra].filter(Boolean).join(' — ');

  const healthStatus = categoryStatus(cat).status;
  const xpCalc = calculateConsumptionXP(cat, amount, minutes, healthStatus);
  const sess = {

    id: uid(), timestamp: Date.now(), date: todayISO(),

    categoryId: cat.id, targetAmount: t.targetMid, actualAmount: amount,

    minutes, note, status, unit: cat.unit, xp: xpCalc.xp, healthStatus,
    titles: entries.map(e=>({title:cleanTitle(e.title),libraryId:e.libraryId||null,qty:Number(e.qty)||0})),

  };

  S.sessions.push(sess);

  if(S.logDraft.updateLibrary){

    entries.forEach(e=>{

      const item = e.libraryId ? S.library.find(i=>i.id===e.libraryId) : findLibraryMatch(cat.id, e.title);

      if(item){

        item.progress = (item.progress||0) + (Number(e.qty)||0);

        if(item.total) item.progress = Math.min(item.progress, item.total);

        if(item.total && item.progress>=item.total && item.status!=='dropped'){ item.status='completed'; item.completedAt=item.completedAt||Date.now(); S.completionTimeline=S.completionTimeline||[]; if(!S.completionTimeline.some(x=>x.libraryId===item.id)){ S.completionTimeline.push({libraryId:item.id,title:cleanTitle(item.title),categoryId:item.categoryId,completedAt:item.completedAt}); } }

        else if(item.status==='planned') item.status='active';

      }

    });

    // Seasonal titles that become completed must immediately move to the Anime Backlog.
    normalizeSeasonalLibraryItems();
    persistLibrary();

  }

  persistSessions();

  S.currentTask = generateTask([cat.id]);

  S.logging = false;

  persistTask(); render();

}

function categoryHealthGuidance(cat, status){
  if(status==='overused'){
    return `Take a break from ${cat.name}. Focus on categories marked Due or Neglected, and let this category cool down before consuming more.`;
  }
  if(status==='neglected'){
    const amount = suggestedAmount(cat);
    const mid = Math.max(1, Math.round((amount.low + amount.high) / 2));
    return `Prioritize ${cat.name}. Do about ${mid} ${unitLabel(cat.unit, mid)} next, then rotate and let the status recalculate.`;
  }
  if(status==='due'){
    const amount = suggestedAmount(cat);
    const mid = Math.max(1, Math.round((amount.low + amount.high) / 2));
    return `Give ${cat.name} attention next. Aim for about ${mid} ${unitLabel(cat.unit, mid)}, then rotate to another category.`;
  }
  return `Keep ${cat.name} in your normal rotation. No special correction is needed.`;
}

function categoryStatusActionSummary(cat, todayStatus, overallStatus){
  const todayGuide = categoryHealthGuidance(cat, todayStatus);
  const overallGuide = categoryHealthGuidance(cat, overallStatus);
  if(todayStatus===overallStatus) return todayGuide;
  return `Today: ${todayGuide} Overall: ${overallGuide}`;
}

function categoryStatus(cat){

  const last = lastSessionFor(cat.id);

  const dSince = daysSince(last?last.timestamp:null);

  const min72 = minutesSince(cat.id,72);

  const expected3d = cat.target*cat.minutesPerUnit*2.2;

  const satRatio = expected3d>0 ? min72/expected3d : 0;

  const todayAmt = todaysSessions().filter(s=>s.categoryId===cat.id && s.status!=='skipped').reduce((a,s)=>a+s.actualAmount,0);

  if(todayAmt>0 && satRatio>=1.6) return 'overused';

  if(dSince>=6) return 'neglected';

  if(dSince>=2.2) return 'due';

  return 'healthy';

}

function overallCategoryStatus(cat){

  // Overall health uses the category's entire recorded history:
  // from its first ever non-skipped log through its last ever log.
  const sessions = S.sessions
    .filter(s=>s && s.categoryId===cat.id && s.status!=='skipped' && Number(s.minutes)>0)
    .sort((a,b)=>new Date(a.timestamp||a.date)-new Date(b.timestamp||b.date));

  if(!sessions.length) return 'healthy';

  const first = sessions[0];
  const last = sessions[sessions.length-1];
  const firstTime = new Date(first.timestamp||first.date).getTime();
  const lastTime = new Date(last.timestamp||last.date).getTime();
  const spanDays = Math.max(3,(lastTime-firstTime)/(24*60*60*1000));
  const totalMinutes = sessions.reduce((sum,s)=>sum+(Number(s.minutes)||0),0);
  const expectedPerDay = (cat.target*cat.minutesPerUnit*2.2)/3;
  const expectedOverall = expectedPerDay*spanDays;
  const ratio = expectedOverall>0 ? totalMinutes/expectedOverall : 0;

  // Recency still matters for whether the category is currently due/neglected,
  // while the consumption ratio itself covers the full lifetime of the category.
  const dSince = daysSince(last.timestamp||last.date);
  if(dSince>=6) return 'neglected';
  if(ratio>=1.6) return 'overused';
  if(dSince>=2.2) return 'due';
  return 'healthy';
}

function saturationLevel(cat){

  const min72 = minutesSince(cat.id,72);

  const baseline = Math.max(cat.target*cat.minutesPerUnit,1)*2.2;

  const ratio = min72/baseline;

  if(ratio<0.25) return {label:'VERY LOW', c:'#5AA9E6'};

  if(ratio<0.7) return {label:'LOW', c:'#3FC7A6'};

  if(ratio<1.4) return {label:'MEDIUM', c:'#E8A94A'};

  if(ratio<2.4) return {label:'HIGH', c:'#F58A5A'};

  return {label:'VERY HIGH', c:'#E8607A'};

}

function totalsForSessions(list){

  const out = {minutes:0, episodes:0, chapters:0, movies:0, issues:0, tasks:0};

  list.forEach(s=>{

    if(s.status==='skipped') return;

    out.minutes += s.minutes||0;

    out.tasks += 1;

    if(out[s.unit]!==undefined) out[s.unit]+=s.actualAmount;

  });

  return out;

}

function xpUnitBonus(unit){ return ({episodes:10,movies:30,chapters:3,issues:6}[unit]||5); }
function levelingSettings(){

function xpRotationMultiplier(status){ return Number(levelingSettings().rotationMultiplier?.[status])||1; }
function xpRotationLabel(status){ return ({neglected:'Neglected bonus',due:'Due bonus',healthy:'Normal rotation',overused:'Overuse reduction'}[status]||'Normal rotation'); }
function xpUnitBonus(unit){ return Number(levelingSettings().unitXP?.[unit])||0; }
function libraryAdditionXP(){ return Math.max(0,Math.round(Number(levelingSettings().libraryAdditionXP)||0)); }
function titleCompletionXP(item, qty){
  if(!item || item.total==null) return 0;
  const before=Number(item.progress)||0, after=Math.min(Number(item.total)||0,before+Math.max(0,Number(qty)||0));
  return before < Number(item.total) && after >= Number(item.total) ? Math.max(0,Math.round(Number(levelingSettings().completionXP)||0)) : 0;
}
function calculateConsumptionXP(cat, amount, minutes, status){
  if(!levelingSettings().enabled || !cat || status==='skipped' || amount<=0 || minutes<=0) return {base:0,multiplier:xpRotationMultiplier(status),xp:0,label:xpRotationLabel(status),unitBonus:0};
  const minuteBase=Math.max(0,Math.round(minutes))*Math.max(0,Number(levelingSettings().minuteXP)||0);
  const base=minuteBase + Math.max(0,Math.round(amount))*xpUnitBonus(cat.unit);
  const multiplier=xpRotationMultiplier(status);
  return {base,multiplier,xp:Math.max(0,Math.round(base*multiplier)),label:xpRotationLabel(status),unitBonus:xpUnitBonus(cat.unit)};
}
function estimateCurrentLogXP(){
  const cat=getCategory(S.currentTask?.categoryId||S.logDraft?.categoryId||'');
  const amount=Math.max(0,Number(S.logDraft?.amount)||0), minutes=Math.max(0,Number(S.logDraft?.minutes)||0);
  const status=cat?.id ? categoryStatus(cat).status : 'healthy';
  return calculateConsumptionXP(cat,amount,minutes,status);
}
function awardLibraryAdditionXP(id){
  if(!id) return 0;
  S.xpLedger=S.xpLedger||{libraryAdditions:{}};
  S.xpLedger.libraryAdditions=S.xpLedger.libraryAdditions||{};
  if(S.xpLedger.libraryAdditions[id]) return 0;
  const xp=libraryAdditionXP(); S.xpLedger.libraryAdditions[id]=xp; return xp;
}
function libraryXPTotal(){ return Object.values(S.xpLedger?.libraryAdditions||{}).reduce((a,v)=>a+(Number(v)||0),0); }
function sessionStoredXP(s){
  if(!s || s.status==='skipped') return 0;
  if(Number.isFinite(Number(s.xp))) return Math.max(0,Number(s.xp));
  // Legacy history from before the leveling system still contributes XP,
  // but is not retroactively given a rotation bonus because its original
  // category health at the time of logging was not recorded.
  const cat=getCategory(s.categoryId);
  return calculateConsumptionXP(cat,Number(s.actualAmount)||0,Number(s.minutes)||0,'healthy').xp;
}
function mediaFlowXP(){
  return S.sessions.reduce((total,s)=>total+sessionStoredXP(s),0) + libraryXPTotal();
}
function mediaFlowLevelInfo(){
  const xp=mediaFlowXP();
  let level=1, spent=0, need=100;
  while(xp>=spent+need){ spent+=need; level++; need=Math.round(100*Math.pow(level,1.35)); }
  const into=xp-spent;
  const pct=need?Math.min(100,Math.round(into/need*100)):100;
  return {xp,level,current:into,needed:need,pct,totalToNext:spent+need};
}

function computeDayStreak(){

  const days = new Set(S.sessions.filter(s=>s.status!=='skipped').map(s=>s.date));

  let streak=0, cur=new Date();

  while(true){

    const iso = cur.toISOString().slice(0,10);

    if(days.has(iso)){ streak++; cur.setDate(cur.getDate()-1); }

    else break;

  }

  return streak;

}

function renderView(){

  const root = document.getElementById('view-root');

  if(!root) return;

  let html='';

  if(S.view==='dashboard') html = renderDashboard();

  else if(S.view==='library') html = renderLibrary();

  else if(S.view==='history') html = renderHistory();

  else if(S.view==='stats') html = renderStats();

  else if(S.view==='settings') html = renderSettings();
  else if(S.view==='profile') html = renderProfile();

  root.innerHTML = `<div class="fade-in">${html}</div>`;

}

function renderLibrary(){

  const cats = S.categories;

  const overviewRows = cats.map(cat=>{

    const items = S.library.filter(i=>i.categoryId===cat.id);

    // Always count consumed/read progress, even when a title has no known total.
    const done = items.reduce((a,i)=>a+Math.max(0,Number(i.progress)||0),0);
    const knownItems = items.filter(i=>i.total!=null && Number(i.total)>0);
    const knownDone = knownItems.reduce((a,i)=>a+Math.min(Math.max(0,Number(i.progress)||0),Number(i.total)||0),0);
    const total = knownItems.reduce((a,i)=>a+(Number(i.total)||0),0);
    const hasUnknownTotal = items.some(i=>i.total==null || Number(i.total)<=0);
    const pct = total>0 && !hasUnknownTotal ? Math.round(knownDone/total*100) : 0;
    const progressText = items.length===0 ? '0 / -' : (hasUnknownTotal || total<=0 ? `${done} / -` : `${done} / ${total} (${pct}%)`);

    return `<div class="overview-row">

      <div class="ov-name"><span>${cat.icon}</span> ${escapeHtml(cat.name)}</div>

      <div class="ov-track"><div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:linear-gradient(90deg, ${cat.color}88, ${cat.color});"></div></div></div>

      <div class="ov-num">${progressText}</div>

    </div>`;

  }).join('');

  const totalDone = S.library.filter(i=>i.total).reduce((a,i)=>a+Math.min(i.progress,i.total),0);

  const totalAll = S.library.filter(i=>i.total).reduce((a,i)=>a+i.total,0);

  const overallPct = totalAll>0 ? Math.round(totalDone/totalAll*100) : 0;

  let itemsHtml, pagerHtml='';

  if(S.library.length===0){

    itemsHtml = `<div class="empty-state"><div class="em-icon">📚</div><div class="em-title">Your library is empty</div><div>Add titles to track progress toward clearing your whole collection.</div>

      <div style="margin-top:16px;"><button class="btn btn-primary" onclick="App.openLibraryModal()">Add a title</button></div>

    </div>`;

  } else {

    const catFilter = S.histFilters.libCategory || 'all';

    const statusFilter = S.histFilters.libStatus || 'all';

    const q = (S.histFilters.libSearch||'').trim().toLowerCase();

    let items = S.library;

    if(catFilter!=='all') items = items.filter(i=>i.categoryId===catFilter);

    if(statusFilter!=='all') items = items.filter(i=>i.status===statusFilter);
    const priorityFilter = S.histFilters.libPriority || 'all';
    if(priorityFilter!=='all') items = items.filter(i=>i.priority===priorityFilter);

    if(q) items = items.filter(i=>cleanTitle(i.title).toLowerCase().includes(q));

    items = items.slice().sort((a,b)=>(b.priority||'medium').localeCompare(a.priority||'medium') || cleanTitle(a.title).localeCompare(cleanTitle(b.title)));

    const PAGE = 50;

    const totalItems = items.length;

    const maxPage = Math.max(0, Math.ceil(totalItems/PAGE)-1);

    S.libPage = clamp(S.libPage||0, 0, maxPage);

    const pageItems = items.slice(S.libPage*PAGE, S.libPage*PAGE+PAGE);

    itemsHtml = pageItems.map(i=>{

      const cat = getCategory(i.categoryId);

      const lastTitleSession = [...S.sessions].reverse().find(ss=>ss.titles?.some(tt=>tt.libraryId===i.id || cleanTitle(tt.title).toLowerCase()===cleanTitle(i.title).toLowerCase()));
      const ageMs = lastTitleSession ? Math.max(0,Date.now()-lastTitleSession.timestamp) : Math.max(0,Date.now()-(Number(i.createdAt)||Date.now()));
      const ageDays = Math.floor(ageMs/86400000);
      const ageLabel = lastTitleSession ? (ageDays===0?'Touched today':`${ageDays}d untouched`) : (ageDays===0?'Added today':`Never consumed · ${ageDays}d old`);
      const aging = cat.id==='backlog' ? `<span class="aging-badge status-${ageDays>=30?'neglected':ageDays>=7?'due':'healthy'}" title="Time since this backlog item was last consumed">${escapeHtml(ageLabel)}</span>` : '';
      return `<div class="item-row">
        <div class="bal-icon" style="background:${cat.color}22; color:${cat.color};">${cat.icon}</div>
        <div>

          <div class="item-title">${escapeHtml(cleanTitle(i.title))} ${i.source==='mal'?'<span class="tag">MAL</span>':i.source==='simkl'?'<span class="tag">Imported</span>':''}</div>

          <div class="item-sub"><button type="button" class="pill category-click" style="text-transform:none;border:1px solid var(--border-soft);color:inherit;background:transparent;padding:2px 7px;" onclick="event.preventDefault();event.stopPropagation();App.chooseCategoryForLibrary('${i.id}')">${cat.icon} ${escapeHtml(cat.name)}</button> ${aging} ${i.total? '· '+i.progress+' / '+i.total+' '+unitLabel(cat.unit,i.total) : (i.progress? '· '+i.progress+' '+unitLabel(cat.unit,i.progress):'')} ${(i.tags&&i.tags.length)? '· '+i.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join(''):''}</div>

        </div>

        <button type="button" class="pill status-click" style="text-transform:capitalize;border:1px solid transparent;color:inherit;" onclick="event.preventDefault();event.stopPropagation();App.chooseStatusForLibrary('${i.id}')">${i.status}</button>

        <button type="button" class="pill priority-click" style="text-transform:capitalize;border:0;color:inherit;" onclick="event.preventDefault();event.stopPropagation();App.choosePriority('${i.id}')">${i.priority} priority</button>

        <button type="button" class="btn btn-sm btn-ghost" onclick="event.preventDefault(); event.stopPropagation(); App.openLibraryModal('${i.id}')">Edit</button>

        <button type="button" class="btn btn-sm btn-danger" onclick="event.preventDefault(); event.stopPropagation(); App.deleteLibraryItem('${i.id}')">Delete</button>

      </div>`;

    }).join('') || `<div class="empty-state">No items match this filter.</div>`;

    if(totalItems>PAGE){
      const pageCount=maxPage+1;
      const pageButtons=[];
      let startPage=Math.max(0,S.libPage-2);
      if(startPage+4>maxPage) startPage=Math.max(0,maxPage-4);
      const endPage=Math.min(maxPage,startPage+4);
      for(let p=startPage;p<=endPage;p++){
        pageButtons.push(`<button class="btn btn-sm page-num ${p===S.libPage?'page-current':''}" onclick="App.setLibPage(${p})">${p+1}</button>`);
      }
      pagerHtml = `<div class="lib-pagination">
        <button class="btn btn-sm" ${S.libPage<=0?'disabled':''} onclick="App.setLibPage(${S.libPage-1})">← Prev</button>
        ${pageButtons.join('')}
        <button class="btn btn-sm" ${S.libPage>=maxPage?'disabled':''} onclick="App.setLibPage(${S.libPage+1})">Next →</button>
        <small class="hint" style="margin:0 0 0 4px;">Page ${S.libPage+1} of ${pageCount} · ${totalItems} titles</small>
      </div>`;
    }

  }

   return ` 

    <div class="view-head">

      <div><div class="view-title">Library</div><div class="view-desc">Track your titles. The scheduler still only picks the category — this is just for your own progress.</div></div>

      <button class="btn btn-primary" onclick="App.openLibraryModal()">+ Add title</button>
      <button class="btn btn-danger" onclick="App.emptyLibraryAdvanced()">Empty library</button>

    </div>

    <div class="section-label">OVERVIEW · ${overallPct}% of tracked library cleared</div>

    <div class="card" style="margin-bottom:26px;">${overviewRows}</div>

    <div class="lib-toolbar">

      <div class="section-label" style="margin:0;">TITLES (${S.library.length})</div>

      <div class="lib-filters">

        <input type="text" placeholder="Search titles…" value="${escapeHtml(S.histFilters.libSearch||'')}" class="lib-search" oninput="App.setLibFilter('libSearch', this.value, true)">

        <select onchange="App.setLibFilter('libCategory', this.value)">

          <option value="all">All categories</option>

          ${cats.map(c=>`<option value="${c.id}" ${S.histFilters.libCategory===c.id?'selected':''}>${c.icon} ${escapeHtml(c.name)}</option>`).join('')}

        </select>

function renderHistory(){

  const f = S.histFilters;

  // History can grow very large over time. Keep the DOM small by rendering
  // only one page at a time instead of creating a row for every session.
  let list = S.sessions.slice().sort((a,b)=>b.timestamp-a.timestamp);

  if(f.category && f.category!=='all') list = list.filter(s=>s.categoryId===f.category);

  if(f.type && f.type!=='all') list = list.filter(s=>getCategory(s.categoryId).type===f.type);

  if(f.range==='today') list = list.filter(s=>s.date===todayISO());

  else if(f.range==='week') list = list.filter(s=>s.timestamp>=hoursAgo(24*7));

  else if(f.range==='month') list = list.filter(s=>s.timestamp>=hoursAgo(24*30));

  const pageSize = Math.max(25, Number(S.histPageSize)||50);
  const pageCount = Math.max(1, Math.ceil(list.length/pageSize));
  S.histPage = clamp(Number(S.histPage)||0, 0, pageCount-1);
  const startIndex = S.histPage * pageSize;
  const pageItems = list.slice(startIndex, startIndex + pageSize);

  const rows = pageItems.map(s=>{

    const cat = getCategory(s.categoryId);

    const d = new Date(s.timestamp);

    const labelMap = {complete:'Complete', partial:'Partial', over:'Over', skipped:'Skipped'};

    return `<div class="hist-row">

      <div class="hist-date">${fmtDate(s.date)}<br><span style="opacity:.6;">${d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}</span></div>

      <div class="hist-icon" style="background:${cat.color}22; color:${cat.color};">${cat.icon}</div>

      <div class="hist-main">

        <div class="hist-cat">${escapeHtml(cat.name)}</div>

        <div class="hist-amt">${s.actualAmount} ${unitLabel(s.unit,s.actualAmount)} · ${fmtMinutes(s.minutes)} · target ${s.targetAmount}</div>
        ${s.status!=='skipped'?`<div class="hist-xp" style="margin-top:4px;font-size:11px;color:var(--flow);font-weight:800;">+${Math.round(sessionStoredXP(s)).toLocaleString()} XP · ${escapeHtml(xpRotationLabel(s.healthStatus||'healthy'))}</div>`:''}

        ${s.note? `<div class="hist-note">"${escapeHtml(s.note)}"</div>`:''}

      </div>

      <div class="hist-status" style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">

        <span class="status-badge status-${s.status==='skipped'?'overused':s.status==='partial'?'due':s.status==='over'?'neglected':'healthy'}">${labelMap[s.status]}</span>

        <div style="display:flex; gap:4px;">

          <button class="btn btn-sm btn-ghost" onclick="App.openSessionModal('${s.id}')">Edit</button>

          <button class="btn btn-sm btn-danger" onclick="App.deleteSession('${s.id}')">Delete</button>

        </div>

      </div>

    </div>`;

  }).join('') || `<div class="empty-state"><div class="em-icon">🕓</div><div class="em-title">No sessions yet</div><div>Complete a task from the dashboard to see it here.</div></div>`;

  const pagerHtml = list.length > pageSize ? `<div class="lib-pagination">
    <button class="btn btn-sm" ${S.histPage<=0?'disabled':''} onclick="App.setHistPage(${S.histPage-1})">← Previous</button>
    <span>Page ${S.histPage+1} of ${pageCount} · ${list.length.toLocaleString()} entries</span>
    <button class="btn btn-sm" ${S.histPage>=pageCount-1?'disabled':''} onclick="App.setHistPage(${S.histPage+1})">Next →</button>
  </div>` : (list.length ? `<div class="health-note">${list.length.toLocaleString()} history ${list.length===1?'entry':'entries'}. Large histories are paginated to keep this view responsive.</div>` : '');

   return `

    <div class="view-head">

      <div><div class="view-title">History</div><div class="view-desc">Every logged task — edit or delete anything, the scheduler recalculates from what's actually here.</div></div>

      ${S.sessions.length? `<button class="btn btn-sm" onclick="App.undoLastEntry()">↺ Undo last entry</button>` : ''}

    </div>

    <div class="lib-toolbar">

      <div class="lib-filters">

        <select onchange="App.setHistFilter('category', this.value)">

          <option value="all">All categories</option>

          ${S.categories.map(c=>`<option value="${c.id}" ${f.category===c.id?'selected':''}>${c.icon} ${escapeHtml(c.name)}</option>`).join('')}

        </select>

        <select onchange="App.setHistFilter('type', this.value)">

          <option value="all">All media types</option>

          <option value="video" ${f.type==='video'?'selected':''}>Video</option>

          <option value="reading" ${f.type==='reading'?'selected':''}>Reading</option>

        </select>

        <select onchange="App.setHistFilter('range', this.value)">

          <option value="all" ${f.range==='all'?'selected':''}>All time</option>

          <option value="today" ${f.range==='today'?'selected':''}>Today</option>

          <option value="week" ${f.range==='week'?'selected':''}>This week</option>

          <option value="month" ${f.range==='month'?'selected':''}>This month</option>

        </select>

      </div>

      <button class="btn btn-sm" onclick="App.exportCSV()">Export CSV</button>

    </div>

    ${pagerHtml}
    <div class="card">${rows}</div>
    ${pagerHtml}

  `;

}

function renderStats(){

  const today = totalsForSessions(todaysSessions());

  const week = totalsForSessions(sessionsInRange(7));

  const month = totalsForSessions(sessionsInRange(30));

  const lifetime = totalsForSessions(S.sessions);

  const cats = S.categories.filter(c=>c.enabled);

  const weekMinutesByCat = cats.map(c=>({c, m: sessionsInRange(7).filter(s=>s.categoryId===c.id && s.status!=='skipped').reduce((a,s)=>a+s.minutes,0)}));

  const maxW = Math.max(1, ...weekMinutesByCat.map(x=>x.m));

   const balanceHtml = weekMinutesByCat.map(({c,m})=>` 

    <div class="bal-bar-row">

      <div class="bal-bar-label">${c.icon} ${escapeHtml(c.name)}</div>

      <div class="bal-bar-track"><div class="bal-bar-fill" style="width:${Math.round(m/maxW*100)}%; background:${c.color};"></div></div>

      <div class="bal-bar-val">${fmtMinutes(m)}</div>

    </div>`).join('');

  const satHtml = cats.map(c=>{

    const lvl = saturationLevel(c);

    return `<div class="sat-row">

      <div class="sat-cat">${c.icon} ${escapeHtml(c.name)}</div>

      <div class="sat-lvl" style="color:${lvl.c}; background:${lvl.c}20;">${lvl.label}</div>

    </div>`;

  }).join('');

  // records

  const lifetimeByCat = cats.map(c=>({c, m: S.sessions.filter(s=>s.categoryId===c.id && s.status!=='skipped').reduce((a,s)=>a+s.minutes,0)}));

  lifetimeByCat.sort((a,b)=>b.m-a.m);

  const most = lifetimeByCat[0];

  const least = lifetimeByCat[lifetimeByCat.length-1];

  const neglect = cats.map(c=>{

    const last = lastSessionFor(c.id);

    return {c, d: daysSince(last?last.timestamp:null)};

  }).sort((a,b)=>b.d-a.d)[0];

  // current streak

  const chron = [...S.sessions].filter(s=>s.status!=='skipped').sort((a,b)=>b.timestamp-a.timestamp);

  let curStreakCat=null, curStreakLen=0;

  if(chron.length){ curStreakCat=chron[0].categoryId; for(const s of chron){ if(s.categoryId===curStreakCat) curStreakLen++; else break; } }

  // longest streak ever

  const chronAsc = [...S.sessions].filter(s=>s.status!=='skipped').sort((a,b)=>a.timestamp-b.timestamp);

  let longest={cat:null,len:0}, run={cat:null,len:0};

  for(const s of chronAsc){

    if(s.categoryId===run.cat) run.len++;

    else run={cat:s.categoryId, len:1};

    if(run.len>longest.len) longest={cat:run.cat, len:run.len};

  }

  const distinctDays = new Set(S.sessions.filter(s=>s.status!=='skipped').map(s=>s.date)).size || 1;

  const avgDailyMinutes = Math.round(lifetime.minutes/distinctDays);

  const nonSkipped = S.sessions.filter(s=>s.status!=='skipped').length;

  const completedOrOver = S.sessions.filter(s=>s.status==='complete'||s.status==='over').length;

  const avgCompletion = nonSkipped>0 ? Math.round(completedOrOver/nonSkipped*100) : 0;

   return ` 

    <div class="view-head"><div><div class="view-title">Statistics</div><div class="view-desc">Your consumption, measured.</div></div></div>

    <div class="grid-3" style="margin-bottom:24px;">

      ${statCard('Today', today)}

      ${statCard('This week', week)}

      ${statCard('This month', month)}

    </div>

    <div class="two-col" style="margin-bottom:24px;">

      <div class="card">

        <div class="section-label">CATEGORY BALANCE — LAST 7 DAYS</div>

        ${balanceHtml || '<div class="empty-state">No data yet.</div>'}

      </div>

      <div class="card">

        <div class="section-label">RECENT SATURATION</div>

        <div class="sat-grid">${satHtml || '<div class="empty-state">No categories enabled.</div>'}</div>

      </div>

    </div>

    <div class="card">

      <div class="section-label">RECORDS</div>

      <div class="record-list">

        <div class="record-row"><span class="k">Most consumed category</span><span class="v">${most? most.c.icon+' '+escapeHtml(most.c.name)+' — '+fmtMinutes(most.m) : '—'}</span></div>

        <div class="record-row"><span class="k">Least consumed category</span><span class="v">${least? least.c.icon+' '+escapeHtml(least.c.name)+' — '+fmtMinutes(least.m) : '—'}</span></div>

        <div class="record-row"><span class="k">Current category streak</span><span class="v">${curStreakCat? getCategory(curStreakCat).icon+' '+getCategory(curStreakCat).name+' × '+curStreakLen : '—'}</span></div>

        <div class="record-row"><span class="k">Longest streak ever</span><span class="v">${longest.cat? getCategory(longest.cat).icon+' '+getCategory(longest.cat).name+' × '+longest.len : '—'}</span></div>

        <div class="record-row"><span class="k">Most neglected category</span><span class="v">${neglect && isFinite(neglect.d)? neglect.c.icon+' '+neglect.c.name+' — '+Math.floor(neglect.d)+'d' : (neglect? neglect.c.icon+' '+neglect.c.name+' — never':'—')}</span></div>

        <div class="record-row"><span class="k">Average daily consumption</span><span class="v">${fmtMinutes(avgDailyMinutes)}</span></div>

        <div class="record-row"><span class="k">Average task completion rate</span><span class="v">${avgCompletion}%</span></div>

        <div class="record-row"><span class="k">Total lifetime</span><span class="v">${fmtMinutes(lifetime.minutes)} · ${lifetime.episodes} ep · ${lifetime.chapters} ch · ${lifetime.movies} mv · ${lifetime.issues} is</span></div>

      </div>

    </div>

  `;

}

function statCard(label, t){

  return `<div class="stat-box">

    <div class="lbl" style="margin-bottom:8px;">${label}</div>

    <div class="num" style="font-size:20px;">${fmtMinutes(t.minutes)}</div>

    <div style="font-size:12px; color:var(--text-dim); margin-top:6px; line-height:1.7;">

      ${t.episodes} episodes · ${t.chapters} chapters<br>${t.movies} movies · ${t.issues} issues

    </div>

  </div>`;

}

async function deleteCloudAccount(){
  if(!AUTH_USER||!supabase){alert('No cloud account is currently signed in.');return;}
  const email=AUTH_USER.email||'';
  if(!confirm(`Delete your MediaFlow account${email?` (${email})`:''}?\n\nThis permanently deletes the account and MediaFlow cloud data.`))return;
  if(prompt('Type DELETE to permanently confirm account deletion.','')!=='DELETE'){alert('Account deletion cancelled.');return;}
  try{
    const {error}=await supabase.rpc('delete_my_account');
    if(error)throw error;
    AUTH_USER=null; AUTH_READY=false;
    try{localStorage.removeItem(STATE_KEY);}catch(e){}
    renderAuthScreen('login','Your account and MediaFlow cloud data were deleted.');
  }catch(e){console.error(e);alert('Account deletion was not completed. Add the delete_my_account Supabase RPC function first. Your account was not deleted.');}
}

function cloneDefaults(value){ return JSON.parse(JSON.stringify(value)); }
function resetSettingsSection(section){
  if(section==='daily'){
    S.settings.dailyMinutes=DEFAULT_SETTINGS.dailyMinutes;
    S.settings.tasksPerDay=DEFAULT_SETTINGS.tasksPerDay;
    S.settings.intensity=DEFAULT_SETTINGS.intensity;
  }else if(section==='titles'){
    S.settings.exactTitleRecommendations=DEFAULT_SETTINGS.exactTitleRecommendations;
  }else if(section==='scheduler'){
    ['neglectRate','neglectCap','repetitionPenalty','consecutivePenalty','saturationWeight','seasonalBonus','randomness','seasonalFreshCount'].forEach(k=>S.settings[k]=DEFAULT_SETTINGS[k]);
  }else if(section==='leveling'){
    S.settings.leveling=cloneDefaults(DEFAULT_SETTINGS.leveling);
  }else if(section==='appearance'){
    S.settings.theme=DEFAULT_SETTINGS.theme;
  }else if(section==='backups'){
    S.settings.backup=cloneDefaults(DEFAULT_SETTINGS.backup);
  }else if(section==='mal'){
    S.malLink={username:'',mode:'anime'};
  }
  persistSettings();
  render();
  showToast('Section restored to defaults');
}

const App = {

  setView(v){ S.view=v; render(); },
  openProfile(){ S.profileReturnView=S.view==='profile'?'dashboard':S.view; S.view='profile'; render(); },
  backFromProfile(){ S.view=S.profileReturnView||'dashboard'; render(); },

  startSession, endSession, rotateTask, skipTask, openLogForm, cancelLogForm, submitLog,

  toggleReasonDetail(){ S.showReasonDetail=!S.showReasonDetail; render(); },

  updateLogDraft(k,v){ S.logDraft[k]=v; if(k==='amount'||k==='minutes') refreshXPPreview(); },

  updateEntryDraft(k,v){ S.entryDraft[k]=v; if(k==='title') renderLogSuggestions(); },

  selectLogTitle(id){
    const item=S.library.find(i=>i.id===id);
    if(!item || item.status==='completed' || item.status==='dropped') return;
    S.entryDraft.title=cleanTitle(item.title);
    S.entryDraft.libraryId=item.id;
    render();
  },

  addLogEntry(){

    const title=(S.entryDraft.title||'').trim();
    if(!title) return;

    const qty=Math.max(1,Number(S.entryDraft.qty)||1);
    const cat=getCategory(S.currentTask.categoryId);
    let match=S.entryDraft.libraryId ? S.library.find(i=>i.id===S.entryDraft.libraryId) : null;
    if(!match) match=findLibraryMatch(cat.id,title);
    // If the title exists in another category, use that Library entry instead
    // of creating a duplicate. This is especially important for Manga, TV,
    // Movies, Manhwa, Comics, and custom categories.
    if(!match){
      const normalized=cleanTitle(title).toLowerCase();
      match=S.library.find(i=>i && i.status!=='completed' && i.status!=='dropped' && cleanTitle(i.title).toLowerCase()===normalized) || null;
    }
    let isNew=false;

    if(!match){
      match={
        id:uid(),
        title,
        categoryId:cat.id,
        progress:0,
        total:null,
        status:'active',
        priority:'medium',
        estimatedMinutes:null,
        tags:['manual'],
        source:'manual', createdAt:Date.now(), completedAt:null
      };
      S.library.push(match);
      isNew=true;
      awardLibraryAdditionXP(match.id);
      persistLibrary();
    }

    S.logDraft.entries=S.logDraft.entries||[];
    S.logDraft.entries.push({title,qty,libraryId:match.id,isNew});
    S.entryDraft={title:'',qty:1,libraryId:null};
    render();

  },

  removeLogEntry(idx){

    S.logDraft.entries.splice(idx,1); render();

  },

  updateLogEntryDetail(idx,key,value){

    const entry=(S.logDraft.entries||[])[idx];
    if(!entry||!entry.libraryId) return;

    const item=S.library.find(i=>i.id===entry.libraryId);
    if(!item) return;

    if(key==='title'){
      const title=String(value||'').trim();
      if(title){ item.title=title; entry.title=title; }
    }else if(key==='progress'){
      item.progress=Math.max(0,Number(value)||0);
    }else if(key==='total'){
      item.total=value===''?null:Math.max(0,Number(value)||0);
    }else if(key==='status'){
      item.status=value;
    }else if(key==='priority'){
      item.priority=value;
    }else if(key==='estimatedMinutes'){
      item.estimatedMinutes=value===''?null:Math.max(0,Number(value)||0);
    }else if(key==='tags'){
      item.tags=String(value||'').split(',').map(t=>t.trim()).filter(Boolean);
    }

    normalizeSeasonalLibraryItems();
    persistLibrary();

  },

  syncAmountFromEntries(){
    const entries=S.logDraft.entries||[];
    const amount=entriesTotal(entries);
    S.logDraft.amount=amount;
    const cat=getCategory(S.logDraft.categoryId||S.currentTask?.categoryId||'');
    if(cat) S.logDraft.minutes=Math.round(amount*(Number(cat.minutesPerUnit)||0));
    render();
  },

  toggleUpdateLibrary(v){ S.logDraft.updateLibrary = v; },

  setHistFilter(k,v){ S.histFilters[k]=v; S.histPage=0; render(); },

  setHistPage(page){ S.histPage=Math.max(0, Number(page)||0); render(); },

  setLibFilter(k,v,live){
    S.histFilters[k]=v;
    if(k==='libSearch' && live){
      const input=document.activeElement;
      const pos=input && input.selectionStart!=null ? input.selectionStart : String(v).length;
      render();
      const next=document.querySelector('.lib-search');
      if(next){ next.focus(); try{ next.setSelectionRange(pos,pos); }catch(e){} }
      return;
    }
    if(k==='libSearch') S.libPage=0;
    render();
  },
  setLibPage(page){
    S.libPage=Math.max(0, Number(page)||0);
    render();
    const anchor=document.querySelector('.lib-search');
    if(anchor && document.activeElement!==anchor){}
  },

  setIntensity(k){

    const p = INTENSITY_PRESETS[k];

    S.settings.intensity=k; S.settings.tasksPerDay=p.tasksPerDay; S.settings.dailyMinutes=p.dailyMinutes;

    persistSettings(); render();

  },

  toggleExactTitleRecommendations(){
    S.settings.exactTitleRecommendations=!S.settings.exactTitleRecommendations;
    if(S.sessionActive && S.currentTask){
      const cat=getCategory(S.currentTask.categoryId);
      const picked=S.settings.exactTitleRecommendations ? pickLibraryTitle(cat) : null;
      S.currentTask.libraryId=picked?picked.id:null;
      S.currentTask.title=picked?cleanTitle(picked.title):null;
      persistTask();
    }
    persistSettings(); render();
  },

  resetSettingsSection(section){ resetSettingsSection(section); },
  resetAllSettings(){ resetAllSettings(); },

  updateSetting(key, val){

    const num = Number(val);

    S.settings[key] = isNaN(num) ? val : num;

    persistSettings(); render();

  },

  updateLeveling(key,val){
    S.settings.leveling=S.settings.leveling||cloneDefaults(DEFAULT_SETTINGS.leveling);
    if(key==='enabled') S.settings.leveling.enabled=!!val;
    else S.settings.leveling[key]=Math.max(0,Number(val)||0);
    persistSettings(); render();
  },
  updateLevelingUnit(key,val){
    S.settings.leveling=S.settings.leveling||cloneDefaults(DEFAULT_SETTINGS.leveling);
    S.settings.leveling.unitXP=S.settings.leveling.unitXP||{};
    S.settings.leveling.unitXP[key]=Math.max(0,Number(val)||0);
    persistSettings(); render();
  },
  updateLevelingRotation(key,val){
    S.settings.leveling=S.settings.leveling||cloneDefaults(DEFAULT_SETTINGS.leveling);
    S.settings.leveling.rotationMultiplier=S.settings.leveling.rotationMultiplier||{};
    S.settings.leveling.rotationMultiplier[key]=Math.max(0,Number(val)||0);
    persistSettings(); render();
  },

  toggleCategory(id){

    const c = S.categories.find(c=>c.id===id); if(!c) return;

    c.enabled = !c.enabled; persistCategories(); render();

  },

  openCategoryModal(id){

    const data = id ? Object.assign({}, getCategory(id)) : {name:'', icon:'✨', type:'video', unit:'episodes', target:5, weight:3, minutesPerUnit:20, color:COLOR_CHOICES[0], enabled:true, seasonal:false};

    S.modal = {type:'category', data}; render();

  },

  pickIcon(ic){ document.getElementById('m-icon').value = ic; S.modal.data.icon = ic; renderModal(); },

  pickColor(c){ document.getElementById('m-color').value = c; S.modal.data.color = c; renderModal(); },

  saveCategoryModal(id){

    const data = {

      id: id || uid(),

      name: document.getElementById('m-name').value.trim() || 'Untitled category',

      icon: document.getElementById('m-icon').value || '✨',

      type: document.getElementById('m-type').value,

      unit: document.getElementById('m-unit').value,

      target: Math.max(1, Number(document.getElementById('m-target').value)||1),

      weight: clamp(Number(document.getElementById('m-weight').value)||3,1,5),

      minutesPerUnit: Math.max(1, Number(document.getElementById('m-mpu').value)||20),

      seasonal: document.getElementById('m-seasonal').checked,

      color: document.getElementById('m-color').value,

      enabled: document.getElementById('m-enabled').checked,

      custom: true,

    };

    const idx = S.categories.findIndex(c=>c.id===id);

    if(idx>=0) S.categories[idx] = Object.assign({}, S.categories[idx], data);

    else S.categories.push(data);

    persistCategories(); S.modal=null; render();

  },

  deleteCategory(id){

    if(!confirm('Delete this category? Past history stays but will show as removed.')) return;

    S.categories = S.categories.filter(c=>c.id!==id);

    persistCategories(); render();

  },

  openLibraryModal(id){

    const data = id ? Object.assign({}, S.library.find(i=>i.id===id)) : {categoryId:S.categories[0]?.id, progress:0, status:'planned', priority:'medium', tags:[]};

    S.modal = {type:'library', data}; render();

  },

  saveLibraryModal(id){

    const tagsRaw = document.getElementById('l-tags').value;

    const data = {
