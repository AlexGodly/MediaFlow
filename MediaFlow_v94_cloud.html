async function deleteCloudAccount(){
  if(!AUTH_USER||!supabase){alert('No cloud account is currently signed in.');return;}
  const email=AUTH_USER.email||'';
  if(!confirm(`Delete your MediaFlow account${email?` (${email})`:''}?\n\nThis permanently deletes the account and MediaFlow cloud data.`))return;
  if(prompt('Type DELETE to permanently confirm account deletion.','')!=='DELETE'){alert('Account deletion cancelled.');return;}
  try{
    const {error}=await supabase.rpc('delete_my_account');
    if(error)throw error;
    AUTH_USER=null; AUTH_READY=false;
    try{localStorage.removeItem(STATE_KEY);}catch(e){}
    renderAuthScreen('login','Your account and MediaFlow cloud data were deleted.');
  }catch(e){console.error(e);alert('Account deletion was not completed. Add the delete_my_account Supabase RPC function first. Your account was not deleted.');}
}

function cloneDefaults(value){ return JSON.parse(JSON.stringify(value)); }
function resetSettingsSection(section){
  if(section==='daily'){
    S.settings.dailyMinutes=DEFAULT_SETTINGS.dailyMinutes;
    S.settings.tasksPerDay=DEFAULT_SETTINGS.tasksPerDay;
    S.settings.intensity=DEFAULT_SETTINGS.intensity;
  }else if(section==='titles'){
    S.settings.exactTitleRecommendations=DEFAULT_SETTINGS.exactTitleRecommendations;
  }else if(section==='scheduler'){
    ['neglectRate','neglectCap','repetitionPenalty','consecutivePenalty','saturationWeight','seasonalBonus','randomness','seasonalFreshCount'].forEach(k=>S.settings[k]=DEFAULT_SETTINGS[k]);
  }else if(section==='leveling'){
    S.settings.leveling=cloneDefaults(DEFAULT_SETTINGS.leveling);
  }else if(section==='appearance'){
    S.settings.theme=DEFAULT_SETTINGS.theme;
  }else if(section==='backups'){
    S.settings.backup=cloneDefaults(DEFAULT_SETTINGS.backup);
  }else if(section==='mal'){
    S.malLink={username:'',mode:'anime'};
  }
  persistSettings();
  render();
  showToast('Section restored to defaults');
}
function resetAllSettings(){
  S.settings=cloneDefaults(DEFAULT_SETTINGS);
  S.malLink={username:'',mode:'anime'};
  persistSettings();
  restartBackupTimer();
  applyTheme(S.settings.theme);
  render();
  showToast('All settings restored to defaults');
}
function defaultButton(section){

}

/* v74: ↑/↓ and drag ordering now persist an explicit categoryOrder to cloud. */
function v72MoveCategory(id, direction){
  const idx=S.categories.findIndex(c=>c.id===id);
  if(idx<0) return;
  const next=idx+Number(direction||0);
  if(next<0 || next>=S.categories.length) return;
  [S.categories[idx],S.categories[next]]=[S.categories[next],S.categories[idx]];
  persistCategories();
  render();
}

let V73_CAT_DRAG=null;
function v73CategoryDragStart(ev,id){
  if(!ev || ev.button>0) return;
  const row=ev.currentTarget?.closest('.cat-manage-row');
  if(!row) return;
  ev.preventDefault();
  V73_CAT_DRAG={id,row,pointerId:ev.pointerId};
  row.classList.add('v73-dragging');
  try{ev.currentTarget.setPointerCapture(ev.pointerId);}catch(_){ }
  document.addEventListener('pointermove',v73CategoryDragMove,{passive:false});
  document.addEventListener('pointerup',v73CategoryDragEnd,{once:true});
  document.addEventListener('pointercancel',v73CategoryDragEnd,{once:true});
}
function v73CategoryDragMove(ev){
  if(!V73_CAT_DRAG || ev.pointerId!==V73_CAT_DRAG.pointerId) return;
  ev.preventDefault();
  const el=document.elementFromPoint(ev.clientX,ev.clientY);
  const target=el?.closest?.('.cat-manage-row');
  const row=V73_CAT_DRAG.row;
  if(!target || target===row || target.parentElement!==row.parentElement) return;
  const r=target.getBoundingClientRect();
  target.parentElement.insertBefore(row,ev.clientY < r.top+r.height/2 ? target : target.nextSibling);
}
function v73CategoryDragEnd(ev){
  if(!V73_CAT_DRAG || (ev?.pointerId!=null && ev.pointerId!==V73_CAT_DRAG.pointerId)) return;
  document.removeEventListener('pointermove',v73CategoryDragMove);
  const row=V73_CAT_DRAG.row;
  row?.classList.remove('v73-dragging');
  const parent=row?.parentElement;
  if(parent){
    const ids=[...parent.querySelectorAll(':scope > .cat-manage-row[data-category-id]')].map(x=>x.dataset.categoryId);
    if(ids.length===S.categories.length){
      const byId=new Map(S.categories.map(c=>[c.id,c]));
      S.categories=ids.map(id=>byId.get(id)).filter(Boolean);
      persistCategories();
    }
  }
  V73_CAT_DRAG=null;
  render();
}

function renderModal(){

  let el = document.getElementById('modal-root');

  if(!S.modal){ if(el) el.remove(); return; }
  // v77: there must only ever be one modal root. Replacing it prevents stacked popups.
  if(el) el.remove();

  const html = S.modal.type==='category' ? categoryModalHtml(S.modal.data)

    : S.modal.type==='session' ? sessionModalHtml(S.modal.data)

    : S.modal.type==='libraryDelete' ? libraryDeleteModalHtml(S.modal.data)

    : S.modal.type==='categoryDelete' ? categoryDeleteModalHtml(S.modal.data)

    : S.modal.type==='emptyLibrary' ? emptyLibraryModalHtml(S.modal.data)

    : S.modal.type==='priority' ? priorityModalHtml(S.modal.data)

    : S.modal.type==='libraryStatus' ? libraryStatusModalHtml(S.modal.data)

    : S.modal.type==='libraryCategory' ? libraryCategoryModalHtml(S.modal.data)

    : S.modal.type==='importMapping' ? v91MappingModalHtml(S.modal.data)
    : S.modal.type==='importConfirm' ? mfImportConfirmModalHtml(S.modal.data)
    : S.modal.type==='coverPicker' ? coverPickerModalHtml(S.modal.data)
    : libraryModalHtml(S.modal.data);

  const wrap = document.createElement('div');

  wrap.id = 'modal-root';

  wrap.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) App.closeModal()"><div class="modal">${html}</div></div>`;

  document.body.appendChild(wrap);

}

    <div class="field-row">

      <div class="field"><label class="field-label">Status</label>

        <select id="l-status">${['planned','active','paused','completed','dropped'].map(s=>`<option value="${s}" ${d.status===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select>

      </div>

    </div>

    <div class="field"><label class="field-label">Estimated minutes (optional)</label><input type="number" id="l-est" min="0" value="${d.estimatedMinutes||''}"></div>

    <div class="field"><label class="field-label">Tags (comma separated)</label><input type="text" id="l-tags" value="${(d.tags||[]).join(', ')}"></div>

      <div>
        ${!isNew ? `<button type="button" class="btn btn-danger" onclick="event.preventDefault(); event.stopPropagation(); App.deleteLibraryItem('${d.id}')">Delete title</button>` : ''}
      </div>

        <button type="button" class="btn btn-primary" onclick="event.preventDefault(); App.saveLibraryModal('${d.id||''}')">Save title</button>
      </div>

    </div>

  `;

}

  importMalXml(file){
    if(!file) return;

    const reader=new FileReader();
    reader.onload=async ()=>{
      try{
        const text=reader.result||'';
        const isManga=/<manga(?:\s|>)/i.test(text);
        const tag=isManga?'manga':'anime';

        // Avoid DOMParser's giant synchronous DOM allocation. Scan one MAL entry at a time.
        const re=new RegExp(`<${tag}(?:\\s[^>]*)?>([\\s\\S]*?)</${tag}>`,'gi');
        const blocks=[];
        let m;
        while((m=re.exec(text))!==null) blocks.push(m[1]);

        if(blocks.length===0){
          finishImportProgress(false,'Import failed','No entries found. Make sure this is a MAL list export XML.');
          return;
        }

        const statusMap={'Watching':'active','Reading':'active','Completed':'completed','On-Hold':'paused','Dropped':'dropped','Plan to Watch':'planned','Plan to Read':'planned'};
        const getTag=(block,name)=>{
          const x=block.match(new RegExp(`<${name}[^>]*>([\\s\\S]*?)</${name}>`,'i'));
          return x?cleanTitle(x[1]):'';
        };

        showImportProgress(`Importing MyAnimeList ${isManga?'manga':'anime'}`,blocks.length);

        let added=0,updated=0,skipped=0;
        const BATCH=30;
        const SAVE_EVERY=210;

        for(let r=0;r<blocks.length;r+=BATCH){
          const endBatch=Math.min(r+BATCH,blocks.length);

          for(let j=r;j<endBatch;j++){
            const block=blocks[j];
            const title=getTag(block,isManga?'manga_title':'series_title');
            if(!title){skipped++;continue;}

            const seriesType=getTag(block,'series_type').toLowerCase();
            const progress=Number(getTag(block,isManga?'my_read_chapters':'my_watched_episodes'))||0;
            const total=Number(getTag(block,isManga?'series_chapters':'series_episodes'))||null;
            const malStatus=getTag(block,'my_status');
            const status=statusMap[malStatus]||'planned';

            let categoryId=isManga?'manga':'backlog';
            if(isManga&&/manhwa|manhua/.test(seriesType)) categoryId='manhwa';
            if(!isManga){
              if(seriesType==='movie') categoryId='animemovies';
              else if(seriesType==='tv'&&/currently airing/i.test(getTag(block,'series_status'))) categoryId='seasonal';
            }
            if(!S.categories.find(c=>c.id===categoryId)) categoryId=isManga?'manga':'backlog';

            const existing=S.library.find(i=>cleanTitle(i.title).toLowerCase()===title.toLowerCase()&&i.categoryId===categoryId);
            if(existing){
              existing.progress=progress;
              if(total) existing.total=total;
              existing.status=status;
              existing.source='mal';
              updated++;
            }else{
              S.library.push({
                id:uid(),title,categoryId,progress,total,status,
                priority:'medium',estimatedMinutes:null,tags:['MAL'],source:'mal'
              });
              added++;
            }
          }

          const done=endBatch;
          updateImportProgress(done,blocks.length,added,updated,skipped,`Processing entries ${done.toLocaleString()} of ${blocks.length.toLocaleString()}...`);

          if(done%SAVE_EVERY===0 || done===blocks.length) await saveState();
          await yieldToBrowser();
        }

        finishImportProgress(true,'Import successful',`MyAnimeList: ${added} added, ${updated} updated${skipped?', '+skipped+' skipped':''}.`);
        render();
      }catch(e){
        console.error('MAL import failed',e);
        closeImportProgress();
        alert("Couldn't parse that file as a MAL export XML.");
      }
    };
    reader.readAsText(file);
  },

  importCsv(file){
    if(!file) return;

    const reader=new FileReader();
    reader.onload=async ()=>{
      try{
        const text=reader.result||'';
        if(!text.trim()){alert('That CSV looks empty.');return;}

        // Incremental CSV parser: it keeps its cursor and yields between batches,
        // so a very large file does not monopolize the main UI thread.
        const parser={i:0,row:[],field:'',inQuotes:false,done:false};
        const nextRows=(maxRows)=>{
          const out=[];
          while(parser.i<text.length&&out.length<maxRows){
            const c=text[parser.i++];
            if(parser.inQuotes){
              if(c==='"'){
                if(text[parser.i]==='"'){parser.field+='"';parser.i++;}
                else parser.inQuotes=false;
              }else parser.field+=c;
            }else{
              if(c==='"') parser.inQuotes=true;
              else if(c===','){parser.row.push(parser.field);parser.field='';}
              else if(c==='\\n'){
                parser.row.push(parser.field);parser.field='';
                if(parser.row.some(f=>f&&f.trim())) out.push(parser.row);
                parser.row=[];
              }else if(c==='\\r'){
                // Ignore CR. LF terminates the row.
              }else parser.field+=c;
            }
          }

          if(parser.i>=text.length&&!parser.done){
            if(parser.field.length||parser.row.length){
              parser.row.push(parser.field);
              if(parser.row.some(f=>f&&f.trim())) out.push(parser.row);
            }
            parser.row=[];parser.field='';parser.done=true;
          }
          return out;
        };

        const first=nextRows(1);
        if(first.length===0){alert('That CSV looks empty.');return;}

        const header=first[0].map(h=>h.trim().toLowerCase());
        const find=(...names)=>header.findIndex(h=>names.some(n=>h.includes(n)));
        const iTitle=find('title','name');
        const iProgress=find('progress','watched','read','chapters_read','episodes_watched');
        const iTotal=find('total','episodes','chapters');
        const iStatus=find('status');

        if(iTitle<0){alert('Could not find a "title" column in that CSV.');return;}

        // Newline count is an intentionally cheap estimate for the progress bar.
        const estimatedTotal=Math.max(1,(text.match(/\\n/g)||[]).length);
        showImportProgress('Importing CSV',estimatedTotal);

        let processed=0,added=0,updated=0,skipped=0;
        const BATCH=40;
        const SAVE_EVERY=200;

        while(!parser.done){
          const rows=nextRows(BATCH);
          if(rows.length===0){await yieldToBrowser();continue;}

          for(const row of rows){
            processed++;
            if(!row||!row[iTitle]){skipped++;continue;}

            const title=cleanTitle(row[iTitle]);
            if(!title){skipped++;continue;}

            const progress=iProgress>=0?Number(row[iProgress])||0:0;
            const total=iTotal>=0&&row[iTotal]?Number(row[iTotal])||null:null;
            const rawStatus=iStatus>=0?row[iStatus].trim().toLowerCase():'';
            const status=/complet/.test(rawStatus)?'completed':
              /watch|read|active|progress/.test(rawStatus)?'active':
              /hold|pause/.test(rawStatus)?'paused':
              /drop/.test(rawStatus)?'dropped':'planned';

            const categoryId=S.categories.find(c=>c.enabled)?.id||S.categories[0]?.id;
            if(!categoryId){skipped++;continue;}

            const existing=S.library.find(i=>cleanTitle(i.title).toLowerCase()===title.toLowerCase());
            if(existing){
              existing.progress=progress;
              if(total) existing.total=total;
              existing.status=status;
              existing.source='simkl';
              updated++;
            }else{
              S.library.push({
                id:uid(),title,categoryId,progress,total,status,
                priority:'medium',estimatedMinutes:null,tags:['imported'],source:'simkl'
              });
              added++;
            }
          }

          updateImportProgress(processed,estimatedTotal,added,updated,skipped,`Processing rows... ${processed.toLocaleString()} processed`);
          if(processed%SAVE_EVERY<BATCH) await saveState();
          await yieldToBrowser();
        }

        await saveState();
        finishImportProgress(true,`Import successful`,`Imported ${added} added, ${updated} updated${skipped?', '+skipped+' skipped':''}.`);
        render();
      }catch(e){
        console.error('CSV import failed',e);
        finishImportProgress(false,'Import failed',"Couldn't parse that CSV file.");
      }
    };
    reader.readAsText(file);
  },

  exportCSV(){

    const header = ['date','time','category','target','actual','unit','minutes','status','note'];

    const rows = S.sessions.slice().sort((a,b)=>a.timestamp-b.timestamp).map(s=>{

      const cat = getCategory(s.categoryId);

      const d = new Date(s.timestamp);

      return [s.date, d.toLocaleTimeString(), cat.name, s.targetAmount, s.actualAmount, s.unit, s.minutes, s.status, (s.note||'').replace(/,/g,';')];

    });

    const csv = [header.join(','), ...rows.map(r=>r.join(','))].join('\n');

    triggerDownload(new Blob([csv],{type:'text/csv'}), `mediaflow-history-${todayISO()}.csv`);

  },

  resetAll(){

    if(!confirm('This deletes ALL MediaFlow data — categories, library, history, settings. This cannot be undone. Continue?')) return;

    S.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));

    S.library = []; S.sessions = []; S.settings = Object.assign({}, DEFAULT_SETTINGS);

    S.currentTask = null; S.sessionActive = false;

    persistCategories(); persistLibrary(); persistSessions(); persistSettings(); persistTask();

    render();

  },

};

function parseCsvText(text){

  const rows = []; let row=[]; let field=''; let inQuotes=false;

  for(let i=0;i<text.length;i++){

    const c = text[i];

    if(inQuotes){

      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }

      else field+=c;

    } else {

      if(c==='"') inQuotes=true;

      else if(c===','){ row.push(field); field=''; }

      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }

      else if(c==='\r'){ /* skip */ }

      else field+=c;

    }

  }

  if(field.length || row.length){ row.push(field); rows.push(row); }

  return rows.filter(r=>r.some(f=>f&&f.trim()));

}

function updateImportProgress(done,total,added,updated,skipped,phase){

const SIDEBAR_WIDTH_KEY='mf_sidebar_width';
const SIDEBAR_MIN=190, SIDEBAR_MAX=380;
function applySidebarWidth(width){
  const w=Math.max(SIDEBAR_MIN,Math.min(SIDEBAR_MAX,Number(width)||236));
  document.documentElement.style.setProperty('--sidebar-width',w+'px');
  try{localStorage.setItem(SIDEBAR_WIDTH_KEY,String(w));}catch(e){}
  return w;
}
function loadSidebarWidth(){try{const v=Number(localStorage.getItem(SIDEBAR_WIDTH_KEY));if(v)applySidebarWidth(v);}catch(e){}}
let sidebarResizeState=null;
function beginSidebarResize(e){
  if(window.innerWidth<=860)return;
  e.preventDefault();
  e.stopPropagation();
  const handle=e.currentTarget||document.querySelector('.sidebar-resizer');
  const sidebar=document.querySelector('.sidebar');
  if(!sidebar)return;
  sidebarResizeState={startX:e.clientX,startWidth:sidebar.getBoundingClientRect().width,handle};
  document.body.classList.add('sidebar-resizing');
  if(handle?.setPointerCapture && e.pointerId!=null){try{handle.setPointerCapture(e.pointerId);}catch(err){}}
  handle?.addEventListener('pointermove',onSidebarResize);
  handle?.addEventListener('pointerup',endSidebarResize,{once:true});
  handle?.addEventListener('pointercancel',endSidebarResize,{once:true});
}
function onSidebarResize(e){
  if(!sidebarResizeState)return;
  e.preventDefault();
  applySidebarWidth(sidebarResizeState.startWidth+(e.clientX-sidebarResizeState.startX));
}
function endSidebarResize(e){
  const state=sidebarResizeState;
  sidebarResizeState=null;
  document.body.classList.remove('sidebar-resizing');
  if(state?.handle){
    state.handle.removeEventListener('pointermove',onSidebarResize);
    try{if(e?.pointerId!=null && state.handle.releasePointerCapture)state.handle.releasePointerCapture(e.pointerId);}catch(err){}
  }
}
window.beginSidebarResize=beginSidebarResize;
window.onSidebarResize=onSidebarResize;
window.endSidebarResize=endSidebarResize;
function bindSidebarResizer(){
  const handle=document.querySelector('.sidebar-resizer');
  if(!handle||handle.dataset.bound==='1')return;
  handle.dataset.bound='1';
  handle.addEventListener('pointerdown',beginSidebarResize);
  handle.addEventListener('dblclick',()=>applySidebarWidth(236));
  handle.addEventListener('keydown',e=>{
    if(window.innerWidth<=860)return;
    const current=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width'))||236;
    if(e.key==='ArrowLeft'){e.preventDefault();applySidebarWidth(current-12);}
    if(e.key==='ArrowRight'){e.preventDefault();applySidebarWidth(current+12);}
    if(e.key==='Home'){e.preventDefault();applySidebarWidth(SIDEBAR_MIN);}
    if(e.key==='End'){e.preventDefault();applySidebarWidth(SIDEBAR_MAX);}
  });
}
function autoFitSidebarToProfile(){
  if(window.innerWidth<=860)return;
  const sidebar=document.querySelector('.sidebar');
  const name=document.querySelector('.account-menu-email');
  if(!sidebar||!name)return;
  const text=String(name.textContent||'').trim();
  // Fit normal names/emails while keeping the sidebar compact. Long emails are capped.
  const target=Math.max(236,Math.min(SIDEBAR_MAX,Math.ceil(text.length*7.1+154)));
  const current=sidebar.getBoundingClientRect().width;
  if(current<target)applySidebarWidth(target);
}

async function malFetchPage(username,type,page){
  const candidates=[
    `https://api.jikan.moe/v4/users/${encodeURIComponent(username)}/${type}list?page=${page}&limit=300`,
    `https://api.jikan.moe/v4/users/${encodeURIComponent(username)}/${type}list/full?page=${page}`
  ];
  let lastErr=null;
  for(const url of candidates){
    for(let attempt=0;attempt<5;attempt++){
      try{
        const r=await fetch(url,{headers:{Accept:'application/json'}});
        if(r.ok)return await r.json();
        lastErr=new Error(`MAL ${type} sync failed (${r.status})`);
        if(![408,429,500,502,503,504].includes(r.status))throw lastErr;
        const ra=Number(r.headers.get('Retry-After'))||0;
        await new Promise(resolve=>setTimeout(resolve,ra>0?ra*1000:Math.min(15000,1200*2**attempt)));
      }catch(e){
        lastErr=e;
        if(attempt<4)await new Promise(resolve=>setTimeout(resolve,Math.min(15000,1200*2**attempt)));
      }
    }
  }
  throw lastErr||new Error(`MAL ${type} sync failed`);
}
async function malSync(){
  const username=(S.malLink?.username||'').trim();
  if(!username){alert('Enter your MyAnimeList username first.');return;}
  const mode=S.malLink.mode||'anime', types=mode==='both'?['anime','manga']:[mode];
  showImportProgress('MAL sync',0);
  updateImportProgress(0,0,0,0,0,'Starting…');
  let total=0,added=0,updated=0;
  try{
    for(const type of types){
      let page=1,hasNext=true;
      while(hasNext){
        updateImportProgress(1,`Fetching ${type} page ${page}…`);
        const j=await malFetchPage(username,type,page), rows=Array.isArray(j.data)?j.data:[];
        const apiTotal=Number(j.pagination?.items?.total)||0;
        const knownTotal=Number.isFinite(apiTotal)&&apiTotal>0?apiTotal:0;
        const pageDoneBefore=total;
        for(let offset=0;offset<rows.length;offset+=20){
          const batch=rows.slice(offset,offset+20);
          for(const row of batch){
            const d=row.node||row||{}, my=row.list_status||row.listStatus||{}, title=cleanTitle(d.title);
            if(!title)continue;
            const catId=type==='manga'?'manga':(d.airing?'seasonal':'backlog');
            const prog=Number(my.num_episodes_watched??my.num_chapters_read??0)||0;
            const tot=Number(d.num_episodes??d.num_chapters??0)||null;
            let item=S.library.find(i=>cleanTitle(i.title).toLowerCase()===title.toLowerCase()&&['backlog','seasonal','manga'].includes(i.categoryId));
            if(!item){
              item={id:uid(),title,categoryId:catId,progress:prog,total:tot,status:my.status==='completed'?'completed':(my.status==='watching'||my.status==='reading'?'active':'planned'),priority:'medium',estimatedMinutes:null,tags:['MAL'],source:'mal'};
              S.library.push(item);added++;
            }else{
              item.progress=Math.max(Number(item.progress)||0,prog);
              if(tot)item.total=tot;
              if(catId==='seasonal'&&item.status!=='completed')item.categoryId='seasonal';
              item.tags=[...new Set([...(item.tags||[]),'MAL'])]; item.source='mal'; updated++;
            }
          }
          total+=batch.length;
          const progressTotal=knownTotal>0?knownTotal:Math.max(total,1);
          const progressDone=knownTotal>0?Math.min(total,knownTotal):total;
          updateImportProgress(progressDone,progressTotal,added,updated,0,`Processed ${total.toLocaleString()} ${type} titles…`);
          await yieldToBrowser();
        }
        hasNext=!!j.pagination?.has_next; page++;
        await new Promise(resolve=>setTimeout(resolve,750));
      }
    }
    normalizeSeasonalLibraryItems(); await persistLibrary();
    finishImportProgress(true,'MAL sync complete',`Added ${added}, updated ${updated}, processed ${total} titles.`); render();
  }catch(e){console.error(e);finishImportProgress(false,'MAL sync failed',e.message||String(e));}
}

function mfCsvParse(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cell+=c}if(cell||row.length){row.push(cell);if(row.some(x=>x.trim()))rows.push(row)}if(!rows.length)return[];const h=rows[0].map(x=>x.trim().toLowerCase().replace(/^\ufeff/,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''));return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]??'').trim()]))) }

/* MediaFlow v81 — Repeat Consumption (Rewatch / Reread) */
function v81RepeatTotals(){
  const byTitle=new Map(); let sessions=0,minutes=0,episodes=0,chapters=0,issues=0,movies=0;
  for(const sess of (S.sessions||[])){
    let sessionHadRepeat=false;
    for(const t of (sess.titles||[])){
      if(!t?.repeat) continue;
      sessionHadRepeat=true;
      const item=t.libraryId?S.library.find(i=>i.id===t.libraryId):null;
      const key=item?.id||t.libraryId; if(!key) continue;
      const unit=getCategory(item?.categoryId||sess.categoryId)?.unit||sess.unit||'units';
      const amount=Math.max(0,Number(t.qty)||0);
      const rec=byTitle.get(key)||{title:cleanTitle(t.title),amount:0,loggedAmount:0,manualAmount:0,unit,total:Number(item?.total)||0,completedRepeats:0};
      rec.loggedAmount+=amount; rec.amount+=amount; rec.total=Number(item?.total)||rec.total||0; rec.unit=unit;
      byTitle.set(key,rec);
      if(unit==='episodes')episodes+=amount; else if(unit==='chapters')chapters+=amount; else if(unit==='issues')issues+=amount; else if(unit==='movies')movies+=amount;
    }
    if(sessionHadRepeat){ sessions++; minutes+=Math.max(0,Number(sess.minutes)||0); }
  }
  // v83: manual past repeats live on the Library title. They count as lifetime repeat
  // consumption, but deliberately create no History session, XP, minutes, streak, or scheduler activity.
  for(const item of (S.library||[])){
    const manual=Math.max(0,Math.floor(Number(item.manualRepeatAmount)||0)); if(!manual) continue;
    const unit=getCategory(item.categoryId)?.unit||'units';
    const rec=byTitle.get(item.id)||{title:cleanTitle(item.title),amount:0,loggedAmount:0,manualAmount:0,unit,total:Number(item.total)||0,completedRepeats:0};
    rec.manualAmount=manual; rec.amount=(Number(rec.loggedAmount)||0)+manual; rec.total=Number(item.total)||0; rec.unit=unit; byTitle.set(item.id,rec);
    if(unit==='episodes')episodes+=manual; else if(unit==='chapters')chapters+=manual; else if(unit==='issues')issues+=manual; else if(unit==='movies')movies+=manual;
  }
  for(const rec of byTitle.values()) rec.completedRepeats=rec.total>0?Math.floor(rec.amount/rec.total):0;
  return {byTitle,sessions,minutes,episodes,chapters,issues,movies};
}
function v81RepeatLabel(item){
  const r=v81RepeatTotals().byTitle.get(item.id); if(!r||!r.amount)return '';
  const noun=(getCategory(item.categoryId)?.type==='reading')?'Reread':'Rewatched';
  const cycles=r.completedRepeats?` · ${r.completedRepeats} full ${r.completedRepeats===1?'repeat':'repeats'}`:'';
  return `${noun}: ${r.amount.toLocaleString()} ${unitLabel(r.unit,r.amount)}${cycles}`;
}
/* MediaFlow v82 — per-title Rewatch / Reread visibility */
function v82RepeatSummary(item,r){
  if(!r||!r.amount) return '';
  const reading=getCategory(item.categoryId)?.type==='reading';
  const action=reading?'Reread':'Rewatched';
  const total=Math.max(0,Number(r.total)||0);
  const full=total>0?Math.floor(r.amount/total):0;
  const current=total>0?(r.amount%total):r.amount;
  const unit=unitLabel(r.unit,r.amount);
  if(total>0){
    const cycleWord=reading?'reread':'rewatch';
    const parts=[`${action}: ${r.amount.toLocaleString()} ${unit}`];
    if(full) parts.push(`${full} full ${cycleWord}${full===1?'':'es'}`);
    if(current) parts.push(`${current.toLocaleString()} / ${total.toLocaleString()} toward ${cycleWord} #${full+1}`);
    else if(full) parts.push(`${cycleWord} #${full} complete`);
    return parts.join(' · ');
  }
  return `${action}: ${r.amount.toLocaleString()} ${unit} · total unknown`;
}
function v82RepeatDetailHtml(item){
  const r=v81RepeatTotals().byTitle.get(item.id)||{amount:0,loggedAmount:0,manualAmount:Math.max(0,Number(item.manualRepeatAmount)||0),unit:getCategory(item.categoryId)?.unit||'units',total:Number(item.total)||0,completedRepeats:0};
  const reading=getCategory(item.categoryId)?.type==='reading';
  const noun=reading?'Rereads':'Rewatches',verb=reading?'reread':'rewatched';
  const total=Math.max(0,Number(item.total)||0),full=total>0?Math.floor(r.amount/total):0,current=total>0?r.amount%total:r.amount;
  const currentText=total>0?(current===0&&full>0?`Re${reading?'read':'watch'} #${full} complete`:`${current.toLocaleString()} / ${total.toLocaleString()} toward ${reading?'reread':'rewatch'} #${full+1}`):`${r.amount.toLocaleString()} ${unitLabel(r.unit,r.amount)} ${verb} · title total unknown`;
  const manual=Math.max(0,Math.floor(Number(item.manualRepeatAmount)||0));

  const editFields=total>0?`<div class="v83-repeat-edit-grid"><div class="field"><label class="field-label">Manual full ${reading?'rereads':'rewatches'}</label><input type="number" id="l-repeat-full" min="0" step="1" value="${manualFull}"></div><div class="field"><label class="field-label">Extra ${escapeHtml(unitLabel(r.unit,2))}</label><input type="number" id="l-repeat-extra" min="0" max="${Math.max(0,total-1)}" step="1" value="${manualExtra}"></div></div>`:`<div class="field"><label class="field-label">Manual ${escapeHtml(unitLabel(r.unit,2))} ${verb}</label><input type="number" id="l-repeat-extra" min="0" step="1" value="${manualExtra}"></div>`;
  return `<div class="v82-repeat-panel"><div class="v82-repeat-head">↻ REWATCH / REREAD</div><div class="v82-repeat-grid"><div><b>${full.toLocaleString()}</b><small>Full ${noun.toLowerCase()}</small></div><div><b>${r.amount.toLocaleString()}</b><small>${escapeHtml(unitLabel(r.unit,r.amount))} ${verb}</small></div></div><div class="v82-repeat-current"><b>Current repeat</b><span>${escapeHtml(currentText)}</span></div><div class="v83-repeat-source"><b>Logged in MediaFlow:</b> ${(Number(r.loggedAmount)||0).toLocaleString()} · <b>Manual past repeats:</b> ${manual.toLocaleString()} ${escapeHtml(unitLabel(r.unit,manual))}</div><div class="v83-repeat-edit"><div class="v83-repeat-edit-title">EDIT PAST REPEAT HISTORY</div>${editFields}<small class="hint">Use this for rewatches/rereads from before MediaFlow or corrections. Manual values affect repeat totals only. They do not create History sessions, XP, time, streaks, or scheduler activity.</small></div></div>`;
}

function v43ApplyCustomTheme(){
  const c=S.settings.customTheme||{};const r=document.documentElement.style;
  const pairs={bg:'--mf-custom-bg',panel:'--mf-custom-panel',raised:'--mf-custom-raised',border:'--mf-custom-border',text:'--mf-custom-text',muted:'--mf-custom-muted',accent:'--mf-custom-accent'};
  Object.entries(pairs).forEach(([k,v])=>r.setProperty(v,c[k]||DEFAULT_SETTINGS.customTheme?.[k]||'#111111'));
}
applyTheme=function(theme){const t=V43_THEMES.includes(theme)?theme:'dark';if(S.settings)S.settings.theme=t;v43ApplyCustomTheme();document.documentElement.dataset.theme=t;try{localStorage.setItem('mf_theme',t);}catch(e){}};
function v43SetCustomTheme(k,v){if(!/^#[0-9a-f]{6}$/i.test(v))return;S.settings.customTheme=S.settings.customTheme||{};S.settings.customTheme[k]=v;S.settings.theme='custom';applyTheme('custom');persistSettings();render();}
function v43ResetCustomTheme(){S.settings.customTheme={bg:'#0E111A',panel:'#161B2A',raised:'#1C2334',border:'#2B3448',text:'#F4F6FB',muted:'#8D98AD',accent:'#E8A94A'};S.settings.theme='custom';applyTheme('custom');persistSettings();render();}

/* Richer activity entries. Existing entries remain readable. */
function v43DiffSnapshot(before,after){const b=new Map((before?.library||[]).map(i=>[i.id,i])),a=new Map((after?.library||[]).map(i=>[i.id,i]));const ids=new Set([...b.keys(),...a.keys()]),changes=[];for(const id of ids){const x=b.get(id),y=a.get(id);if(!x&&y)changes.push({id,title:cleanTitle(y.title),kind:'added'});else if(x&&!y)changes.push({id,title:cleanTitle(x.title),kind:'deleted'});else if(x&&y){const fields=[];for(const k of ['title','categoryId','status','priority','progress','total','rating'])if(JSON.stringify(x[k]??null)!==JSON.stringify(y[k]??null))fields.push(`${k}: ${x[k]??'—'} → ${y[k]??'—'}`);if(fields.length)changes.push({id,title:cleanTitle(y.title),kind:'changed',fields});}if(changes.length>=25)break;}return changes;}
function v50SnapshotXP(x){
  if(!x)return null;
  const sessions=Array.isArray(x.sessions)?x.sessions:[];
  const ledger=x.xpLedger||{};
  const sum=o=>Object.values(o||{}).reduce((a,v)=>a+(Number(v)||0),0);
  const sessionXP=sessions.reduce((a,s)=>{
    if(!s||s.status==='skipped')return a;
    if(Number.isFinite(Number(s.xp)))return a+Math.max(0,Number(s.xp));
    const cat=getCategory(s.categoryId);
    return a+calculateConsumptionXP(cat,Number(s.actualAmount)||0,Number(s.minutes)||0,'healthy').xp;
  },0);
  return sessionXP+sum(ledger.libraryAdditions)+sum(ledger.libraryEdits)+sum(ledger.manualCovers);
}
mfActivity=function(action,detail){
  S.activityLog=S.activityLog||[];
  const tx=(S.undoStack||[])[S.undoStack.length-1];
  const changes=tx?.before&&tx?.after?v43DiffSnapshot(tx.before,tx.after):[];
  let xpEarned=0;
  if(tx?.before&&tx?.after){
    const beforeXP=v50SnapshotXP(tx.before), afterXP=v50SnapshotXP(tx.after);
    if(beforeXP!=null&&afterXP!=null)xpEarned=Math.max(0,Math.round(afterXP-beforeXP));
  }
  const exactIds=[...new Set(changes.map(x=>x.id).filter(Boolean))];
  const titleSnapshot=exactIds.length===1?cleanTitle(S.library.find(i=>i.id===exactIds[0])?.title||changes[0]?.title||detail||''):'';
  S.activityLog.unshift({id:uid(),timestamp:Date.now(),action:String(action||'Change'),detail:String(detail||''),changes,titleIds:exactIds,titleSnapshot,xpEarned});
  if(S.activityLog.length>1000)S.activityLog.length=1000;
};
function v50NormalizeHistoryTitle(v){
  return cleanTitle(String(v||'')).trim().toLocaleLowerCase();
}
function v50LibraryLookup(){
  const byId=new Map(), byTitle=new Map();
  for(const item of (S.library||[])){
    if(!item?.id)continue;
    byId.set(item.id,item);
    const key=v50NormalizeHistoryTitle(item.title);
    if(!key)continue;
    const list=byTitle.get(key)||[];
    list.push(item.id);
    byTitle.set(key,list);
  }
  return {byId,byTitle};
}
function v50LegacyHistoryTitle(x){
  const candidates=[];
  if(x?.titleSnapshot)candidates.push(x.titleSnapshot);
  if(x?.title)candidates.push(x.title);
  for(const c of (x?.changes||[])) if(c?.title)candidates.push(c.title);
  // Old transactions commonly stored the affected title directly as detail.
  if(x?.detail)candidates.push(x.detail);
  return [...new Set(candidates.map(v=>String(v||'').trim()).filter(Boolean))];
}
function v43FindLogTitles(x,lookup){
  lookup=lookup||v50LibraryLookup();
  // Modern records: IDs are authoritative. Never fall back to text if an ID exists.
  const stored=[...(x?.titleIds||[]),...(x?.libraryIds||[])].filter(Boolean);
  if(stored.length)return [...new Set(stored)].filter(id=>lookup.byId.has(id));

  // Legacy records: exact normalized title only, and only when unique.
  // No includes()/substring matching: "Ai" can never match "Sendokai Champions".
  const hits=[];
  for(const title of v50LegacyHistoryTitle(x)){
    const ids=lookup.byTitle.get(v50NormalizeHistoryTitle(title))||[];
    if(ids.length===1)hits.push(ids[0]);
  }
  return [...new Set(hits)];
}
function v50MigrateLibraryHistoryLinks(){
  if(!Array.isArray(S.activityLog)||!S.activityLog.length)return {linked:0,ambiguous:0};
  const lookup=v50LibraryLookup();
  let linked=0, ambiguous=0;
  for(const x of S.activityLog){
    if(!x||typeof x!=='object')continue;
    const existing=[...(x.titleIds||[]),...(x.libraryIds||[])].filter(id=>lookup.byId.has(id));
    if(existing.length){
      x.titleIds=[...new Set(existing)];
      if(!x.titleSnapshot && x.titleIds.length===1)x.titleSnapshot=cleanTitle(lookup.byId.get(x.titleIds[0])?.title||'');
      continue;
    }
    const matches=[];
    for(const title of v50LegacyHistoryTitle(x)){
      const ids=lookup.byTitle.get(v50NormalizeHistoryTitle(title))||[];
      if(ids.length===1)matches.push(ids[0]);
      else if(ids.length>1)ambiguous++;
    }
    const unique=[...new Set(matches)];
    if(unique.length===1){
      x.titleIds=unique;
      x.titleSnapshot=cleanTitle(lookup.byId.get(unique[0])?.title||'');
      x.linkMigratedV50=true;
      linked++;
    }
  }
  S.migrations=S.migrations||{};
  S.migrations.libraryHistoryExactIdsV50={done:true,at:Date.now(),linked};
  return {linked,ambiguous};
}
function v43ActivityHtml(){

}

function v43BalanceGuidance(cat,status){const a=suggestedAmount(cat),mid=Math.max(1,Math.round((a.low+a.high)/2)),mins=Math.max(0,Math.round(mid*(Number(cat.minutesPerUnit)||0))),base=Math.max(1,Number(cat.target)||1),baseMin=Math.round(base*(Number(cat.minutesPerUnit)||0));if(status==='overused'||a.direction==='reduced'){const less=Math.max(0,base-mid),lessMin=Math.max(0,baseMin-mins);return `<b>Cool-down guidance:</b> if this rotates now, about ${mid} ${unitLabel(cat.unit,mid)} (~${mins} min), ${less} ${unitLabel(cat.unit,less)} / ~${lessMin} min less than the normal target.`;}if(status==='neglected'||status==='due'||a.direction==='increased'){return `<b>Catch-up guidance:</b> about ${a.low===a.high?a.low:`${a.low}–${a.high}`} ${unitLabel(cat.unit,mid)} (~${Math.round(a.low*(cat.minutesPerUnit||0))}${a.low===a.high?'':`–${Math.round(a.high*(cat.minutesPerUnit||0))}`} min) if selected now. This grows or shrinks with the scheduler's live balance calculation.`;}return `<b>Balanced guidance:</b> about ${a.low===a.high?a.low:`${a.low}–${a.high}`} ${unitLabel(cat.unit,mid)} (~${Math.round(a.low*(cat.minutesPerUnit||0))}${a.low===a.high?'':`–${Math.round(a.high*(cat.minutesPerUnit||0))}`} min) if selected now.`;}

function stopwatchAddTime(){if(S.stopwatch.running)return;const h=Math.max(0,Math.min(999,Number(document.getElementById('sw-hours')?.value)||0)),m=Math.max(0,Math.min(59,Number(document.getElementById('sw-minutes')?.value)||0)),sec=Math.max(0,Math.min(59,Number(document.getElementById('sw-seconds')?.value)||0));const add=Math.round((h*3600+m*60+sec)*1000);if(!add){showToast('Enter a time to add.');return;}S.stopwatch.elapsed=Math.max(0,Number(S.stopwatch.elapsed)||0)+add;S.stopwatch.resetValue=S.stopwatch.elapsed;S.stopwatch.startedAt=0;persistTask();render();showToast(`Added ${fmtStopwatch(add)} · ${fmtStopwatch(S.stopwatch.elapsed)} total ✓`);}

async function v44FindCover(){

  if(!title){showToast('Enter a title first.');return;}
  const catId=document.getElementById('l-category')?.value||'',cat=getCategory(catId);
  showToast('Searching multiple cover sources…');
  const results=[],seen=new Set();
  const add=(url,name,meta,provider)=>{url=String(url||'').trim();if(!url||seen.has(url))return;seen.add(url);results.push({url,name:cleanTitle(name||title),meta:String(meta||''),provider});};
  try{
    const animeLike=catId==='seasonal'||catId==='backlog'||catId==='animemovies'||/anime/i.test(cat?.name||'');
    const reading=cat?.type==='reading'||/manga|manhwa|manhua|comic/i.test(cat?.name||'');
    if(animeLike||reading){
      try{const endpoint=reading?'manga':'anime';const r=await fetch(`https://api.jikan.moe/v4/${endpoint}?q=${encodeURIComponent(title)}&limit=8`);if(r.ok){const j=await r.json();for(const x of (j?.data||[])){add(x?.images?.jpg?.large_image_url||x?.images?.jpg?.image_url,x?.title_english||x?.title,x?.year||x?.published?.from?.slice?.(0,4)||'',`Jikan / ${reading?'Manga':'Anime'}`);}}}catch(e){console.warn('Jikan cover search failed',e);}
    }
    if(cat?.type==='video'&&!animeLike){
      try{const r=await fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(title));if(r.ok){const j=await r.json();for(const row of (j||[]).slice(0,8)){const x=row.show;add(x?.image?.original||x?.image?.medium,x?.name,x?.premiered?.slice?.(0,4)||'', 'TVmaze');}}}catch(e){console.warn('TVmaze cover search failed',e);}
    }
    if(reading){
      try{const r=await fetch('https://openlibrary.org/search.json?title='+encodeURIComponent(title)+'&limit=8&fields=title,first_publish_year,cover_i');if(r.ok){const j=await r.json();for(const x of (j?.docs||[])){if(x.cover_i)add(`https://covers.openlibrary.org/b/id/${x.cover_i}-L.jpg`,x.title,x.first_publish_year||'','Open Library');}}}catch(e){console.warn('Open Library cover search failed',e);}
    }
    if(!results.length){showToast('No automatic cover found. You can paste an external image URL manually.');return;}
    v45ShowCoverPicker(title,results);
  }catch(e){console.error(e);showToast('Could not retrieve covers. You can paste an external image URL manually.');}
}

function v46Yield(){ return new Promise(r=>setTimeout(r,0)); }
function v46CompletedLibraryCount(){ return (S.library||[]).filter(i=>i && (i.status==='completed' || (i.total!=null && Number(i.total)>0 && Number(i.progress)>=Number(i.total)))).length; }
function v46LibraryBaseXP(){
  if(levelingSettings().enabled===false) return 0;
  const add=Math.max(0,Math.round(Number(levelingSettings().libraryAdditionXP)||0));
  const complete=Math.max(0,Math.round(Number(levelingSettings().completionXP)||0));
  return (S.library||[]).length*add + v46CompletedLibraryCount()*complete;
}
function v46ExtraLibraryXP(){
  const edits=Object.values(S.xpLedger?.libraryEdits||{}).reduce((a,v)=>a+(Number(v)||0),0);
  const covers=Object.values(S.xpLedger?.manualCovers||{}).reduce((a,v)=>a+(Number(v)||0),0);
  return edits+covers;
}
// v46 source of truth: current Library earns the configured title + completion XP.
// Existing edit/manual-cover ledgers remain event based and are preserved.
libraryXPTotal=function(){ return v46LibraryBaseXP()+v46ExtraLibraryXP(); };

sessionStoredXP=function(s){
  if(!s || s.status==='skipped') return 0;
  const stored=Number(s.xp);
  if(Number.isFinite(stored) && stored>0) return stored;
  // Imported/legacy history frequently contains xp:0 because the old importer
  // created history before progression was reconstructed. Positive consumption
  // must still contribute XP after restore/import.
  if((Number(s.actualAmount)||0)>0 && (Number(s.minutes)||0)>0){
    const cat=getCategory(s.categoryId);
    return calculateConsumptionXP(cat,Number(s.actualAmount)||0,Number(s.minutes)||0,s.healthStatus||'healthy').xp;
  }
  return 0;
};

async function v46RecalculateXP(force=false){
  const sessions=S.sessions||[], total=Math.max(1,sessions.length);
  for(let i=0;i<sessions.length;i++){
    const x=sessions[i];
    if(!x || x.status==='skipped'){ if(x) x.xp=0; continue; }
    const should=force || !Number.isFinite(Number(x.xp)) || (Number(x.xp)===0 && (Number(x.actualAmount)||0)>0 && (Number(x.minutes)||0)>0);
    if(should){
      const cat=getCategory(x.categoryId);
      x.xp=calculateConsumptionXP(cat,Number(x.actualAmount)||0,Number(x.minutes)||0,x.healthStatus||'healthy').xp;
    }
    if(i && i%500===0){ updateDataProgress(12+Math.round((i/total)*58),`Calculating History XP… ${i.toLocaleString()} / ${sessions.length.toLocaleString()}`); await v46Yield(); }
  }
  // Rebuild completion timeline from Library when an old backup did not contain it.
  S.completionTimeline=Array.isArray(S.completionTimeline)?S.completionTimeline:[];
  const seen=new Set(S.completionTimeline.map(x=>x?.libraryId).filter(Boolean));
  for(const item of (S.library||[])){
    const complete=item && (item.status==='completed' || (item.total!=null && Number(item.total)>0 && Number(item.progress)>=Number(item.total)));
    if(complete && !seen.has(item.id)){
      S.completionTimeline.push({libraryId:item.id,title:cleanTitle(item.title),categoryId:item.categoryId,completedAt:item.completedAt||item.createdAt||Date.now()});
      seen.add(item.id);
    }
  }
  return mediaFlowLevelInfo();
}

/* ============================================================
   v76 — On This Day: whole-day activity
   ============================================================ */
renderOnThisDay=function(){
  const now=new Date(), groups=new Map();
  for(const s of (S.sessions||[])){
    if(!s || s.status==='skipped') continue;
    const d=new Date(Number(s.timestamp)||0);
    if(Number.isNaN(d.getTime())) continue;
    const years=now.getFullYear()-d.getFullYear();
    if(years<1 || d.getMonth()!==now.getMonth() || d.getDate()!==now.getDate()) continue;
    if(!groups.has(years)) groups.set(years,[]);
    const rows=groups.get(years);
    for(const t of (s.titles||[])){
      if(!t?.title) continue;
      rows.push({
        title:t.title, libraryId:t.libraryId||null,
        qty:Number(t.qty ?? t.amount ?? 0)||0,
        categoryId:t.categoryId || s.categoryId || null,
        minutes:Number(t.minutes)||0, timestamp:Number(s.timestamp)||0
      });
    }
  }
  if(!groups.size) return '';
  const years=Math.min(...groups.keys()), raw=groups.get(years).sort((a,b)=>a.timestamp-b.timestamp);
  const merged=[], byKey=new Map();
  for(const x of raw){
    const key=x.libraryId ? `id:${x.libraryId}` : `title:${cleanTitle(x.title).toLowerCase()}`;
    let m=byKey.get(key);
    if(!m){m={...x,qty:0,minutes:0};byKey.set(key,m);merged.push(m);}
    m.qty+=x.qty; m.minutes+=x.minutes;
  }
  if(!merged.length) return '';
  const first=merged[0], firstItem=v50FindLibraryItem(first.libraryId,first.title), cover=v50Cover(firstItem);
  const extra=merged.length-1;
  const amountText=x=>{
    const item=v50FindLibraryItem(x.libraryId,x.title), cat=getCategory(item?.categoryId||x.categoryId);
    const unit=cat?.unit||'';
    const bits=[];
    if(x.qty>0) bits.push(`${x.qty} ${escapeHtml(unit||'unit'+(x.qty===1?'':'s'))}`);
    if(x.minutes>0) bits.push(fmtMinutes(x.minutes));
    return bits.join(' · ');
  };
  const rows=merged.map(x=>{
    const item=v50FindLibraryItem(x.libraryId,x.title), cat=getCategory(item?.categoryId||x.categoryId), img=v50Cover(item);
    return `<div class="v76-otd-row">${img||`<div class="v76-otd-placeholder">${cat?.icon||'📚'}</div>`}<div class="v76-otd-row-copy"><b>${escapeHtml(cleanTitle(x.title))}</b><small>${escapeHtml(cat?.name||'Library')}${amountText(x)?` · ${amountText(x)}`:''}</small></div></div>`;
  }).join('');
  return `<details class="on-this-day v76-otd ${cover?'v50-onthisday':''}"><summary class="v76-otd-summary">${cover}<div class="v76-otd-copy"><span>On this day · ${years} year${years===1?'':'s'} ago you logged</span><b>${escapeHtml(cleanTitle(first.title))}</b>${firstItem?`<small>${escapeHtml(getCategory(firstItem.categoryId)?.name||'Library')}</small>`:''}${extra?`<span class="v76-otd-more">+${extra} more logged that day · tap to view all</span>`:`<span class="v76-otd-more">Tap to view details</span>`}</div><span class="v76-otd-chevron">⌄</span></summary><div class="v76-otd-list">${rows}</div></details>`;
};



/* ============================================================
   MediaFlow v91 — Import Category Mapping
   Every detected imported media type is explicitly mapped to a
   current MediaFlow category ID before any Library merge occurs.
   ============================================================ */
const V91_TYPE_LABELS={anime:'Anime',anime_movie:'Anime Movie',manga:'Manga',manhwa:'Manhwa / Manhua',tv:'TV / Series',movie:'Movie',comics:'Comics / Issues',other_animation:'Other Animation',unknown:'Other / Unknown'};
function v91TypeLabel(t){return V91_TYPE_LABELS[t]||String(t||'Unknown')}
function v91ImportedType(raw,service){
  const nested=raw?.show||raw?.movie||raw?.media||raw?.anime||raw?.item||{};
  const o=Object.assign({},nested,raw), group=String(o.__group||'').toLowerCase();
  const kind=String(mfFirst(o,['media_type','type','kind','format','category','list_type','content_type','series_type'])||'').toLowerCase();
  const all=`${group} ${kind}`;
  if(/manhwa|manhua/.test(all)) return 'manhwa';
  if(/manga|chapter/.test(all)) return 'manga';
  if(/comic|issue/.test(all)) return 'comics';
  if(/anime/.test(all)) return /movie|film/.test(all)?'anime_movie':'anime';
  if(/animation|cartoon/.test(all)) return 'other_animation';
  if(/movie|film/.test(all)) return ['mal','malxml','anilist','anisearch','aniwatch','hianime','livechart','kitsu','crunchyroll'].includes(service)?'anime_movie':'movie';
  if(/show|series|tv/.test(all)) return 'tv';
  if(group==='movies') return 'movie';
  if(group==='shows') return 'tv';
  if(group==='anime') return 'anime';
  if(['mal','malxml','anilist','anisearch','aniwatch','hianime','livechart','kitsu','crunchyroll'].includes(service)) return 'anime';
  if(['letterboxd','criticker','moviesfad'].includes(service)) return 'movie';
  return 'unknown';
}
function v91DefaultCategory(type){
  const preferred={anime:['backlog','seasonal'],anime_movie:['animemovies','backlog'],manga:['manga'],manhwa:['manhwa','manga'],tv:['tv'],movie:['movies'],comics:['comics'],other_animation:['otheranim','tv'],unknown:['tv']};
  for(const id of preferred[type]||[]) if(S.categories.some(c=>c.id===id)) return id;
  const wantUnit={anime:'episodes',anime_movie:'movies',manga:'chapters',manhwa:'chapters',tv:'episodes',movie:'movies',comics:'issues',other_animation:'episodes'}[type];
  return S.categories.find(c=>!wantUnit||c.unit===wantUnit)?.id||S.categories[0]?.id||'__skip__';
}
function v91CategoryOptions(selected){
  return `<option value="__unassigned__"${!selected||selected==='__unassigned__'?' selected':''} disabled>Select a destination category…</option><option value="__skip__"${selected==='__skip__'?' selected':''}>Do not import this type</option>`+S.categories.map(c=>`<option value="${escapeHtml(c.id)}"${c.id===selected?' selected':''}>${escapeHtml(c.icon||'📚')} ${escapeHtml(c.name)}</option>`).join('');
}
function v91MappingModalHtml(d){
  const p=S.pendingImport, counts=p?.typeCounts||{}, types=Object.keys(counts);
  return `<div class="priority-modal"><div class="modal-title">Choose import destinations</div><div style="color:var(--text-dim);font-size:13px;line-height:1.6">MediaFlow found <b>${Number(p?.records?.length||0).toLocaleString()}</b> records in <b>${escapeHtml(d?.fileName||'file')}</b>. You must manually assign every detected media type before the import can start.</div><div class="card" style="padding:11px 13px;margin:13px 0 0;background:var(--panel-2);font-size:11.5px;line-height:1.55;color:var(--text-dim)">No destination is selected automatically. Choose a category for every detected media type (or explicitly choose Do not import this type). Your selection is stored by internal category ID, so renamed or same-named categories remain distinct.</div><div class="v91-map-list">${types.map(t=>`<div class="v91-map-row"><div class="v91-map-type"><b>${escapeHtml(v91TypeLabel(t))}</b><small>${Number(counts[t]||0).toLocaleString()} detected title${counts[t]===1?'':'s'}</small></div><label><span class="v91-map-arrow">→</span><select data-v91-type="${escapeHtml(t)}" onchange="App.setImportMapping('${escapeHtml(t)}',this.value)">${v91CategoryOptions(p.mapping?.[t])}</select><div class="v92-map-required">Required — choose a destination</div></label></div>`).join('')}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="App.cancelPendingImport()">Cancel</button><button class="btn btn-primary" onclick="App.confirmPendingImport()">Import with mapping</button></div></div>`;
}
const _v91OldImportConfirmHtml=mfImportConfirmModalHtml;
mfImportConfirmModalHtml=function(d){return d?.v91Mapping?v91MappingModalHtml(d):_v91OldImportConfirmHtml(d)};
function v91XmlRecords(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  if(doc.querySelector('parsererror')) throw new Error('The XML file could not be parsed.');
  return [...doc.querySelectorAll('anime,manga,item,entry,movie,show,series')].map(n=>{const o={__group:n.tagName.toLowerCase()};for(const el of n.children)o[el.tagName.toLowerCase()]=el.textContent?.trim()||'';return o});
}
mfXmlRecords=v91XmlRecords;
async function v91ReadImportRecords(service,file){
  const text=await file.text(),name=String(file.name||'').toLowerCase();
  let records;
  if(name.endsWith('.xml')||/^\s*</.test(text)) records=mfXmlRecords(text);
  else if(name.endsWith('.csv')||(!name.endsWith('.json')&&text.includes(','))) records=mfCsvParse(text);
  else records=mfFlattenJson(JSON.parse(text));
  if(!records.length) throw new Error('No recognizable media records were found.');
  return records;
}
async function v91PrepareMappedImport(kind,service,file){
  if(!file)return;
  showDataProgress('Reading import file','Detecting media types…',30);
  try{
    const records=await v91ReadImportRecords(service,file),typeCounts={};
    for(const r of records){const t=v91ImportedType(r,service);typeCounts[t]=(typeCounts[t]||0)+1;}
    const mapping={};for(const t of Object.keys(typeCounts))mapping[t]='__unassigned__';
    S.pendingImport={kind,service,file,records,typeCounts,mapping};
    closeDataProgress();
    S.modal={type:'importMapping',data:{mode:'merge',v91Mapping:true,fileName:file.name,serviceName:mfServiceName(service)}};
    render();
  }catch(e){console.error(e);finishDataProgress(false,'Import failed',e.message||'MediaFlow could not understand this export file.');}
}
function v91SetImportMapping(type,categoryId){if(!S.pendingImport?.mapping)return;S.pendingImport.mapping[type]=categoryId;const el=document.querySelector(`[data-v91-type="${CSS.escape(type)}"]`);if(el){el.classList.remove('v92-map-invalid');const note=el.parentElement?.querySelector('.v92-map-required');if(note)note.textContent=categoryId==='__skip__'?'This media type will be skipped':'Destination assigned';}}
function v91NormalizeRecord(rec,service,mapping){
  const r=mfNormalizeRecord(rec,service);if(!r)return null;
  const importType=v91ImportedType(rec,service),dest=mapping?.[importType];
  if(dest==='__skip__')return {skip:true,importType};
  if(dest&&S.categories.some(c=>c.id===dest))r.categoryId=dest;
  r.importType=importType;return r;
}
function v91MergeExchangeRecords(records,service,mapping){
  let added=0,updated=0,skipped=0;
  for(const raw of records){
    const r=v91NormalizeRecord(raw,service,mapping);if(!r||r.skip){skipped++;continue;}
    let item=S.library.find(i=>Object.entries(r.externalIds||{}).some(([k,v])=>v&&i.externalIds?.[k]&&String(v)===String(i.externalIds[k])));
    // Title fallback is destination-aware so two custom lists can safely contain the same title.
    if(!item)item=S.library.find(i=>i.categoryId===r.categoryId&&cleanTitle(i.title).toLowerCase()===r.title.toLowerCase()&&(!r.year||!i.year||Number(i.year)===Number(r.year)));
    if(item){
      item.categoryId=r.categoryId;item.progress=Math.max(Number(item.progress)||0,r.progress);if(r.total)item.total=r.total;item.status=r.status;item.rating=r.rating??item.rating;item.year=r.year||item.year;item.externalIds=Object.assign({},item.externalIds||{},r.externalIds);item.source=service;item.tags=[...new Set([...(item.tags||[]),mfServiceName(service)])];item.modifiedAt=Date.now();updated++;
    }else{
      S.library.push({id:uid(),title:r.title,categoryId:r.categoryId,progress:r.progress,total:r.total,status:r.status,priority:'medium',estimatedMinutes:null,tags:[mfServiceName(service)],source:service,year:r.year,rating:r.rating,externalIds:r.externalIds,createdAt:Date.now(),modifiedAt:Date.now(),completedAt:r.status==='completed'?Date.now():null});added++;
    }
  }
  normalizeSeasonalLibraryItems();return{added,updated,skipped};
}
async function v91RunMappedImport(x){
  showImportProgress(`Importing ${mfServiceName(x.service)}`,x.records.length);
  try{
    mfBegin(`${mfServiceName(x.service)} import`,x.file.name);
    const r=v91MergeExchangeRecords(x.records,x.service,x.mapping);
    mfCommit(`${mfServiceName(x.service)} import`,`${r.added} added, ${r.updated} updated`);
    updateImportProgress(x.records.length,x.records.length,r.added,r.updated,r.skipped,'Saving imported data…');await saveState();
    finishImportProgress(true,`${mfServiceName(x.service)} import complete`,`${r.added.toLocaleString()} titles added, ${r.updated.toLocaleString()} updated${r.skipped?`, ${r.skipped.toLocaleString()} skipped`:''}.`);render();
  }catch(e){console.error(e);finishImportProgress(false,'Import failed',e.message||'MediaFlow could not understand this export file.');}
}
async function v91ConfirmPendingImport(){
  const x=S.pendingImport;if(!x)return;
  if(x.records&&x.mapping){const missing=Object.keys(x.typeCounts||{}).filter(t=>!x.mapping[t]||x.mapping[t]==='__unassigned__');if(missing.length){for(const t of missing){const el=document.querySelector(`[data-v91-type="${CSS.escape(t)}"]`);if(el){el.classList.add('v92-map-invalid');const note=el.parentElement?.querySelector('.v92-map-required');if(note)note.textContent='Required — choose a destination';}}toast(`Assign a destination for ${missing.length} media type${missing.length===1?'':'s'} before importing.`,'warn');return;}}
  S.pendingImport=null;S.modal=null;render();
  if(x.kind==='backup')return App.importJSON(x.file);
  if(x.records&&x.mapping)return v91RunMappedImport(x);
  return mfImportExchangeFile(x.service,x.file);
}
function v91PrepareExchangeImport(file){if(file)return v91PrepareMappedImport('exchange',document.getElementById('exchange-service')?.value||'json',file)}
function v91PrepareLegacyImport(service,file){if(file)return v91PrepareMappedImport(service==='mal'?'legacy-mal':'legacy-simkl',service,file)}
